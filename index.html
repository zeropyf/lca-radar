<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCA RADAR · 往期归档</title>
<style>
/* 品牌色板：主色 Deep Night #0f2841 ｜ 点缀 Teal #00BEBE ｜ 暖 Golden Hour #FAEBDC ｜ 浅蓝 First Blue #DCEAFA */
:root{
  --primary:#0f2841;          /* 主色：深蓝 */
  --accent:#00BEBE;           /* 点缀：青 */
  --accent-deep:#0a8f8f;      /* 青（小字号用加深保证对比） */
  --link:#335176;             /* 内链蓝 */
  --warm:#FAEBDC;             /* 暖底 */
  --blue-soft:#DCEAFA;        /* 浅蓝 */
  --paper:#FFFFFF;
  --ink:rgba(0,0,0,.88);      /* 条目标题近黑 */
  --body:#54585A;             /* 正文深灰 */
  --gray:#8D8D8F;             /* 次要银灰 */
  --faint:#B9B9BC;
  --line:#E4E4E6;
  --hover:#F4F6F8;            /* 列表悬停底 */
  --seg-bg:#F1F3F5;           /* 分段控件底 */
  --seg-on:#FFFFFF;           /* 分段控件选中 */
  --card:#FFFFFF;             /* 浮层卡片底 */
  color-scheme:light dark;
}
/* 深色变量：跟随系统（"跟随系统"被选中 且 系统为深色时）——纯 CSS，经 :has() 生效 */
@media (prefers-color-scheme:dark){
  html:has(.theme-switch input[value="auto"]:checked){
  --primary:#dce8f7;
  --accent:#33d6d6;
  --accent-deep:#33d6d6;
  --link:#9cc0e8;
  --warm:#17222f;
  --blue-soft:#1b3a5c;
  --paper:#0d141f;
  --ink:#edf1f6;
  --body:#a9b3c0;
  --gray:#8b96a5;
  --faint:#5d6a7d;
  --line:#233142;
  --hover:#16202e;
  --seg-bg:#1a2434;
  --seg-on:#2b3c55;
  --card:#141e2c;
  color-scheme:dark;
  }
  html:has(.theme-switch input[value="auto"]:checked) .sidenav .logo svg .b2{fill:#8fb8e8}
  html:has(.theme-switch input[value="auto"]:checked) .sidenav .logo svg .r1{stroke:#0e7c7c}
}
/* 深色变量：手动选择"深色"（后出现，优先于跟随系统） */
html:has(.theme-switch input[value="dark"]:checked){
  --primary:#dce8f7;
  --accent:#33d6d6;
  --accent-deep:#33d6d6;
  --link:#9cc0e8;
  --warm:#17222f;
  --blue-soft:#1b3a5c;
  --paper:#0d141f;
  --ink:#edf1f6;
  --body:#a9b3c0;
  --gray:#8b96a5;
  --faint:#5d6a7d;
  --line:#233142;
  --hover:#16202e;
  --seg-bg:#1a2434;
  --seg-on:#2b3c55;
  --card:#141e2c;
  color-scheme:dark;
}
html:has(.theme-switch input[value="dark"]:checked) .sidenav .logo svg .b2{fill:#8fb8e8}
html:has(.theme-switch input[value="dark"]:checked) .sidenav .logo svg .r1{stroke:#0e7c7c}
/* 浅色变量：手动选择"浅色"时，覆盖跟随系统的深色 */
html:has(.theme-switch input[value="light"]:checked){
  --primary:#0f2841;
  --accent:#00BEBE;
  --accent-deep:#0a8f8f;
  --link:#335176;
  --warm:#FAEBDC;
  --blue-soft:#DCEAFA;
  --paper:#FFFFFF;
  --ink:rgba(0,0,0,.88);
  --body:#54585A;
  --gray:#8D8D8F;
  --faint:#B9B9BC;
  --line:#E4E4E6;
  --hover:#F4F6F8;
  --seg-bg:#F1F3F5;
  --seg-on:#FFFFFF;
  --card:#FFFFFF;
  color-scheme:light;
}
/* ---------- 左下角：外观主题三态切换（纯 CSS radio，无 JS 也可切换；JS 仅做偏好记忆） ---------- */
.sidefoot{margin-top:auto;padding-top:14px}
/* 外观主题三态切换：滑动指示块由 :has() 纯 CSS 驱动；JS 仅做偏好记忆 */
.theme-switch{display:inline-flex;background:var(--seg-bg);border-radius:999px;padding:3px;gap:2px;
  margin-bottom:10px;position:relative}
.theme-switch label{flex:0 0 auto;cursor:pointer;position:relative;z-index:1}
.theme-switch input{position:absolute;opacity:0;pointer-events:none;width:0}
.theme-switch label span{display:flex;align-items:center;justify-content:center;width:36px;height:30px;
  border-radius:999px;color:var(--gray);transition:color .2s}
.theme-switch label span svg{width:16px;height:16px;display:block}
.theme-switch label:hover span{color:var(--primary)}
.theme-switch input:checked+span{color:var(--primary)}
.theme-switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.theme-switch .thumb{position:absolute;top:3px;left:3px;width:36px;height:30px;background:var(--seg-on);
  border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:0;pointer-events:none;
  transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
.theme-switch:has(input[value="light"]:checked) .thumb{transform:translateX(0)}
.theme-switch:has(input[value="auto"]:checked) .thumb{transform:translateX(38px)}
.theme-switch:has(input[value="dark"]:checked) .thumb{transform:translateX(76px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease}
.mock-tag{position:fixed;top:12px;right:12px;z-index:50;background:#0f2841;color:#fff;
  font-size:12px;padding:6px 12px;border-radius:999px;opacity:.92}
/* ---------- 动效：克制优雅，只用于可交互元素 ---------- */
html{scroll-behavior:smooth}
.golink,.totop,.seg span,.theme-switch label span,.arc,.hl-item,.toc a,.masthead .cal .grid a.d{
  transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,color .18s ease,border-color .18s ease}
.golink:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(15,40,65,.10)}
.golink:active{transform:translateY(0) scale(.98)}
.totop:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,40,65,.16)}
.totop:active{transform:scale(.94)}
.seg span:active,.theme-switch label span:active{transform:scale(.94)}
.arc:hover{transform:translateX(3px)}
.hl-item:hover,.toc a:hover{transform:translateX(2px)}
.masthead .cal .grid a.d{text-decoration:none;border-radius:50%;cursor:pointer}
.masthead .cal .grid a.d:hover{background:var(--blue-soft);transform:scale(1.15)}
.masthead .cal .grid .d.today.has::after{display:none}
.masthead .cal .grid a.d.today:hover{background:var(--accent)}
.arc:target{animation:arcFlash 1.8s ease}
@keyframes arcFlash{0%{box-shadow:0 0 0 0 rgba(0,190,190,.5);background-color:var(--blue-soft)}
  100%{box-shadow:0 0 0 14px rgba(0,190,190,0);background-color:transparent}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}
  .golink,.totop,.seg span,.theme-switch label span,.arc,.hl-item,.toc a,.masthead .cal .grid a.d,.seg .thumb,.theme-switch .thumb{transition:none}
  .arc:target{animation:none}}

.shell{max-width:1260px;margin:0 auto;padding:0 28px;
  display:grid;grid-template-columns:200px minmax(0,740px) 220px;gap:36px}

/* ---------- 左：导航＋往期 ---------- */
.sidenav{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:28px 6px 28px 0;
  display:flex;flex-direction:column;gap:4px;font-size:14.5px;scrollbar-width:thin}
.sidenav .logo{font-weight:900;font-size:20px;letter-spacing:.06em;margin-bottom:18px;color:var(--primary);display:flex;align-items:center;gap:9px}.sidenav .logo svg{flex:0 0 auto;display:block}
.sidenav .logo .lca{color:var(--accent)}
.sidenav .grp{font-size:12px;color:var(--faint);margin:16px 0 6px;letter-spacing:.1em}
.sidenav a.nav{display:block;color:var(--body);text-decoration:none;padding:7px 12px;border-radius:8px;font-size:14px}
.sidenav a.nav:hover{background:var(--hover)}
.sidenav a.nav.cur{background:var(--blue-soft);color:var(--primary);font-weight:700}
/* 日报/周报切换（含滑动指示块） */
.seg{display:flex;background:var(--seg-bg);border-radius:999px;padding:3px;margin-bottom:10px;position:relative}
.typeseg{margin:6px 0 4px}
.typeseg span{cursor:pointer}
.seg span{flex:1;text-align:center;font-size:12.5px;padding:5px 0;border-radius:999px;color:var(--gray);cursor:default;
  position:relative;z-index:1}
.seg span.on{color:var(--primary);font-weight:700}
.seg .thumb{flex:none;position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);padding:0;
  background:var(--seg-on);border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:0;
  transition:transform .32s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.seg .thumb.right{transform:translateX(100%)}
/* 往期列表 */
.arc{display:flex;gap:12px;align-items:center;text-decoration:none;padding:9px 10px;border-radius:10px;margin-bottom:2px}
.arc:hover{background:var(--hover)}
.arc.cur{background:var(--blue-soft)}
.arc .d{font-size:23px;font-weight:900;color:var(--primary);line-height:1;min-width:30px;text-align:center}
.arc .tx b{display:block;font-size:13px;color:var(--ink);font-weight:700;line-height:1.5}
.arc .tx i{display:block;font-style:normal;font-size:12px;color:var(--gray);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:122px}
.sidenav .foot{font-size:12px;color:var(--faint);margin-top:10px}

/* ---------- 中：主内容 ---------- */
.maincol{min-width:0;padding:26px 0 60px}
/* 刊头：标题左＋日历右，压缩纵向空间 */
.masthead{display:flex;gap:28px;align-items:flex-start;margin:2px 0 22px}
.mast-left{flex:1;min-width:0}
.mast-meta{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--gray);margin-bottom:4px}
.mast-meta .issue-no{color:var(--primary);font-weight:700;letter-spacing:.08em}
h1.mast{font-size:62px;font-weight:900;margin:2px 0 2px;letter-spacing:.04em;line-height:1.15;color:var(--primary)}
h1.mast .lca{color:var(--accent)}
.brand-sub{color:var(--faint);font-size:13px;letter-spacing:.42em;margin-bottom:12px}
.mast-sub2{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--body)}
.mast-sub2 .kind{font-size:12px;font-weight:800;color:var(--accent-deep);background:var(--blue-soft);
  padding:2px 12px;border-radius:999px;white-space:nowrap}
/* 右侧月历卡（紧凑） */
.masthead .cal{background:var(--warm);border-radius:12px;padding:10px 13px 11px;min-width:192px;flex:none;margin-top:4px}
.masthead .cal .t{font-size:12px;color:var(--body);margin-bottom:6px}
.masthead .cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  font-size:11px;color:var(--faint);text-align:center}
.masthead .cal .grid b{font-weight:400}
.masthead .cal .grid .d{position:relative;padding:3px 0;color:var(--body)}
.masthead .cal .grid .d.has::after{content:"";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--accent)}
.masthead .cal .grid .d.today{color:#fff;background:var(--accent);border-radius:50%;font-weight:700;
  width:22px;height:22px;padding:0;margin:0 auto;display:inline-flex;align-items:center;justify-content:center}

/* 统计条 */
.stats{border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:34px;padding:14px 4px;margin-bottom:30px;flex-wrap:wrap}
.stats .st .n{font-size:27px;font-weight:900;letter-spacing:.01em;color:var(--primary)}
.stats .st .l{font-size:12px;color:var(--gray);margin-left:6px}
.stats .read{margin-left:auto;font-size:13px;color:var(--gray)}

/* ---------- 板块标题（层级强化） ---------- */
.sec{margin-bottom:36px}
.sec-head{display:flex;align-items:center;gap:12px;margin:48px 0 10px}
.sec:first-of-type .sec-head{margin-top:34px}
.sec-num{font-size:12px;font-weight:800;color:var(--primary);background:var(--blue-soft);
  padding:4px 12px;border-radius:999px;letter-spacing:.1em;white-space:nowrap;flex:none}
.sec-title h2{font-size:21px;font-weight:800;color:var(--primary);margin:0;line-height:1.3;letter-spacing:.02em}
.sec-title .en{font-size:10.5px;color:var(--faint);letter-spacing:.22em;margin-top:2px}
.sec-head .more{margin-left:auto;font-size:13px;color:var(--link);text-decoration:none;white-space:nowrap}
.sec-head .more:hover{text-decoration:underline}
/* 三层架构：细分割线＋子专题（层只做 quiet grouping） */
.layer{margin-bottom:10px}
.layer-div{display:flex;align-items:center;gap:12px;margin:54px 0 0}
.layer:first-of-type .layer-div{margin-top:38px}
.layer-div .tick{width:22px;height:3px;background:var(--accent);border-radius:2px;flex:none}
.layer-div .zh{font-size:13px;font-weight:800;color:var(--primary);letter-spacing:.3em;white-space:nowrap}
.layer-div .en{font-size:10.5px;color:var(--faint);letter-spacing:.22em;white-space:nowrap}
.layer-div .rule{flex:1;height:1px;background:var(--line)}
.layer-div .lc{font-size:12.5px;color:var(--gray);white-space:nowrap}
.layer .sec{margin-bottom:30px}
.layer .sec-head{margin-top:28px}
.layer .sec-num{font-size:12px}
.toc .toc-layer{font-size:12px;color:var(--faint);letter-spacing:.14em;margin:12px 0 2px;font-weight:700}

/* ---------- 条目 ---------- */
.item{padding:24px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.srcrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--gray);margin-bottom:8px;flex-wrap:wrap}
/* 条目标题超链接：常态近黑、悬停变主色＋下划线＋外链箭头 */
.item h3{font-size:18px;font-weight:800;line-height:1.55;margin:0 0 8px}
.item h3 a{color:var(--ink);text-decoration:none;border-bottom:2px solid transparent;transition:color .15s}
.item h3 a:hover{color:var(--primary);border-bottom-color:var(--accent)}
.item h3 a .ext{color:var(--accent);font-size:.78em;margin-left:6px;opacity:0;transition:opacity .15s;font-weight:700}
.item h3 a:hover .ext{opacity:1}
.item .sum{font-size:15px;color:var(--body);margin:0 0 8px}
/* 关联提示：每条必有，无加粗标签，以细边线＋灰字低调呈现 */
.item .note{font-size:13px;color:var(--gray);margin:0 0 12px;padding-left:12px;
  border-left:2px solid var(--accent);line-height:1.8}
/* 原文链接按钮 */
.golink{display:inline-block;font-size:13px;font-weight:700;color:var(--primary);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:4px 15px;transition:border-color .15s,background .15s}
.golink:hover{border-color:var(--primary);background:var(--blue-soft)}
.golink .arr{margin-left:4px;font-weight:400}
.empty{padding:8px 0 8px;color:var(--faint);font-size:13px}

/* 文末 */
.tail{text-align:center;margin-top:44px;color:var(--gray);font-size:13.5px}
.tail .prev{display:inline-block;margin-bottom:14px;color:var(--link);text-decoration:none;font-size:14px}
.tail .prev:hover{text-decoration:underline}
.tail .end{letter-spacing:.5em;margin:6px 0 18px;color:var(--faint);font-size:13px}
.disclaimer{font-size:12px;color:var(--faint);line-height:1.9;max-width:640px;margin:0 auto}
/* 访问量统计（静态示意；正式版接入真实计数服务） */
.pv{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;
  font-size:12px;color:var(--faint)}
.pv svg{width:14px;height:14px;flex:none}
.pv b{color:var(--gray);font-weight:700}

/* ---------- 右：信息栏 ---------- */
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:28px 0;font-size:14px;scrollbar-width:thin}
.rail h4{font-size:13px;color:var(--primary);font-weight:800;margin:0 0 12px;letter-spacing:.06em}
.rail h4::before{content:"";display:inline-block;width:18px;height:3px;background:var(--accent);
  vertical-align:middle;margin-right:8px;border-radius:2px}
.rail .hl-item{display:flex;gap:12px;margin-bottom:16px;text-decoration:none}
.rail .hl-item .n{font-size:22px;font-weight:900;color:var(--accent);line-height:1.2}
.rail .hl-item .t b{display:block;font-size:13.5px;line-height:1.55;color:var(--ink);font-weight:700}
.rail .hl-item:hover .t b{color:var(--primary);text-decoration:underline}
.rail .hl-item .t span{font-size:12px;color:var(--faint)}
.rail .toc{margin-top:28px}
.rail .toc a{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--body);
  padding:5px 0;font-size:13.5px}
.rail .toc a:hover{color:var(--primary)}
.rail .toc .n{color:var(--accent-deep);font-weight:800;font-size:12.5px}
.rail .toc .c{margin-left:auto;color:var(--faint);font-size:12px}

.totop{position:fixed;right:26px;bottom:26px;width:46px;height:46px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--gray);font-size:18px;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.06)}
.totop:hover{color:var(--primary);border-color:var(--primary)}

@media(max-width:1180px){
  .shell{grid-template-columns:minmax(0,760px);max-width:820px}
  .sidenav,.rail{display:none}
  h1.mast{font-size:46px}
  .masthead{flex-direction:column;gap:16px}
  .masthead .cal{align-self:stretch}
  .headline h2{font-size:26px}
  .sec-title h2{font-size:21px}
}


/* 去重附录块 */
.pushed{border:1px dashed var(--line);border-radius:12px;padding:14px 18px;margin:26px 0}
.pushed h4{margin:0 0 8px;font-size:14px;color:var(--primary)}
.pushed h4 .en{display:block;font-size:11px;color:var(--faint);font-weight:400;letter-spacing:.06em;margin-top:2px}
.pushed ul{margin:0;padding:0;list-style:none}
.pushed li{font-size:13.5px;color:var(--body);padding:5px 0;border-top:1px solid var(--line)}
.pushed li:first-child{border-top:0}
.pushed .code{color:var(--accent-deep);font-weight:700;margin-right:8px;font-size:12.5px}
/* 日历：疏朗的月份缩览 */
.dcal{min-width:236px;padding:2px}
.dcal-mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.dcal-mhead span:first-child{font-size:15px;font-weight:700}
.dcal-c{font-size:12px;color:var(--gray)}
.dcal-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:10.5px;color:var(--faint);text-align:center;margin-bottom:6px}
.dcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dc{height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint);border-radius:8px;text-decoration:none}
a.dc.has{background:var(--accent);color:#fff;font-weight:700;font-size:11.5px}
a.dc.has:hover{transform:translateY(-1px)}
a.dc.has.today{outline:2px solid var(--accent);outline-offset:2px}
/* 页面重规划：左右栏等宽 300px，主栏居中，栏间距放宽 */
.shell{max-width:1500px;grid-template-columns:300px minmax(0,1fr) 300px;gap:40px}
/* 右栏看点：加宽后的舒适排版 */
/* 右栏：取消独立滚动，随页面自然下铺 */
.rail{position:static;height:auto;overflow:visible}
.hl-item{gap:13px;margin-bottom:18px}
.hl-item .t b{font-size:14px}
/* 往期：月份分组 + 大数字日期条目（版式逻辑参考 AIHOT 存档，视觉语言保持本刊） */
.arc-month{display:flex;justify-content:space-between;align-items:center;margin:0 2px 4px;padding:8px 6px;font-size:14px;font-weight:700;cursor:pointer;user-select:none;border-radius:10px}
.arc-month[hidden]{display:none}
.arc-month:hover{background:var(--blue-soft)}
.arc-month .am-l{display:flex;align-items:center;gap:7px}
.arc-month .chev{width:13px;height:13px;color:var(--gray);transition:transform .18s}
.arc-month.open .chev{transform:rotate(180deg)}
.arc-month .c{font-size:11.5px;color:var(--gray);font-weight:400}
.arclist .arc{align-items:flex-start;gap:12px;padding:12px 12px;border-radius:14px;margin-bottom:4px}
.ad{display:flex;flex-direction:column;align-items:center;min-width:40px;padding-top:2px}
.ad b{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.01em;color:var(--primary)}

.arc .tx{flex:1;min-width:0;padding-top:2px}
.arc .tx b{font-size:14.5px;font-weight:400;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arc .tx i{font-size:12px;margin-top:3px}
.arc.cur .ad b{color:var(--accent-deep)}
.arc-empty{padding:18px 14px;font-size:13px;color:var(--faint);text-align:center}
/* 查看原文：弱化为安静的文本链 */
.golink{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:400;color:var(--faint);border:none;border-radius:0;padding:0;background:none;text-decoration:none}
.golink:hover{color:var(--accent-deep);border:none;background:none;transform:none;box-shadow:none}
.golink .arr{margin-left:3px;font-weight:400}
/* 站内详情弹窗 */
.modal-ov{position:fixed;inset:0;background:rgba(10,22,32,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal-ov[hidden]{display:none}
.modal{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;max-height:84vh;overflow:auto;padding:28px 30px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.mclose{position:absolute;top:10px;right:12px;border:0;background:none;font-size:24px;color:var(--gray);cursor:pointer;line-height:1;padding:8px}
.mclose:hover{color:var(--ink)}
.msrc{font-size:12.5px;color:var(--gray);margin-bottom:8px}
.modal h2{font-size:21px;line-height:1.5;margin:0 0 6px;color:var(--ink);padding-right:28px}
.mmeta{font-size:12.5px;color:var(--faint);margin-bottom:14px}
.msum{font-size:15px;line-height:1.9;color:var(--body);margin:0 0 14px}
.mpoints{margin:0 0 14px;padding:14px 16px;background:var(--seg-bg);border-radius:10px}
.mpoints .pt{font-size:12px;letter-spacing:.2em;color:var(--accent-deep);font-weight:700;margin-bottom:8px}
.mpoints ul{margin:0;padding-left:18px;font-size:14px;line-height:1.9;color:var(--body)}
.mnote{font-size:13px;color:var(--gray);border-left:2px solid var(--accent);padding-left:12px;line-height:1.8;margin:0 0 18px}
.mgo{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;padding:10px 22px;border-radius:10px;text-decoration:none}
.mgo:hover{filter:brightness(1.06)}

<script>
function setType(weekly){
  var kind = weekly ? 'weekly' : 'daily';
  document.querySelectorAll('.typeseg span:not(.thumb)').forEach(function(x){
    x.classList.toggle('on', (x.textContent.trim() === '周报') === weekly);
  });
  var thumb = document.querySelector('.typeseg .thumb');
  if(thumb) thumb.classList.toggle('right', weekly);
  document.querySelectorAll('.arc-month').forEach(function(m){
    m.hidden = m.dataset.archiveKind !== kind;
    var list = document.getElementById(m.dataset.t);
    if(list) list.hidden = m.hidden || !m.classList.contains('open');
  });
}
document.querySelectorAll('.arc-month').forEach(function(m){
  function toggle(){
    var list = document.getElementById(m.dataset.t);
    if(!list) return;
    list.hidden = !list.hidden;
    m.classList.toggle('open', !list.hidden);
    m.setAttribute('aria-expanded', String(!list.hidden));
  }
  m.addEventListener('click', toggle);
  m.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){e.preventDefault(); toggle();}
  });
});
document.querySelectorAll('.typeseg span:not(.thumb)').forEach(function(el){
  function select(){setType(el.textContent.trim() === '周报');}
  el.addEventListener('click', select);
  el.setAttribute('role', 'button'); el.tabIndex = 0;
  el.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){e.preventDefault(); select();}
  });
});
setType(document.body.dataset.kind === 'weekly');
</script><script>document.querySelectorAll('.theme-switch input').forEach(function(r){r.addEventListener('change',function(){try{localStorage.setItem('lca-watch-theme',r.value);}catch(e){}});});</script>
