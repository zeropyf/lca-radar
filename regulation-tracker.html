: "CRMA 第 31(2) 条：欧委会须于 2025-11-24 前向欧洲议会与理事会提交报告（更正公告 OJ L 2024/90330，原文误写 2026-11-24），列明哪些关键原材料应优先评估是否须作环境足迹声明。该报告决定哪些关键原材料须作环境足迹声明，与电池材料碳足迹方法学有间接关联。", "badge": null, "verified": "2026-11-26", "verifyNote": "EUR-Lex 原文 Art 31(2) 与更正公告 OJ L 2024/90330 核验（法定截止 2025-11-24）；2026-11-26 复核：OJ 与全网检索未见报告刊登证据，记未确认", "sources": ["X41"], "quote": {"ref": "Art 31(2), Regulation (EU) 2024/1252", "text": "The Commission shall by 24 November 2026 submit a report to the European Parliament and to the Council setting out which critical raw materials are to be prioritised for assessing whether the obligation to declare the environmental footprint of a critical raw material is necessary and proportionate. For the critical raw materials that the Commission has identified as a priority, the Commission shall present the conclusions of the assessment of necessity and proportionality for the purposes of paragraph 3 by 12 months from submission of the report referred to in the first subparagraph of this paragraph.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25", "note": "Same quote object as crma-art31-2 (shared article); added so the existing crma-art31 event carries the second-sentence conclusions deadline."}}, {"id": "crma-art31-2", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2026-11-24", "from": null, "to": null, "label": "足迹优先排序评估结论·2026-11-24", "title": "Art 31(2) 优先排序评估结论须于 2026-11-24 前提交（以优先排序报告按期提交为前提）", "status": null, "article": "Art 31(2)", "scope": null, "conditions": null, "detail": "Art 31(2) 第二句：对列为优先的关键原材料，欧委会须在优先排序报告提交后 12 个月内（报告法定截止 2025-11-24＋12 个月，即 2026-11-24 前；更正公告 OJ L 2024/90330）提交必要性与相称性评估结论，判断是否须作环境足迹声明。报告本身提交情况未确认，结论日以报告按期提交为前提。", "badge": null, "verified": "2026-11-26", "verifyNote": "EUR-Lex 原文 Art 31(2) 与更正公告 OJ L 2024/90330 核验（2026-11-26）：报告截止 2025-11-24，结论日为报告提交后 12 个月", "sources": ["X41"], "quote": {"ref": "Art 31(2), Regulation (EU) 2024/1252", "text": "The Commission shall by 24 November 2026 submit a report to the European Parliament and to the Council setting out which critical raw materials are to be prioritised for assessing whether the obligation to declare the environmental footprint of a critical raw material is necessary and proportionate. For the critical raw materials that the Commission has identified as a priority, the Commission shall present the conclusions of the assessment of necessity and proportionality for the purposes of paragraph 3 by 12 months from submission of the report referred to in the first subparagraph of this paragraph.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25", "note": "Second subparagraph sets the conclusions deadline at 12 months after the report, i.e. 24 November 2027."}}, {"id": "crma-art31-decl", "itemId": "crma-note", "kind": "plan", "prec": "unverified", "date": null, "from": null, "to": null, "label": "环境足迹声明·按原材料触发", "title": "Art 31 环境足迹声明：按原材料逐个触发，须含来源国家／地区", "status": "计划；无统一适用日，按原材料逐个触发", "article": "Art 31(6)/(7)", "scope": null, "conditions": null, "detail": "Art 31(6)：一旦某关键原材料有了足迹计算与核查规则，投放市场者须提供环境足迹声明，针对每种单一原材料类型，不适用于含在中间／最终产品中的原材料。Art 31(7)(c)：声明须注明该原材料被开采、加工、精炼、回收的国家和地区。Art 31(10)：声明须上免费网站，售前（含远程销售）须确保客户在受合同约束前能看到声明，不得展示误导性标签。Art 31(8) 绩效等级授权法案'在合理期限内'出台，无固定日期。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 31(6)/(7)/(10) 核验（2026-11-24 审计）", "sources": ["X41"], "quote": {"ref": "Art 31(6), (7)(c) and (10), Regulation (EU) 2024/1252", "text": "Any natural or legal person that places on the market critical raw materials, including processed and recycled, for which the Commission has adopted calculation and verification rules pursuant to paragraph 1 shall make available an environmental footprint declaration. The requirement shall apply to each individual critical raw material type placed on the market and shall not apply to critical raw materials included in intermediate or final products. The environmental footprint declaration shall contain information about the country and region where the critical raw material was extracted, processed, refined and recycled, as applicable. The environmental footprint declaration shall be made available on a free-access website.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25", "note": "Art 31(7)(c) is the country/region of extraction, processing, refining and recycling. Art 31(11) (pre-sale availability including distance selling; no misleading labels) is paraphrased in the event detail, not quoted verbatim here."}}, {"id": "crma-art44-1", "itemId": "crma-note", "kind": "plan", "prec": "day", "date": "2025-11-24", "from": null, "to": null, "label": "参考预测报告·2025-11-24（已逾期）", "title": "Art 44(1) 参考预测报告到期（2025-11-24，已逾期约一年）：2030/2040/2050 年各关键原材料消费量预测", "status": "未确认：法定截止日 2025-11-24（更正公告 OJ L 2024/90330 将原文误写的 2026-11-24 更正为 2025-11-24）已过约一年；截至 2026-11-26 未见报告提交/发布记录，是否已提交未确认，次日继续复核", "article": "Art 44(1)", "scope": null, "conditions": null, "detail": "CRMA 第 44(1) 条：欧委会须于 2025-11-24 前提交报告（更正公告 OJ L 2024/90330，原文误写 2026-11-24），含各关键原材料 2030、2040、2050 年年度消费量的低/高/参考预测，以及各战略原材料开采与加工的指示性基准。", "badge": null, "verified": "2026-11-26", "verifyNote": "EUR-Lex 原文 Art 44(1) 与更正公告 OJ L 2024/90330 核验（法定截止 2025-11-24）；2026-11-26 复核：OJ 与全网检索未见报告刊登证据，记未确认", "sources": ["X41"]}, {"id": "crma-art45", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2026-05-24", "from": null, "to": null, "label": "成员国年度报告·首份 2026-05-24", "title": "Art 45 成员国年度报告：首份应于 2026-05-24 前提交，此后每年一次", "status": "报送对象为欧委会，不公开发布，提交情况无法公开核验", "article": "Art 45(1)", "scope": null, "conditions": null, "detail": "CRMA 第 45(1) 条：成员国须于 2026-05-24 前、此后每年向欧委会提交报告，内容涵盖国家勘探计划、监测、战略库存、循环与可持续性措施（Art 19(5)、21(1)(2)、22(1)、23(5)、26(6)）。成员国是否按期提交属成员国向欧委会的报送，不公开发布，无法从一手公开来源逐一核验。注意：CRMA 中不存在“3 月 15 日”期限（该日期为 NZIA (EU) 2024/1735 Art 42(5) 的 2027-03-15，NZIA 线已移除）。Art 20(3)/(4)（A16）：每个战略原材料供应链至少每 3 年做一次压力测试，监测发现供应风险显著上升时加测；欧委会须公开并定期更新监测仪表盘（含监测参数演变汇总、供应风险计算方法汇总、酌情给出的缓解策略建议）。Art 21：成员国须识别关键市场运营商、监测其活动、重大事件“without delay”通知欧委会；运营商可以商业秘密为由拒绝提供数据（须说明理由）。Art 25 联合采购：欧委会须建立并运行需求聚合系统，参与企业可联合谈判采购；受欧盟限制性措施对象及被其拥有／控制者排除参与。Art 22：战略库存信息经 Art 45 报告提交，含过去 5 年演变、释放／分配／分发规则；国防／国家安全信息可拒报（须说明理由）。", "badge": null, "verified": "2026-11-20", "verifyNote": "EUR-Lex 原文 Art 45(1) 核验；全文检索“15 March”仅命中 2006/21/EC 引文", "sources": ["X41"]}, {"id": "crma-art44-2", "itemId": "crma-note", "kind": "plan", "prec": "day", "date": "2027-05-24", "from": null, "to": null, "label": "进展监测报告·2027-05-24", "title": "Art 44(2) 首份进展监测报告（2027-05-24）与清单首次复核同日到期", "status": "计划；2027-05-24 到期，此后至少每三年一次", "article": "Art 44(2)／Art 3(3)／Art 4(3)", "scope": null, "conditions": null, "detail": "Art 44(2)：欧委会须于 2027-05-24 前、此后至少每三年监测 Art 5(1) 基准进展。同日：战略原材料清单（Art 3(3)）与关键原材料清单（Art 4(3)）首次复核到期，现行清单为战略原材料 17 种、关键原材料 34 种；2030 基准（开采 10%、加工 40%、回收 25%，单一第三国 ≤65%）未变。Art 3(3) 末段：首次更新战略原材料清单（2027-05-24 前）时，欧委会须专门评估合成石墨是否应保留在清单内（合成石墨与电池负极直接相关）。", "badge": null, "verified": "2026-11-20", "verifyNote": "EUR-Lex 原文 Art 44(2)、3(3)、4(3) 核验", "sources": ["X41"], "quote": {"ref": "Art 3(3), Regulation (EU) 2024/1252", "text": "As part of the first update of the list of strategic raw materials pursuant to the first subparagraph, the Commission shall, in particular, assess whether, on the basis of its assessment pursuant to paragraph 2 of this Article and Annex I, Section 2, synthetic graphite should remain in the list of strategic raw materials.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25", "note": "Added to support detail addition (d) D-CRMA-3 (A17): synthetic graphite retention must be assessed at the first list update (24 May 2027)."}}]}, {"key": "supply-chain", "label": "供应链风险与循环回收", "events": [{"id": "crma-art19", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2025-05-24", "from": null, "to": null, "label": "国家勘探计划·2025-05-24", "title": "Art 19 国家综合勘探计划到期（2025-05-24，已过，核验状态）", "status": "已过；须核验成员国是否已制定计划", "article": "Art 19(1)", "scope": null, "conditions": null, "detail": "Art 19(1)：成员国须于 2025-05-24 前制定针对关键原材料及载体矿物的国家综合勘探计划，至少每 5 年复核一次并视需要更新（下次复核 2030-05-24）。Art 19(6)：须将通过国家计划措施收集的含关键原材料矿产地基本信息地图公开于免费网站。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 19(1)/(6) 核验（2026-11-24 审计）", "sources": ["X41"], "quote": {"ref": "Art 19(1) and (6), Regulation (EU) 2024/1252", "text": "By 24 May 2025, each Member State shall draw up a national programme for general exploration targeted at critical raw materials and carrier minerals of critical raw materials. Those national programmes shall be reviewed at least every five years and updated if necessary. Member States shall make maps that show basic information on mineral occurrences containing critical raw materials gathered through the measures set out in the national programmes publicly available on a free-access website.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25"}}, {"id": "crma-art24", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2025-05-24", "from": null, "to": null, "label": "大企业供应链风险评估·2025-05-24", "title": "Art 24 大企业供应链风险评估：首轮识别 2025-05-24（已过），每 3 年一评", "status": "首轮已过；须核验成员国是否已识别大企业", "article": "Art 24(1)/(2)", "scope": null, "conditions": null, "detail": "Art 24(1)：成员国须在 2025-05-24 前、及此后每次战略原材料清单更新后 12 个月内，识别辖区内使用战略原材料制造'储能与 e-mobility 用电池'等产品的大企业；清单首次复核 2027-05-24，下一轮识别须于 2028-05-24 前完成。Art 24(2)：被识别的大企业至少每 3 年做一次供应链风险评估，含原料开采／加工／回收来源地 mapping、供应影响因素分析、断供脆弱性评估。Art 24(4)：发现重大断供脆弱性须采取缓解努力（供应链多元化或替代）。Art 24(5)–(6)：大企业可向董事会提交风险评估报告，成员国可强制要求提交。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 24(1)/(2)/(4) 核验（2026-11-24 审计）", "sources": ["X41"], "quote": {"ref": "Art 24(1), (2) and (4), Regulation (EU) 2024/1252", "text": "By 24 May 2025 and within 12 months of each update of the list of strategic raw materials pursuant to Article 3(3), Member States shall identify the large companies operating on their territory that use strategic raw materials to manufacture batteries for energy storage and e-mobility, equipment related to hydrogen production and utilisation, equipment related to renewable energy generation, aircrafts, traction motors, heat pumps, equipment related to data transmission and storage, mobile electronic devices, equipment related to additive manufacturing, equipment related to robotics, drones, rocket launchers, satellites or advanced chips. Large companies as referred to in paragraph 1 shall, at least every three years and to the extent the required information is available to them, carry out a risk assessment of their raw materials supply chain of strategic raw materials, including: (a) a mapping of where the strategic raw materials they use are extracted, processed or recycled; (b) an analysis of the factors that might affect their supply of strategic raw materials; (c) an assessment of their vulnerabilities to supply disruptions. If significant vulnerabilities to supply disruptions are detected as a result of the risk assessment referred to in paragraph 2, large companies as referred to in paragraph 1 shall take efforts to mitigate those vulnerabilities, including by assessing the possibility to diversify its raw materials supply chains or to substitute the strategic raw materials.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25", "note": "Art 24(5)-(6) (large companies may submit the risk assessment report to their board; Member States may require submission) is paraphrased in the event detail, not quoted verbatim here."}}, {"id": "crma-art26", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2025-05-24", "from": null, "to": null, "label": "循环国家计划清单·2025-05-24", "title": "Art 26 循环国家计划：清单实施法案 2025-05-24（已过），国家计划随之触发", "status": "清单法案已过；须核验是否已出台", "article": "Art 26(7)/(1)", "scope": null, "conditions": null, "detail": "Art 26(7)：欧委会须于 2025-05-24 前通过实施法案，列明至少应被视为具相关关键原材料回收潜力的产品、部件与废物流清单。Art 26(1)：成员国须在该实施法案生效后 2 年内出台或纳入国家循环计划，含促进技术进步与资源效率、废物预防与再利用／维修、废物收集分选处理、二次关键原材料使用（含公共采购授标标准或财政激励中考量再生含量）。Art 26(5)：成员国须单独识别并报告从废电气电子设备中拆除的含关键原材料部件数量及回收的关键原材料数量，首个报告期为实施法案通过后首个完整日历年。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 26(7)/(1)/(5) 核验（2026-11-24 审计）", "sources": ["X41"], "quote": {"ref": "Art 26(1), (5) and (7), Regulation (EU) 2024/1252", "text": "By 24 May 2025, the Commission shall adopt implementing acts specifying a list of products, components and waste streams that shall at least be considered as having a relevant critical raw materials recovery potential within the meaning of paragraph 1, points (b) and (c). Each Member State shall, by two years from the date of entry into force of the implementing act referred to in paragraph 7, adopt and implement, or include in, national programmes containing measures designed to: (a) incentivise technological progress and resource efficiency; (b) promote waste prevention and increase re-use and repair; (c) increase the collection, sorting and processing of waste; (d) increase the use of secondary critical raw materials, including through measures such as taking recycled content into account in award criteria related to public procurement or financial incentives; [...]. Member States shall separately identify and report the quantities of components containing critical raw materials removed from waste electrical and electronic equipment and the quantities of critical raw materials recovered from such components. The first reporting period shall cover the first full calendar year after the adoption of those implementing acts.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25", "note": "Art 26(1) points (e)-(i) are omitted with [...] in the quote; the full list is paraphrased in the event detail."}}, {"id": "crma-art16-2", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2026-05-24", "from": null, "to": null, "label": "战略项目融资障碍报告·2026-05-24", "title": "Art 16(2) 战略项目融资障碍报告到期（2026-05-24，已过，核验状态）", "status": "已过；须核验报告是否已提交", "article": "Art 16(2)", "scope": null, "conditions": null, "detail": "Art 16(2)：欧委会须于 2026-05-24 前，根据 Art 36(8)(a) 常设小组的建议，向 Board 提交报告，说明战略项目融资障碍与便利化建议。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 16(2) 核验（2026-11-24 审计）", "sources": ["X41"], "quote": {"ref": "Art 16(2), Regulation (EU) 2024/1252", "text": "By 24 May 2026, the Commission shall, on the basis of the advice of the standing subgroup referred to in Article 36(8), point (a), submit a report to the Board describing obstacles to accessing finance for Strategic Projects and recommendations to facilitate such access.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25"}}, {"id": "crma-art23", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2026-05-24", "from": null, "to": null, "label": "战略库存安全水平基准·2026-05-24", "title": "Art 23 战略库存安全水平基准：首轮 2026-05-24（已过），每 2 年一轮", "status": "首轮已过；须核验是否已分享", "article": "Art 23(1)", "scope": null, "conditions": null, "detail": "Art 23(1)：欧委会须于 2026-05-24 前、此后每 2 年向 Board 分享各战略原材料安全库存水平基准草案、欧盟库存总量与基准对比、跨境可及性信息；基准以'断供时覆盖若干天日均净进口所需量'表示（Art 23(2)(a)，按上一日历年进口量计算）。下一轮 2028-05-24。Art 23(8)：本条与 Art 22 均不强制成员国持有或释放战略库存。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 23(1)/(2)(a)/(8) 核验（2026-11-24 审计）", "sources": ["X41"], "quote": {"ref": "Art 23(1), (2)(a) and (8), Regulation (EU) 2024/1252", "text": "By 24 May 2026 and every two years thereafter, the Commission shall, on the basis of the information received pursuant to Article 22(1), share with the Board: (a) a draft benchmark indicating a safe level of Union strategic stocks for each strategic raw material; (b) a comparison of the overall level of Union strategic stocks and the draft benchmark; (c) information on the potential cross-border accessibility of strategic stocks. The benchmark shall be expressed as the amount of strategic raw materials needed to cover an amount of days of average daily net imports in the case of a supply disruption, calculated on the basis of the amount of imports during the previous calendar year. Neither this Article nor Article 22 shall impose an obligation on Member States to hold or release strategic stocks.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25"}}, {"id": "crma-art27", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2025-11-24", "from": null, "to": null, "label": "采掘废物回收·2025-11-24（已逾期）", "title": "Art 27 采掘废物中关键原材料回收：研究提交＋数据库建库 2025-11-24 到期（已逾期约一年）", "status": "已到期（2025-11-24，更正公告 OJ L 2024/90330 将原文误写的 2026-11-24 更正为 2025-11-24）；须核验研究是否已提交、数据库是否已建库", "article": "Art 27(3)/(6)", "scope": null, "conditions": null, "detail": "Art 27(1)/(3)：须编制废物管理计划的采掘废物设施运营人须向主管机关提交关键原材料潜在回收初步经济评估研究，2025-11-24 前提交（更正公告 OJ L 2024/90330，原文误写 2026-11-24）；新建设施随废物管理计划提交。能向主管机关高度确定地证明采掘废物不含技术上可回收的关键原材料者免于该义务。Art 27(6)：封闭采掘废物设施数据库须于 2025-11-24 前建库、2027-05-24 前录入全部信息、公开数字形式、至少每 3 年更新。后续：代表性地球化学取样已于 2026-05-24 前完成；更详细取样与化学／矿物学表征须于 2027-03-24 前完成；成员国促进回收措施须于 2027-11-24 前出台（Art 27(5)/(7)）。", "badge": null, "verified": "2026-11-26", "verifyNote": "EUR-Lex 原文 Art 27(1)/(3)/(5)/(6)/(7) 与更正公告 OJ L 2024/90330 核验（2026-11-26）：研究提交与数据库建库截止 2025-11-24", "sources": ["X41"], "quote": {"ref": "Art 27(1), (3), (5), (6) and (7), Regulation (EU) 2024/1252", "text": "By 24 November 2026, operators of extractive waste facilities shall submit the study referred to in paragraph 1 of this Article to the competent authority. Operators obliged to draw up waste management plans in accordance with Article 5 of Directive 2006/21/EC shall provide to the competent authority a preliminary economic assessment study regarding the potential recovery of critical raw materials, from: (a) the extractive waste stored in the facility; and (b) the extractive waste being generated or, where considered more effective, from the extracted volume prior to it becoming waste. The database referred to in paragraph 4 shall be put in place by 24 November 2026 and all the information shall be introduced in that database by 24 May 2027. It shall be made available in a publicly accessible and digital form and updated at least every three years. By 24 November 2027, Member States shall adopt and implement measures to promote the recovery of critical raw materials from extractive waste, in particular from closed extractive waste facilities identified in the database referred to in paragraph 4 as containing potentially economically recoverable critical raw materials.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25", "note": "Art 27(7)(b)-(c) sampling deadlines (representative geochemical sampling by 24 May 2026; more detailed sampling and chemical/mineralogical characterisation by 24 March 2027) are in the event detail. The Art 27(1) exemption (operators able to demonstrate with a high degree of certainty that the waste contains no technically recoverable critical raw materials) is also in the detail."}}, {"id": "crma-art5-3", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2027-01-01", "from": null, "to": null, "label": "废物流回收能力基准 DA·2027-01-01", "title": "Art 5(3) 废物流回收能力基准授权法案须于 2027-01-01 前出台", "status": null, "article": "Art 5(3)", "scope": null, "conditions": null, "detail": "Art 5(3)：欧委会须于 2027-01-01 前通过授权法案，规定以相关废物流中可用战略原材料占比表示的欧盟回收能力基准。2030 年回收 25% 基准如何落到具体废物流，就看这部法案。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 5(3) 核验（2026-11-24 审计）", "sources": ["X41"], "quote": {"ref": "Art 5(3), Regulation (EU) 2024/1252", "text": "By 1 January 2027, the Commission shall adopt delegated acts in accordance with Article 38 to supplement this Regulation by providing for Union recycling capacity benchmarks expressed as a share of the strategic raw materials available in relevant waste streams.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25"}}, {"id": "crma-art8", "itemId": "crma-note", "kind": "plan", "prec": "day", "date": "2027-03-25", "from": null, "to": null, "label": "战略项目两年期报告·2027-03-25", "title": "Art 8 战略项目两年期报告：首批首报 2027-03-25", "status": "计划；按认定日触发", "article": "Art 8(1)", "scope": null, "conditions": null, "detail": "Art 8(1)：战略项目发起人自认定之日起每 2 年向欧委会报告进展，含许可进程、延期原因与赶工计划、融资与公共资助。首批 47 个项目认定于 2025-03-25，首报 2027-03-25；第二批认定于 2026-10-09，首报 2028-10-09。Art 8(3)：控制权持久变更等须通知欧委会。Art 8(5)：发起人须设免费公开项目网站。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 8(1)/(3)/(5) 核验（2026-11-24 审计）", "sources": ["X41"], "quote": {"ref": "Art 8(1), (3) and (5), Regulation (EU) 2024/1252", "text": "The project promoter shall, every two years after the date of recognition as a Strategic Project, submit a report to the Commission containing information on at least: (a) progress in the implementation of the Strategic Project, in particular with regard to the permit-granting process; (b) where relevant, reasons for delays compared to the timetable referred to in Article 7(1), point (c) and a plan to overcome such delays; (c) progress in financing the Strategic Project, including information on public financial support. The project promoter shall notify the Commission of: (a) changes to the Strategic Project affecting its fulfilment of the criteria laid down in Article 6(1); (b) changes in control of the undertakings involved in the Strategic Project on a lasting basis. The project promoter shall establish and regularly update the undertaking's website or a dedicated project website with information relevant to the local population. The relevant part shall be accessible by the public free of charge and shall not require the provision of personal information (free-access website).", "url": "https://eur-lex.europa.eu/eli/reg/2024/1252/oj/eng", "verified": "2026-11-25"}}, {"id": "crma-art30", "itemId": "crma-note", "kind": "firm", "prec": "day", "date": "2027-05-24", "from": null, "to": null, "label": "认可认证计划·2027-05-24", "title": "Art 30 认可认证计划： 早于收到欧委会意见、不晚于收通知后 60 天（延期则 75 天），可再延 30 天；决定须 3 天内通报欧委会；偏离欧委会意见须额外 2 个月深入评估且决定在该期限届满后才生效；批准决定须载明投资者报告义务。Art 21：欧委会自提评估触发包括投资额超 10 亿欧元或对内部市场附加值有重大影响等。Art 22：投资主管部门须定期监测，外商须定期报告合规情况；违反申报要求时处罚下限为外商企业平均日总营业额 5%（自然人投资者至少为投资额的 5%），须毫不延迟地向欧委会通报违规与处罚。Art 23：欧委会须提供并公布各新兴战略行业最新年度数据；对虚假／误导信息或不提供信息可处不超平均日营业额 5%（自然人为投资额 5%）的罚款。Art 24：欧委会可授权法案把 FDI 条件扩至其他经济安全关键行业（明确列出 NZIA Art 4(1) 多项净零技术、核燃料循环、电推进技术），但不含数字技术、人工智能、量子技术与半导体。", "badge": null, "verified": "2026-11-23", "verifyNote": "Art 17/18 原文核验（2026-11-23）：>1 亿欧元、>40% 全球产能、6 条件 4 项以上、50% 雇员强制、研发 1%；欧委会新闻稿与理事会背景文件佐证", "sources": ["X54", "X55"], "quote": {"ref": "Art 18(1), (2)(f) and (5); Art 22, COM(2026)100", "text": "Member States shall, by [OP insert date: 1 month after entry into force of this Regulation], designate an Investment Authority. The foreign investor prepares and publishes on its website a strategy for enhancing Union value chains and prioritising the sourcing of inputs and endeavours to source from the Union a minimum of 30% of inputs used for the products placed on the Union market. The Commission shall adopt an implementing act, by [OP please insert date: 6 months after entry into force of this Regulation] to specify the detailed rules for verifying the compliance with the conditions laid down in paragraph 2. Penalties for breach of the notification requirement shall not amount to less than 5% of the average daily aggregate turnover of the foreign investor undertaking.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0100", "verified": "2026-11-25", "note": "Composite quote for detail addition (d) D-IAA-5 (G17). The remaining G17 sub-requirements (Art 17(3), Art 19, Art 20 time limits, Art 21, Art 23, Art 24) are paraphrased in the event detail."}}, {"id": "iaa-permit", "itemId": "iaa-note", "kind": "plan", "prec": "unverified", "date": null, "from": null, "to": null, "label": "许可提速", "title": "许可提速与工业加速区（拟自生效后 1 年起适用）", "status": "计划；第 4、5 条自生效 1 年后起适用（Art 36 原文）", "article": "IAA 许可条款", "scope": null, "conditions": null, "detail": "各成员国设单一数字许可程序（“一个项目、一个数字程序”），制造项目许可不超 18 个月（欧委会 DG GROW 新闻页口径，提案主文未载明）；将 NZIA 净零项目简化许可扩展至全部能源密集型脱碳项目；各成员国指定至少一个工业加速区（工业集群），优先具产业共生与脱碳潜力的区域。Art 5(3)（G7）：许可申请完整性确认：受理后 45 天内确认完整或要求补件；补件后仍不完整，可在收到补件后 30 天内第二次要求补件。Art 25（G8）：加速区指定生效后 12 个月期限＋指定后 30 天内通报欧委会（见 iaa-accel-area）。Art 26(c)（G9）：加速区能源需求分析至少每 3 年复核一次，里程碑为 2030／2040／2050 年。Art 27（G10）：每个加速区须有汇总基线许可，覆盖区内制造项目所需的许可与行政授权（安装特定许可除外），区内项目只需另行取得基线许可范围外的许可。Art 6（G18）：能源密集型脱碳项目直接适用 NZIA 第二章第二节，并视同战略项目（许可简化待遇）。Art 4（G19）：成员国须设国家级单一接入点，受理项目发起人的单一申请；单一接入点须用欧洲商业钱包（European Business Wallets）实现互操作与数据复用（Art 4(2)）。Art 32（G20）：成员国须制定违反本法规的罚则并毫不延迟地通知欧委会，及后续修订。", "badge": null, "verified": "2026-11-23", "verifyNote": "欧委会新闻稿核验；Art 36 原文核验（2026-11-23）：第 4、5 条自生效 1 年后起适用; 2026-11-25 审计复核：18 个月在提案主文（Art 4/5）无出处，保留 DG GROW 新闻页标注（见 (b) iaa-permit：主文明确的时限只有 Art 5(3) 的 45 天／30 天）", "sources": ["X54"], "quote": {"ref": "Art 5(3), COM(2026)100", "text": "No later than 45 days from the receipt of the application for a permit for industrial manufacturing projects, the competent authority shall either acknowledge that the application is complete or request any missing information. Where, after the submission of any missing information, the application is still deemed to be incomplete, the competent authority may, within 30 days of the submission of the requested missing information, make a second request.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0100", "verified": "2026-11-25", "note": "Added to support detail addition (d) D-IAA-4 (G7). The 45/30-day limits are the only permit time limits in the proposal main text; the '18 months' figure in the event detail has no source in the main text (see correction (c) C4)."}}, {"id": "iaa-accel-area", "itemId": "iaa-note", "kind": "plan", "prec": "unverified", "date": null, "from": null, "to": null, "label": "加速区指定·生效后 12 个月", "title": "Art 25 加速区指定：生效后 12 个月内指定，30 天内通报欧委会", "status": "计划；生效后 12 个月内指定，日期随生效日定", "article": "Art 25", "scope": null, "conditions": null, "detail": "Art 25(1)：成员国须在生效后 12 个月内在其领土内至少指定一个工业制造加速区。Art 25(6)：须在相关决定通过后 30 天内将指定情况通报欧委会。Art 25(5)：指定前须做战略环境评估（Directive 2001/42/EC）及 Natura 2000 适当评估。", "badge": null, "verified": "2026-11-25", "verifyNote": "提案主文 Art 25 原文核验（2026-11-24 审计）", "sources": ["X51"], "quote": {"ref": "Art 25(1) and (6), COM(2026)100", "text": "Member States shall designate at least one industrial manufacturing acceleration area on their territory by [OP please insert date: 12 months following the entry into force of this Regulation]. Member States shall inform the Commission of the designation of an industrial manufacturing acceleration area, within 30 days from the adoption of the relevant decision.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0100", "verified": "2026-11-25", "note": "Proposal text; the designation deadline is an [OP please insert date] placeholder (12 months after entry into force)."}}]}, {"key": "nzia", "label": "净零工业法案修订", "sub": "Art 34 修订 (EU) 2024/1735（NZIA）", "events": [{"id": "iaa-nzia-report", "itemId": "iaa-note", "kind": "plan", "prec": "day", "date": "2027-03-15", "from": null, "to": null, "label": "NZIA 豁免适用报告·2027-03-15", "title": "NZIA Art 42 豁免适用报告：首份 2027-03-15，此后每 3 年", "status": null, "article": "Art 34(7)／NZIA Art 42", "scope": null, "conditions": null, "detail": "经 Art 34(7) 插入的 NZIA Art 42(2a)：适用第四章的成员国、公共机构、采购方须报告豁免适用情况。Art 42(3)：各成员国须于 2027-03-15 前、此后每 3 年向欧委会提交报告。", "badge": null, "verified": "2026-11-25", "verifyNote": "提案主文 Art 34(7) 原文核验（2026-11-24 审计）", "sources": ["X51"], "quote": {"ref": "Art 34(7), COM(2026)100 (amending NZIA Art 42)", "text": "Member States, public authorities, procuring authorities and procuring entities applying Chapter IV of this Regulation shall report on the application of exemptions in accordance with the provisions of that Chapter. Each Member State shall submit to the Commission a report setting out the data referred to in paragraphs 2 and 2a by 15 March 2027 and every three years thereafter.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0100", "verified": "2026-11-25"}}, {"id": "iaa-nzia-auctions", "itemId": "iaa-note", "kind": "plan", "prec": "day", "date": "2027-12-31", "from": null, "to": null, "label": "NZIA 拍卖评估·2027-12-31", "title": "NZIA 拍卖与补贴规则评估：首轮 2027-12-31", "status": null, "article": "Art 34(5)/(6)／NZIA Art 26/28a", "scope": null, "conditions": null, "detail": "经 Art 34 修改的 NZIA 拍卖与补贴规则：Art 26(7) 第 1–5 款适用于每成员国每年至少 40% 拍卖量或至少 8 GW；Art 26(4) 各标准最低权重 5%、合计权重 15%–30%；Art 26(5) 成本差异超 20%／延迟超 7 个月可推定为不合比例／重大；Art 28a(3) 附加财政补偿不超最终产品消费者成本 15%（能源贫困目标方案 20%）；Art 25(7) 韧性义务：投标期内单一第三国供货不超特定净零技术最终产品价值 50%。Art 26(8)：欧委会须于 2027-12-31 前作全面评估，此后每 2 年一次（见 iaa-nzia-auctions-2029）。", "badge": null, "verified": "2026-11-25", "verifyNote": "提案主文 Art 34(5)/(6) 原文核验（2026-11-24 审计）", "sources": ["X51"], "quote": {"ref": "Art 34(5) and (6), COM(2026)100 (amending NZIA Art 26, 28a and 25)", "text": "Paragraphs 1 to 5 shall apply to at least 40% of the volume auctioned per year per Member State or alternatively to at least 8 Gigawatt per year per Member State. Member States shall give to each of the criteria a minimum weight of 5% and a combined weight of between 15% and 30% of the award criteria. Estimated cost differences in excess of 20% per auction may be presumed to be disproportionate. Delays in excess of seven months may be presumed to be significant. By 31 December 2027, the Commission shall carry out a comprehensive assessment. By 31 December 2029 and every two years thereafter, the Commission shall carry out a comprehensive assessment. Additional financial compensation shall not exceed 15% of the cost of the final product for the consumer, with the exception of schemes targeting citizens living in energy poverty, for which the limit shall be 20%. Member States shall require tenderers not to supply more than 50% of the value of the specific net-zero technology final product from each individual third country.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0100", "verified": "2026-11-25", "note": "Composite quote of NZIA Art 26(7), (4), (5) and (8), Art 28a(3) and Art 25(7) as amended by IAA Art 34; the [...] in the audit text marks trimmed clauses."}}, {"id": "iaa-nzia-auctions-2029", "itemId": "iaa-note", "kind": "plan", "prec": "day", "date": "2029-12-31", "from": null, "to": null, "label": "NZIA 拍卖评估·2029-12-31", "title": "NZIA 拍卖全面评估：2029-12-31，此后每 2 年", "status": "计划；2029-12-31 到期，此后每 2 年一次", "article": "Art 34(5)／NZIA Art 26(8)", "scope": null, "conditions": null, "detail": "NZIA Art 26(8)（经 Art 34(5)(g) 替换）：欧委会须于 2029-12-31 前、此后每 2 年作一次拍卖规则全面评估。首轮评估见 iaa-nzia-auctions（2027-12-31）。", "badge": null, "verified": "2026-11-25", "verifyNote": "提案主文 Art 34(5) 原文核验（2026-11-24 审计）", "sources": ["X51"], "quote": {"ref": "Art 34(5), COM(2026)100 (amending NZIA Art 26(8))", "text": "By 31 December 2027, the Commission shall carry out a comprehensive assessment. By 31 December 2029 and every two years thereafter, the Commission shall carry out a comprehensive assessment.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0100", "verified": "2026-11-25", "note": "Same quote object as iaa-nzia-auctions (Art 26(8) sentences); the first assessment is 31 December 2027, the second and biennial cycle from 31 December 2029."}}, {"id": "iaa-nzia-annex2", "itemId": "iaa-note", "kind": "plan", "prec": "unverified", "date": null, "from": null, "to": null, "label": "NZIA 附件 II 原产阶梯·生效后 1 年／3 年", "title": "Art 34 插入的 NZIA 附件 II：净零技术原产要求 1／3 年递增阶梯（含 BESS 电芯）", "status": "计划；生效后 1 年起、3 年起升级（核电 4 年／6 年），日期随生效日定", "article": "Art 34(8)／NZIA Annex II", "scope": null, "conditions": null, "detail": "经 Art 34(8) 插入的 NZIA 附件 II Part I：电池储能（BESS）生效后 1 年起须欧盟原产，超 1 MWh 项目须含欧盟原产电池管理系统；生效后 3 年起须欧盟原产并含电芯、电池管理系统及 1 个其他主要特定部件。光伏、氢能、风电、核电（4 年→2 个部件、6 年→3 个部件）均有同类 1／3／4／6 年阶梯；Part II（拍卖）、Part III（其他公共干预）、Part IV（成员国制造建设支持 d": "empco-note", "kind": "firm", "prec": "day", "date": "2025-09-27", "from": null, "to": null, "label": "统一通知／标签实施法案·2025-09-27", "title": "Art 22a 统一通知与统一标签实施法案 (EU) 2025/1960（2025-09-27 法定截止，已按期出台）", "status": "已出台；实施法案 2025-09-25 通过、OJ 2025-10-02 刊登，2026-09-27 起适用", "article": "Art 22a(2)/(4)", "scope": null, "conditions": null, "detail": "Art 22a(2)/(4)：欧委会须在 2025-09-27 前以实施法案定出统一通知（法定合格保证提示）与统一标签（耐久性商业保证标签）的设计与内容。已按期履行：Commission Implementing Regulation (EU) 2025/1960 于 2025-09-25 通过、OJ 2025-10-02 刊登，其 Art 3 规定自 2026-09-27 起适用（与转化措施适用日同日）。对汽车经销：展厅／官网自 2026-09-27 起必须用统一样式展示法定保证提示，超 2 年整车耐久性保证须用统一标签。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文核验（2026-11-24 审计）：Art 22a(2)/(4) 与 (EU) 2025/1960 通过／刊登／适用日", "sources": ["X61"], "quote": {"ref": "Art 22a(2), Directive (EU) 2024/825; Art 3, Commission Implementing Regulation (EU) 2025/1960", "text": "By 27 September 2025 the Commission shall, by means of implementing acts, specify the design and content of the harmonised notice referred to in paragraph 1. It shall apply from 27 September 2026.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R1960", "verified": "2026-11-25", "note": "Art 22a(2) is from Directive (EU) 2024/825 (source X59); Art 22a(4) mirrors it for the harmonised label (durability commercial guarantee label). The second sentence is Art 3 of (EU) 2025/1960, adopted 25 September 2025 and published in the OJ on 2 October 2025."}}, {"id": "empco-transpose", "itemId": "empco-note", "kind": "firm", "prec": "day", "date": "2026-03-27", "from": null, "to": null, "label": "转化截止", "title": "成员国转化截止日", "status": null, "article": "Art 4(1)", "scope": null, "conditions": null, "detail": "成员国须在此日前通过并公布转化措施并立即通知欧委会；转化措施自 2026-09-27 起适用。", "badge": null, "verified": "2026-11-20", "verifyNote": "EUR-Lex OJ 原文 Art 4 直读", "sources": ["X59"]}, {"id": "empco-apply", "itemId": "empco-note", "kind": "firm", "prec": "day", "date": "2026-09-27", "from": null, "to": null, "label": "开始适用", "title": "转化措施开始适用", "status": null, "article": "Art 4(1)", "scope": null, "conditions": null, "detail": "通用环保声明须有公认卓越环保绩效方可使用；无认证计划且非公共机构设立的可持续性标签不得展示（合格的认证计划须由独立第三方按国际／欧盟／国家标准客观监测商家合规，“卓越绩效”指符合 EU Ecolabel、成员国官方认可的 EN ISO 14024 I 型生态标签或其他欧盟法规下的顶级环保绩效）。以温室气体抵消为依据声称产品具有中和、减排或正效益环境影响的，即属绝对禁令（附件 I 第 4c 点），不存在“有计划即可宣称”的余地；任何未来环保绩效声明（不限于碳中和类）须有清晰、客观、公开可核查的承诺，载于详细现实的实施计划，含可衡量、有时限的目标与资源配置等要素，并由独立第三方专家定期核查、核查结果向消费者公开（Art 6(2)(d)，个案评估制度，与 4c 的绝对禁止不同）。环保声明针对整件产品或整个业务、实际只涉某一方面（附件 I 第 4b 点）、把法定要求说成自家产品独特卖点（第 10a 点）、宣传与产品或业务任何特征无关的消费者利益（Art 6(2)(e)）均属误导。商家须用统一通知（法定合格保证 2 年提示，显著展示，适用于全部商品）与统一标签（生产商提供免费、全件、超过 2 年的耐久性商业保证时，告知保证存在与期限并提示法定合格保证）；比较服务须把比较方法、比较对象与更新措施作为实质性信息（Art 7(7)）；电子远程合同下单前须直接、清晰显著地提示统一通知与统一标签信息（Art 8(2)）。售前信息义务还包括：软件更新最短期限（生产商／提供方向商家提供时，须以时间段或日期告知）、售后与商业保证、数字内容／服务法定保证提示、维修信息兜底（备件可得性／预估费用／订购程序、维修保养说明可得性、维修限制）；商家仅在生产商／提供方已向其提供信息时才负有标签、维修信息、软件更新期限的提供义务，无主动搜寻义务。软件更新类禁令（附件 I 第 23d／23e 点）：隐瞒更新会损害带数字元素商品功能或数字内容／服务使用；把仅提升功能的更新说成“必需”。耐久性／可维修性／过早淘汰类禁令（第 23f–23j 点）：为限制耐久性而设的功能仍做商业推广、虚假宣称正常使用下的耐久时长／强度、把不可维修的产品说成可维修、诱导提前更换／补充耗材、隐瞒或虚假宣称使用非原厂耗材／备件／配件会损害功能。例外：附件 I 第 2a 点不禁公共机构设立的标签；第 4a 点下附带清晰显著具体说明的声明不算“通用”声明；第 23f 点针对商业推广，不针对制造／上市本身。误导评估的特征清单新增“环境或社会特征”“循环性方面（耐久性、可维修性、可回收性）”及“地理或商业来源地”（Art 6(1)(b)）。本指令没有任何再生含量／回收含量配额或原产地义务，来源地仅作为误导判定的特征之一出现。须提供可维修性评分（如欧盟层面已建立）及其他维修信息。", "badge": null, "verified": "2026-11-20", "verifyNote": "EUR-Lex OJ 原文直读（Art 4、Art 22a 及序言 4、7、9、27–29、34–36）; 2026-11-25 审计复核：Art 6(2)(d) 适用范围由“碳中和类”更正为任何未来环保绩效声明，补可衡量有时限目标、资源配置、定期核查、核查结果向消费者公开四要素；区分 6(2)(d) 个案评估与附件 I 第 4c 点绝对禁止；补统一通知；B1–B13 全部并入（见 (b) empco-apply）", "sources": ["X59"], "quote": {"ref": "Art 6(2)(d) and Annex I point 4c, Directive (EU) 2024/825", "text": "Making an environmental claim related to future environmental performance without clear, objective, publicly available and verifiable commitments set out in a detailed and realistic implementation plan that includes measurable and time-bound targets and other relevant elements necessary to support its implementation, such as allocation of resources, and that is regularly verified by an independent third party expert, whose findings are made available to consumers. Claiming, based on the offsetting of greenhouse gas emissions, that a product has a neutral, reduced or positive impact on the environment in terms of greenhouse gas emissions.", "url": "https://eur-lex.europa.eu/eli/dir/2024/825/oj/eng", "verified": "2026-11-25", "note": "Added to support correction (c) C5: Art 6(2)(d) covers any future environmental performance claim (not only 'carbon-neutral' claims) and requires measurable time-bound targets, resource allocation, regular third-party verification and publication of findings; Annex I point 4c is an absolute ban on offset-based neutrality claims, distinct from the Art 6(2)(d) case-by-case regime."}}, {"id": "empco-review-report", "itemId": "empco-note", "kind": "firm", "prec": "day", "date": "2031-09-27", "from": null, "to": null, "label": "适用情况报告·2031-09-27", "title": "Art 3 欧委会适用情况报告须于 2031-09-27 前提交", "status": "计划；2031-09-27 到期，本线唯一的远期复核节点", "article": "Art 3", "scope": null, "conditions": null, "detail": "Art 3：欧委会须于 2031-09-27 前向欧洲议会和理事会提交本指令适用情况报告，评估统一标签／通知的有效性、对消费者参与绿色转型的总体贡献及对商家的影响，必要时附立法提案。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文 Art 3 核验（2026-11-24 审计）", "sources": ["X59"], "quote": {"ref": "Art 3, Directive (EU) 2024/825", "text": "By 27 September 2031, the Commission shall submit a report on the application of this Directive to the European Parliament and to the Council.", "url": "https://eur-lex.europa.eu/eli/dir/2024/825/oj/eng", "verified": "2026-11-25"}}]}]}]};

    var cat = row.byCategory[state.category];
    if (cat.base < range[0] || cat.base >= range[1]) return '';
    // 前置法规标在菱形标签上：委托法案→DA、实施法案→IA
    var pre = t('prePrefix') + cat.deps.map(depText).join(' · ');
    var ev = {
      id: row.key + '-' + state.category, itemId: row.key, kind: 'cond', prec: 'day',
      date: cat.base, label: footLabel(row), title: footTitle(row),
      status: row.status, article: row.article, scope: catLabel(row), roles: row.roles,
      conditions: row.rule + ' 配套：' + cat.deps.map(function (d) { return d.act + '生效后 ' + d.offset + ' 个月'; }).join('、') + '。',
      detail: row.detail, verified: null, pre: pre, quote: row.quote || null,
      verifyNote: row.verifyNote || '规则已核验；配套法案实时状态待核验', sources: row.sources
    };
    return eventNodeHtml(ev, range);
  }
  function catLabel(row) {
    if (LANG === 'en') return CAT_EN[state.category] || state.category;
    var th = law().themes.filter(function (t) { return t.categoryControl; })[0];
    var c = th.categoryControl.categories.filter(function (cc) { return cc.key === state.category; })[0];
    return c ? c.label : state.category;
  }

  function themeHtml(th, range, idx) {
    // 每行 = 左侧标签格 + 右侧一条 band；子行各占一行，标签与 band 纵向对齐。
    var lines = [];
    var head = '<div class="tname">' + esc(themeLabel(th)) + '</div>' +
      (th.sub ? '<div class="tsub">' + esc(themeSub(th)) + '</div>' : '');
    if (th.categoryControl) {
      var row0 = th.subrows[0];
      head += '<div class="tsub"><span class="rule">' + esc(catLabel(row0)) + (LANG === 'en' ? ': ' : '：') + '</span>' +
        esc(row0.byCategory[state.category].base.replace(/-/g, '.')) + (LANG === 'en' ? ' onward, ' : ' 起，') +
        esc(depsText(row0.byCategory[state.category].deps)) + (LANG === 'en' ? ', latest applies' : ' 取最晚') + '</div>';
    }
    var expandBtn = '';
    if (th.expand) {
      var open = !!state.expanded[th.key];
      expandBtn = '<button type="button" class="expand-btn" data-expand="' + esc(th.key) + '" aria-expanded="' + open + '">' +
        '<span class="plus">' + (open ? '−' : '+') + '</span> ' + esc(t('expandLabel')) + '</button>';
    }
    function bandFor(events) {
      var dated = events.filter(function (ev) { return ev.date || ev.from || ev.to; })
        .map(function (ev) { return clipEvent(ev, range); })
        .filter(function (ev) { return ev; });
      var undated = events.filter(function (ev) { return !ev.date && !ev.from && !ev.to; });
      var inner = '';
      dated.forEach(function (ev) { inner += isRange(ev) ? rangeBarHtml(ev, range) : eventNodeHtml(ev, range); });
      var html = '<div class="band">' + inner + '</div>';
      if (undated.length) {
        html += '<div class="nodate-row">' + undated.map(function (ev) {
          return '<span class="nodate-item"><span class="nodate-mark">○</span> ' + esc(evLabel(ev)) + ' — ' +
            esc(ev.status || t('nodate')) +
            ' <button type="button" data-evid="' + ev.id + '">' + t('viewDetail') + '</button></span>';
        }).join('') + '</div>';
      }
      return html;
    }
    function listFor(events) {
      // 沿革与依据按时间顺序竖排（最早在上）；节点标识按日期落在主时间轴同一刻度上
      // （与主泳道共用 frac/当前窗口，同一日期在展开列表与主带里横向对齐），
      // 标签贴在标识旁、按剩余空间自动换边（≤0.65 放右、>0.65 放左）；窗口外事件夹取到边缘。
      // 窄屏（≤768px）轨道太窄，CSS 回落为对齐列表，定位失效但不溢出。
      var clamp = function (x) { return Math.max(0.015, Math.min(0.985, x)); };
      var dated = events.filter(function (ev) { return ev.date || ev.from || ev.to; });
      var undated = events.filter(function (ev) { return !ev.date && !ev.from && !ev.to; });
      dated.sort(function (a, b) {
        var da = a.date || a.from, db = b.date || b.from;
        return da < db ? -1 : (da > db ? 1 : 0);
      });
      var html = '<div class="exp-list">';
      dated.forEach(function (ev) {
        var labelInner = '<span class="exp-date">' + esc(dateText(ev)) + '</span>' +
          '<span class="exp-title">' + esc(evLabel(ev)) + badgeHtml(ev) + '</span>' +
          '<span class="exp-go" aria-hidden="true">›</span>';
        if (isRange(ev)) {
          var fx1 = clamp(frac(ev.from, range)), fx2 = clamp(frac(ev.to, range));
          var cx = (fx1 + fx2) / 2;
          var side = cx <= 0.65 ? 'r' : 'l';
          var anchor = side === 'r' ? fx2 : fx1;
          html += '<button type="button" class="exp-item" data-evid="' + ev.id + '" aria-label="' + esc(ev.title) + ' ' + esc(dateText(ev)) + '">' +
            '<span class="exp-range ' + rangeClass(ev) + '" style="--mx1:' + (fx1 * 100).toFixed(2) + '%;--mx2:' + (fx2 * 100).toFixed(2) + '%" aria-hidden="true"></span>' +
            '<span class="exp-label ' + side + '" style="--mx:' + (anchor * 100).toFixed(2) + '%">' + labelInner + '</span></button>';
        } else {
          var fx = clamp(frac(ev.date, range));
          var side2 = fx <= 0.65 ? 'r' : 'l';
          var mark = ev.kind === 'cond' ? 'cond' : (ev.kind === 'plan' ? 'plan' : 'firm');
          html += '<button type="button" class="exp-item" data-evid="' + ev.id + '" aria-label="' + esc(ev.title) + ' ' + esc(dateText(ev)) + '">' +
            '<span class="exp-mark ' + mark + '" style="--mx:' + (fx * 100).toFixed(2) + '%" aria-hidden="true"></span>' +
            '<span class="exp-label ' + side2 + '" style="--mx:' + (fx * 100).toFixed(2) + '%">' + labelInner + '</span></button>';
        }
      });
      undated.forEach(function (ev) {
        html += '<button type="button" class="exp-item static" data-evid="' + ev.id + '" aria-label="' + esc(ev.title) + ' ' + esc(dateText(ev)) + '">' +
          '<span class="exp-mark firm" aria-hidden="true"></span>' +
          '<span class="exp-label"><span class="exp-date">' + esc(dateText(ev)) + '</span>' +
          '<span class="exp-title">' + esc(evLabel(ev)) + badgeHtml(ev) + '</span>' +
          '<span class="exp-go" aria-hidden="true">›</span></span></button>';
      });
      return html + '</div>';
    }
    if (th.subrows) {
      if (th.subrows.every(function (r) { return r.byCategory; })) {
        // 三项基准合并为一条泳道：三个菱形同带，前置法规标在各标签上
        var merged = '';
        th.subrows.forEach(function (r) { merged += footprintDiamond(r, range); });
        var catSum = '<div class="tsub"><span class="rule">' + esc(catLabel(th.subrows[0])) + (LANG === 'en' ? ': ' : '：') + '</span>' +
          th.subrows.map(function (r) {
            return esc(subrowLabel(r)) + ' ' + esc(r.byCategory[state.category].base.replace(/-/g, '.'));
          }).join(' · ') + '</div>';
        lines.push({
          label: '<div class="tname">' + esc(themeLabel(th)) + '</div>' +
            (th.sub ? '<div class="tsub">' + esc(themeSub(th)) + '</div>' : '') + catSum + expandBtn,
          band: '<div class="band">' + merged + '</div>'
        });
      } else {
        th.subrows.forEach(function (r, i) {
          var inner = '';
          if (r.byCategory) inner = footprintDiamond(r, range);
          else (r.events || []).forEach(function (ev) {
            if (!visibleByCaliber(ev)) return;
            var c = clipEvent(ev, range);
            if (c) inner += isRange(c) ? rangeBarHtml(c, range) : eventNodeHtml(c, range);
          });
          // 首行标签顺序：主题名 → 子行名 → 说明 → 类别规则
          var firstLabel = '<div class="tname">' + esc(themeLabel(th)) + '</div>' +
            '<div class="subname first">' + esc(subrowLabel(r)) + '</div>' +
            (th.sub ? '<div class="tsub">' + esc(themeSub(th)) + '</div>' : '') +
            (th.categoryControl ? '<div class="tsub"><span class="rule">' + esc(catLabel(r)) + (LANG === 'en' ? ': ' : '：') + '</span>' +
              esc(r.byCategory[state.category].base.replace(/-/g, '.')) + (LANG === 'en' ? ' onward, ' : ' 起，') +
              esc(depsText(r.byCategory[state.category].deps)) + (LANG === 'en' ? ', latest applies' : ' 取最晚') + '</div>' : '') +
            expandBtn;
          lines.push({
            label: i === 0 ? firstLabel : '<div class="subname">' + esc(subrowLabel(r)) + '</div>',
            band: '<div class="band">' + inner + '</div>'
          });
        });
      }
    } else if (th.noteRow) {
      lines.push({
        label: head + expandBtn,
        band: '<div class="band"><div class="noterow"><span class="notetext">' + esc(th.noteRow.text) +
          ' <button type="button" data-noterow="' + esc(th.key) + '">' + t('viewDetail') + '</button></span></div></div>'
      });
    } else if ((th.events || []).length) {
      lines.push({ label: head + expandBtn, band: bandFor((th.events || []).filter(visibleByCaliber)) });
    } else {
      lines.push({ label: head + expandBtn, band: '<div class="band"><div class="emptyrow">' + t('emptyTheme') + '</div></div>' });
    }
    if (th.expand && state.expanded[th.key]) {
      th.expand.groups.forEach(function (g) {
        var evs = g.events;
        // 口径过滤（页面级，v15.12）：全主题适用，无 cats 字段的事件对所有口径可见
        evs = evs.filter(visibleByCaliber);
        if (!evs.length) return;
        lines.push({
          cls: ' exp-row',
          label: '<div class="subname on">' + esc(groupLabel(g.label)) + '</div>',
          band: listFor(evs)
        });
      });
    }
    return '<section class="theme' + (idx % 2 === 1 ? ' alt' : '') + '" data-theme="' + esc(th.key) + '">' +
      lines.map(function (ln) {
        return '<div class="theme-row' + (ln.cls || '') + '"><div class="theme-label">' + ln.label + '</div><div class="track">' + ln.band + '</div></div>';
      }).join('') + '</section>';
  }

  function axisHtml(range) {
    var ticks = '';
    var y0 = +range[0].slice(0, 4), y1 = +range[1].slice(0, 4);
    var span = parseD(range[1]).getTime() - parseD(range[0]).getTime();
    var years = 864e5 * 365.25;
    for (var y = y0; y <= y1; y++) {
      var d = y + '-01-01';
      if (d < range[0] || d >= range[1]) continue;
      ticks += '<span class="tick" style="left:' + (frac(d, range) * 100).toFixed(3) + '%">' + y + '</span>';
    }
    if (span < 3.2 * years) {
      for (var y2 = y0; y2 <= y1; y2++) {
        var d2 = y2 + '-07-01';
        if (d2 < range[0] || d2 >= range[1]) continue;
        ticks += '<span class="tick minor" style="left:' + (frac(d2, range) * 100).toFixed(3) + '%">' + y2 + '.07</span>';
      }
    }
    return ticks;
  }

  function renderTimeline() {
    var l = law();
    var range = currentRange();
    var obsFrac = (OBS >= range[0] && OBS < range[1]) ? frac(OBS, range) : null;
    var html = '<div class="tl-scroll"><div class="tl" id="tl" style="--obsx:' + (obsFrac == null ? -1 : obsFrac.toFixed(4)) + '">';
    if (obsFrac != null) {
      var pillStyle = obsFrac < 0.06 ? 'left:0' : (obsFrac > 0.94 ? 'left:100%;transform:translateX(-100%)' : 'left:' + (obsFrac * 100).toFixed(2) + '%;transform:translateX(-50%)');
      html += '<div class="tl-obsrow" aria-hidden="true"><span class="obs-pill" style="' + pillStyle + '">' + t('obsDay') + '<br>' + OBS.replace(/-/g, '.') + '</span></div>' +
        '<div class="obsline" aria-hidden="true"></div>';
    }
    html += '<div class="tl-axis">' + axisHtml(range) + '</div>';
    html += l.themes.map(function (th, i) { return themeHtml(th, range, i); }).join('');
    html += '</div></div>';
    $('#timeline').innerHTML = html;
    // 观察线位置（CSS var 驱动，见样式表 .obsline）
    var tl = $('#tl');
    if (obsFrac != null) tl.style.setProperty('--obsx', obsFrac.toFixed(4));
    // 绑定节点与展开按钮；重复点同一节点关闭面板
    $$('#timeline .node, #timeline .rangebar').forEach(function (b) {
      b.addEventListener('click', function () {
        if (panelEl && panelKey === 'ev:' + b.dataset.evid) { closePanel(); return; }
        openDetail(findEvent(b.dataset.evid), b);
      });
    });
    $$('#timeline [data-evid]').forEach(function (b) {
      if (b.classList.contains('node') || b.classList.contains('rangebar')) return;
      b.addEventListener('click', function () {
        if (panelEl && panelKey === 'ev:' + b.dataset.evid) { closePanel(); return; }
        openDetail(findEvent(b.dataset.evid), b);
      });
    });
    $$('#timeline [data-expand]').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.expand;
        state.expanded[k] = !state.expanded[k];
        render();
      });
    });
    $$('#timeline [data-noterow]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (panelEl && panelKey === 'nr:' + b.dataset.noterow) { closePanel(); return; }
        var th = law().themes.filter(function (t) { return t.key === b.dataset.noterow; })[0];
        openNoteRow(th, b);
      });
    });
  }

  function findEvent(evid) {
    var found = null;
    allEvents(law()).forEach(function (ev) { if (ev.id === evid) found = ev; });
    if (found) return found;
    // 碳足迹菱形是按类别生成的
    law().themes.forEach(function (th) {
      (th.subrows || []).forEach(function (r) {
        if (r.byCategory && evid === r.key + '-' + state.category) {
          var cat = r.byCategory[state.category];
          found = {
            id: evid, itemId: r.key, kind: 'cond', prec: 'day', date: cat.base,
            label: footLabel(r), title: footTitle(r),
            status: r.status, article: r.article, scope: catLabel(r), roles: r.roles,
            conditions: r.rule + ' 配套：' + cat.deps.map(function (d) { return d.act + '生效后 ' + d.offset + ' 个月'; }).join('、') + '。',
            detail: r.detail, verified: null, verifyNote: r.verifyNote || '规则已核验；配套法案实时状态待核验',
            quote: r.quote || null, sources: r.sources
          };
        }
      });
    });
    return found;
  }

  function renderLegend() {
    $('#legend').innerHTML =
      '<span class="li"><span class="sw-dot"></span>' + t('legFirm') + '</span>' +
      '<span class="li"><span class="sw-dia"></span>' + t('legCond') + '</span>' +
      '<span class="li"><span class="sw-pln"></span>' + t('legPlan') + '</span>' +
      '<span class="li"><span class="sw-rng"></span>' + t('legRange') + '</span>' +
      '<span class="li"><span class="badge" style="font-size:10px;color:var(--warm-text);background:var(--warm-bg);border-radius:3px;padding:1px 4px">' + t('legBadge') + '</span>' + t('legUnver') + '</span>' +
      '<span class="sep">|</span><span>ⓘ ' + t('legHint') + '</span>' +
      '<span class="right">' + t('legNote') + '</span>';
  }

  /* ---------- 标签避让：按垂直区位贪心分槽 ---------- */
  // 区位 = 标签中心相对节点线的偏移(px)；同一区位内按横向区间排他。
  // 区位步距按本带最矮标签动态取（2 行标签 44px，3 行标签取标签高+8），相邻区位标签上下不重叠。
  function layoutAllBands() {
    // 高度只在同组内统一：主泳道一组、展开组一组；展开不再拉宽主泳道。
    // 带未注明日期行（nodate-row）的泳道，节点线按整条泳道（含该行）居中。
    $$('#timeline .theme').forEach(function (theme) {
      unifyGroup($$('.theme-row:not(.exp-row) .band', theme));
      unifyGroup($$('.theme-row.exp-row .band', theme));
    });
  }
  function unifyGroup(bands) {
    if (!bands.length) return;
    var maxLane = 76, items = [];
    bands.forEach(function (b) {
      var n = nodateH(b);
      var h = layoutBand(b, n);
      items.push({ band: b, n: n, lane: h + n });
      if (h + n > maxLane) maxLane = h + n;
    });
    items.forEach(function (it) { it.band.style.minHeight = (maxLane - it.n) + 'px'; });
  }
  function nodateH(band) {
    var nr = band.nextElementSibling;
    return (nr && nr.classList.contains('nodate-row')) ? nr.offsetHeight : 0;
  }
  function layoutBand(band, nodate) {
    var w = band.clientWidth;
    if (!w) return 76;
    var shift = (nodate || 0) / 2; // 节点线下移半个 nodate-row 高，与整条泳道中心对齐
    var nodes = [];
    var labels = [];
    $$('.node', band).forEach(function (n) {
      var lb = $('.nlabel', n);
      if (!lb) return;
      var x = parseFloat(n.style.left) / 100 * w;
      var lw = lb.offsetWidth;
      var flip = lb.classList.contains('flip');
      // 标签盒左缘在节点右侧 10px（留出标记图形），翻转时对称
      var item = { el: n, lb: lb, isRange: false, x: x, dotOff: 0,
        L: flip ? x - 10 - lw : x + 10, R: flip ? x - 10 : x + 10 + lw };
      nodes.push(item);
      labels.push(item);
    });
    $$('.rangebar', band).forEach(function (r) {
      var lb = $('.rlabel', r);
      if (!lb) return;
      var cx = parseFloat(lb.dataset.cx) * w;
      var lw = lb.offsetWidth;
      // 区间标签夹在轨道内，不伸进左侧标签列或溢出右缘
      var cxc = Math.max(lw / 2, Math.min(w - lw / 2, cx));
      if (cxc !== cx) lb.style.left = 'calc(50% + ' + (cxc - cx).toFixed(1) + 'px)';
      else lb.style.left = '';
      var barL = parseFloat(r.style.left) / 100 * w;
      var barR = barL + parseFloat(r.style.width) / 100 * w;
      labels.push({ el: r, lb: lb, isRange: true, x: cxc, L: cxc - lw / 2, R: cxc + lw / 2, barL: barL, barR: barR });
    });
    // 日期相近的节点图形上下错开（x 不动，日期读数不变）
    var sorted = nodes.slice().sort(function (a, b) { return a.x - b.x; });
    var offs = [0, 14, -14, 28, -28, 42, -42];
    var ci = 0;
    sorted.forEach(function (it, i) {
      if (i > 0 && it.x - sorted[i - 1].x > 11) ci = 0;
      it.dotOff = offs[ci] || 0;
      ci++;
    });
    // 3 行标签（前置法规行）需要更大的区位步距，避免相邻区位上下重叠
    var maxH = 34;
    labels.forEach(function (it) { maxH = Math.max(maxH, it.lb.offsetHeight); });
    var step = Math.max(44, maxH + 8);
    var Z = [0, step, -step, 2 * step, -2 * step, 3 * step, -3 * step, 4 * step, -4 * step, 5 * step, -5 * step];
    var NODE_PREF = Z.slice();
    var RANGE_PREF = [step, -step, 2 * step, -2 * step, 3 * step, -3 * step, 4 * step, -4 * step, 5 * step, -5 * step, 0];
    labels.sort(function (a, b) { return a.L - b.L; });
    var zoneLabels = {}; // 区位 -> 已放标签 [{L, R}]
    var zoneBars = {};   // 区位 -> 已放区间条 [{L, R}]
    var used = {};
    function zoneBlocked(it, z, lh) {
      var ls = zoneLabels[z] || [];
      var bs = zoneBars[z] || [];
      var i, k;
      // 同区位已有标签横向相交
      for (i = 0; i < ls.length; i++) if (ls[i].R + 8 > it.L && ls[i].L - 8 < it.R) return true;
      // 该区位的标签是否会盖住别的节点图形（按实际纵向位置判断）
      for (k = 0; k < nodes.length; k++) {
        var nd = nodes[k];
        if (nd.x + 6 < it.L || nd.x - 6 > it.R) continue;
        var dTop = shift + nd.dotOff - 6, dBot = shift + nd.dotOff + 6;
        var lTop = shift + z - lh / 2, lBot = shift + z + lh / 2;
        if (dBot > lTop && dTop < lBot) return true;
      }
      // 标签与同区位区间条相交（双向：节点标签撞已放的条，新区间条撞已放的标签）
      if (it.isRange) {
        for (i = 0; i < ls.length; i++) if (ls[i].R > it.barL && ls[i].L < it.barR) return true;
      } else {
        for (i = 0; i < bs.length; i++) if (bs[i].R > it.L && bs[i].L < it.R) return true;
      }
      return false;
    }
    // 区位分配迭代：图形错位与标签区位同向对齐（同一簇内，图形在标签同侧），
    // 避免图形与标签上下颠倒、可读性差；图形移动后可能改变盖点检查结果，故重跑分配，最多 3 轮。
    for (var iter = 0; iter < 3; iter++) {
      zoneLabels = {}; zoneBars = {}; used = {};
      labels.forEach(function (it) {
        var pref = it.isRange ? RANGE_PREF : NODE_PREF;
        var lh = it.lb.offsetHeight;
        var zone = pref[pref.length - 1];
        for (var i = 0; i < pref.length; i++) {
          var z = pref[i];
          if (zoneBlocked(it, z, lh)) continue;
          zone = z;
          break;
        }
        it.zone = zone;
        (zoneLabels[zone] = zoneLabels[zone] || []).push({ L: it.L, R: it.R });
        if (it.isRange) (zoneBars[zone] = zoneBars[zone] || []).push({ L: it.barL, R: it.barR });
        used[zone] = true;
      });
      var changed = false;
      var clusters = [];
      var cur = null;
      sorted.forEach(function (it) {
        if (!cur || it.x - cur.last.x > 11) { cur = { items: [], last: it }; clusters.push(cur); }
        cur.items.push(it); cur.last = it;
      });
      clusters.forEach(function (c) {
        if (c.items.length < 2) return;
        var pos = c.items.filter(function (it) { return it.zone > 0; }).sort(function (a, b) { return a.zone - b.zone; });
        var neg = c.items.filter(function (it) { return it.zone < 0; }).sort(function (a, b) { return b.zone - a.zone; });
        var zero = c.items.filter(function (it) { return it.zone === 0; }).sort(function (a, b) { return a.x - b.x; });
        var i, off;
        for (i = 0; i < pos.length; i++) { off = (i + 1) * 14; if (pos[i].dotOff !== off) { pos[i].dotOff = off; changed = true; } }
        for (i = 0; i < neg.length; i++) { off = -(i + 1) * 14; if (neg[i].dotOff !== off) { neg[i].dotOff = off; changed = true; } }
        for (i = 0; i < zero.length; i++) { off = i === 0 ? 0 : (i % 2 ? 14 : -14) * Math.ceil(i / 2); if (zero[i].dotOff !== off) { zero[i].dotOff = off; changed = true; } }
      });
      if (!changed) break;
    }
    labels.forEach(function (it) {
      if (it.isRange) {
        // 区间条随区位移动，标签居中于条上，不再双重偏移。
        it.el.style.top = 'calc(50% + ' + (it.zone + shift) + 'px)';
        it.lb.style.top = '50%';
      } else {
        // 节点按钮整体下移 shift 与图形错位 dotOff，标签相对按钮反补 dotOff，仍落在指定区位。
        it.el.style.top = 'calc(50% + ' + (shift + it.dotOff) + 'px)';
        it.lb.style.top = 'calc(50% + ' + (it.zone - it.dotOff) + 'px)';
      }
    });
    var pos = 0, neg = 0;
    Object.keys(used).forEach(function (k) {
      var z = +k;
      if (z > 0) pos = Math.max(pos, z);
      if (z < 0) neg = Math.max(neg, -z);
    });
    // 带高按最远区位计：旧式 76+pos+neg 只在正负区位对称时够高；区位不对称
    // （或带 nodate-row，节点线下移 shift=nodate/2）时标签会伸出泳道底部、
    // 盖住 nodate-row。按较远一侧区位取 2*max(pos,neg)，另加最矮标签高、
    // nodate-row 高与 8px 裕量。
    return Math.max(76, 2 * Math.max(pos, neg) + maxH + (nodate || 0) + 8);
  }

  /* ---------- 行内详情面板（展开在所属主题下方，手机端为底部浮层） ---------- */
  var lastFocus = null;
  var panelEl = null;
  var panelKey = null;
  function sourceList(keys) {
    if (!keys || !keys.length) return '<p>' + t('nosrc') + '</p>';
    return '<ul class="srcs">' + keys.map(function (k) {
      var s = DATA.sources[k];
      if (!s) return '';
      return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.org) + ' · ' + esc(s.title) + '</a>' +
        (s.doc ? '（' + esc(s.doc) + '）' : '') + '</li>';
    }).join('') + '</ul>';
  }
  var STATUS_TAG_OVERRIDE = { 'dd-orig': '已延期', 'dd-guide': '已逾期' };
  function statusTag(ev) {
    if (STATUS_TAG_OVERRIDE[ev.id]) return STATUS_TAG_OVERRIDE[ev.id];
    if (ev.badge === '草案') return '草案';
    if (ev.badge === '提案') return '提案';
    if (ev.kind === 'cond') return '待配套法案';
    if (ev.kind === 'plan') return '计划';
    if (ev.kind === 'period') return '期间';
    var st = ev.status || '';
    var ti = ev.title || '';
    if (/咨询已截止/.test(st)) return '咨询已截止';
    if (/已上线/.test(st)) return '已上线';
    if (/已发布/.test(st)) return '已发布';
    if (/尚未适用/.test(st)) return '尚未适用';
    if (/正式期进行中/.test(st)) return '进行中';
    if (/部分已适用/.test(st)) return '部分已适用';
    var d = ev.date || ev.from || '';
    if (d && d > OBS) return '待适用';
    if (/生效/.test(ti)) return '已生效';
    if (/通过/.test(ti)) return '已通过';
    if (/发布/.test(ti)) return '已发布';
    if (/上线/.test(ti)) return '已上线';
    if (/截止/.test(ti)) return '已截止';
    if (/开始/.test(ti)) return '已开始';
    if (/提案/.test(ti)) return '已提案';
    if (/草案/.test(ti)) return '草案';
    if (/报告/.test(ti)) return '已发布';
    if (/延期/.test(ti)) return '已延期';
    return '已确定';
  }
  function statusTagClass(tag) {
    if (tag === '草案' || tag === '提案' || tag === '已逾期') return 'st-draft';
    if (tag === '待配套法案') return 'st-cond';
    if (tag === '计划' || tag === '期间' || tag === '待适用' || tag === '尚未适用') return 'st-pending';
    return 'st-done';
  }
  function quoteHtml(ev) {
    var q = ev.quote;
    if (q && q.text) {
      return '<h3>' + t('origLaw') + '</h3><blockquote class="quote"><p>' + esc(q.text) + '</p>' +
        '<cite>' + esc(q.ref || ev.article || '') +
        (q.url ? ' · <a href="' + esc(q.url) + '" target="_blank" rel="noopener">' + t('viewOJ') + '</a>' : '') + '</cite></blockquote>' +
        (q.showNote && q.note ? '<p class="qnote">' + esc(q.note) + '</p>' : '');
    }
    return '<h3>' + t('origLaw') + '</h3><p class="noquote">' + esc((q && q.note) || t('noquote')) +
      ((q && q.url) ? ' <a href="' + esc(q.url) + '" target="_blank" rel="noopener">' + t('viewSrc') + '</a>' : '') + '</p>';
  }
  function panelHtml(titleHtml, tagHtml, quote, kvHtml, detailText, sources) {
    var longCls = detailText && detailText.length > 220 ? ' long' : '';
    return '<div class="dp-head"><div>' + titleHtml + '</div>' +
      '<div class="dp-head-right">' + tagHtml +
      '<button type="button" class="dp-close" id="dpClose" aria-label="' + t('closeDetail') + '">✕</button></div></div>' +
      '<div class="dp-body">' + quote +
      '<h3>' + t('keyinfo') + '</h3><dl class="kv">' + kvHtml + '</dl>' +
      (detailText ? '<h3>' + t('desc') + '</h3><p class="detail' + longCls + '">' + esc(detailText) + '</p>' +
        (detailText.length > 220 ? '<button type="button" class="more" id="dpMore">' + t('more') + '</button>' : '') : '') +
      '<h3>' + t('sources') + '</h3>' + sourceList(sources) + '</div>';
  }
  function openPanel(themeKey, key, html, invoker) {
    closePanel(true);
    lastFocus = invoker || document.activeElement;
    panelKey = key;
    var sec = $('.theme[data-theme="' + themeKey + '"]', $('#timeline'));
    if (!sec) return;
    panelEl = document.createElement('div');
    panelEl.className = 'detail-panel';
    panelEl.setAttribute('role', 'region');
    panelEl.setAttribute('aria-label', t('detailRegion'));
    panelEl.innerHTML = html;
    sec.appendChild(panelEl);
    $('#dpClose', panelEl).addEventListener('click', function () { closePanel(); });
    var mb = $('#dpMore', panelEl);
    if (mb) mb.addEventListener('click', function () {
      var p = $('.detail', panelEl);
      p.classList.toggle('open');
      mb.textContent = p.classList.contains('open') ? t('less') : t('more');
    });
    $('#dpClose', panelEl).focus();
    if (window.innerWidth > 768) panelEl.scrollIntoView({ block: 'nearest' });
  }
  function closePanel(keepFocus) {
    if (panelEl) { panelEl.remove(); panelEl = null; }
    panelKey = null;
    if (!keepFocus && lastFocus && lastFocus.focus) {
      try { lastFocus.focus(); } catch (e) { /* 原节点已被重渲染移除 */ }
      lastFocus = null;
    }
  }
  function themeOf(ev) {
    var found = null;
    law().themes.forEach(function (th) {
      var hit = (th.events || []).some(function (e) { return e.id === ev.id; }) ||
        (th.subrows || []).some(function (r) {
          return r.key === ev.itemId || (r.events || []).some(function (e) { return e.id === ev.id; });
        }) ||
        ((th.expand || {}).groups || []).some(function (g) { return g.events.some(function (e) { return e.id === ev.id; }); });
      if (hit) found = th;
    });
    return found;
  }
  function kindTag(ev) {
    if (isRange(ev)) return ev.kind === 'plan' ? t('kindRangePlan') : (ev.kind === 'period' ? t('kindPeriod') : t('kindRange'));
    return ev.kind === 'cond' ? t('kindCond') : (ev.kind === 'plan' ? t('kindPlan') : t('kindFirm'));
  }
  function openDetail(ev, invoker) {
    if (!ev) return;
    var th = themeOf(ev);
    var l = law();
    var head = '<div class="kicker">' + esc(lawLabel(l)) + (th ? ' · ' + esc(themeLabel(th)) : '') + '</div><h2>' + esc(evTitle(ev)) + '</h2>';
    var kv = '<dt>' + t('kvDate') + '</dt><dd>' + esc(dateText(ev)) + '<span class="tag">' + kindTag(ev) + '</span>' +
      (ev.badge ? '<span class="tag warn">' + esc(badgeText(ev.badge)) + '</span>' : '') + '</dd>';
    if (ev.article) kv += '<dt>' + t('kvArt') + '</dt><dd>' + esc(ev.article) + '</dd>';
    if (ev.scope) kv += '<dt>' + t('kvScope') + '</dt><dd>' + esc(ev.scope) + '</dd>';
    if (ev.roles) kv += '<dt>' + t('kvRoles') + '</dt><dd>' + esc(ev.roles) + '</dd>';
    if (ev.conditions) kv += '<dt>' + t('kvCond') + '</dt><dd>' + esc(ev.conditions) + '</dd>';
    var tag = tagText(statusTag(ev));
    var tagHtml = '<span class="status-tag ' + statusTagClass(tag) + '">' + esc(tag) + '</span>';
    openPanel(th ? th.key : l.themes[0].key, 'ev:' + ev.id,
      panelHtml(head, tagHtml, quoteHtml(ev), kv, ev.detail, ev.sources), invoker);
  }
  function openNoteRow(th, invoker) {
    var nr = th.noteRow;
    var l = law();
    var head = '<div class="kicker">' + esc(lawLabel(l)) + ' · ' + esc(themeLabel(th)) + '</div><h2>' + esc(nr.title) + '</h2>';
    var kv = '<dt>' + t('kvDate') + '</dt><dd>' + t('noDateNote') + '</dd>';
    if (nr.article) kv += '<dt>' + t('kvArt') + '</dt><dd>' + esc(nr.article) + '</dd>';
    openPanel(th.key, 'nr:' + th.key,
      panelHtml(head, '', '', kv, nr.detail, nr.sources),
      invoker);
  }

  /* ---------- 顶栏：胶囊定位 / 滚动收紧 / 主题记忆 ---------- */
  function movePill(instant) {
    var on = document.querySelector('.tb-nav a.on');
    var pill = document.querySelector('.tb-pill');
    if (!on || !pill) return;
    if (instant) pill.style.transition = 'none';
    pill.style.transform = 'translateX(' + on.offsetLeft + 'px)';
    pill.style.width = on.offsetWidth + 'px';
    if (instant) { void pill.offsetWidth; pill.style.transition = ''; }
  }
  window.movePill = movePill;
  var __pillAnimated = (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('.tb-nav a'));
    var cur = -1;
    links.forEach(function (a, i) { if (a.classList.contains('on')) cur = i; });
    if (cur < 0) return false;
    var prev = -1;
    try { prev = parseInt(sessionStorage.getItem('lcaradar-nav-prev') || '-1', 10); } catch (e) {}
    try { sessionStorage.setItem('lcaradar-nav-prev', String(cur)); } catch (e) {}
    var pill = document.querySelector('.tb-pill');
    if (!pill) return false;
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (prev >= 0 && prev < links.length && prev !== cur && !reduced) {
      pill.style.transition = 'none';
      pill.style.transform = 'translateX(' + links[prev].offsetLeft + 'px)';
      pill.style.width = links[prev].offsetWidth + 'px';
      window.addEventListener('load', function () {
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          pill.style.transition = '';
          void pill.offsetWidth;
          movePill();
        }); });
      });
      return true;
    }
    movePill(true);
    return false;
  })();
  function onScroll() {
    var tb = document.querySelector('.topbar');
    if (!tb) return;
    var c = window.scrollY > 48;
    if (tb.classList.contains('tb-compact') !== c) {
      tb.classList.toggle('tb-compact', c);
      document.body.classList.toggle('tb-compact', c);
    }
  }
  function navScroll() {
    var nav = document.querySelector('.tb-nav');
    var on = document.querySelector('.tb-nav a.on');
    if (nav && on) { try { on.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
    document.querySelectorAll('.tb-nav').forEach(function (el) {
      el.classList.toggle('hscroll', el.scrollWidth > el.clientWidth + 2);
    });
  }

  /* ---------- 语言切换：重渲染全部内容 ---------- */
  function applyLang(lang) {
    LANG = (lang === 'en') ? 'en' : 'zh';
    storeSet('lca-lang', LANG);
    document.documentElement.classList.toggle('lang-en', LANG === 'en');
    document.documentElement.setAttribute('lang', LANG === 'en' ? 'en' : 'zh-CN');
    document.title = LANG === 'en' ? 'Regulation Tracker · LCA RADAR' : '法规监控 · LCA 瞭望';
    document.querySelectorAll('input[name="lca-lang"]').forEach(function (r) { r.checked = (r.value === LANG); });
    document.querySelectorAll('.tb-nav a[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      if (TL[LANG] && (k in TL[LANG])) el.textContent = TL[LANG][k];
    });
    var si = document.getElementById('searchInput');
    if (si) si.setAttribute('placeholder', t('searchPh'));
    var ov = document.getElementById('searchOv');
    if (ov) ov.setAttribute('aria-label', t('searchLabel'));
    var sb = document.getElementById('tbSearchBtn');
    if (sb) sb.setAttribute('title', t('searchTitle'));
    var ll = document.getElementById('lawselLabel');
    if (ll) ll.textContent = t('lawtabsLabel');
    var ls = document.getElementById('lawsel');
    if (ls) ls.setAttribute('aria-label', t('lawtabsLabel'));
    var ts = document.querySelector('.theme-switch');
    if (ts) ts.setAttribute('aria-label', t('themeLabel'));
    render();
    if (window.movePill) requestAnimationFrame(function () { window.movePill(true); });
  }
  function initLang() {
    applyLang(LANG);
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      document.documentElement.classList.add('lang-ready');
    }); });
    document.querySelectorAll('.lang-switch').forEach(function (sw) {
      if (sw.__langBound) return;
      sw.__langBound = true;
      sw.addEventListener('click', function (e) {
        var label = e.target.closest('label');
        if (!label) return;
        var input = label.querySelector('input');
        if (input) applyLang(input.value);
      });
    });
  }

  /* ---------- 顶栏搜索：事件标题关键词搜索，定位并高亮 ---------- */
  var SEARCH_INDEX = null;
  function buildSearchIndex() {
    var idx = [];
    DATA.laws.forEach(function (l) {
      l.themes.forEach(function (th) {
        var push = function (ev, themeKey, inExpand) {
          idx.push({
            id: ev.id, law: l.key, theme: themeKey, inExpand: !!inExpand,
            label: ev.label, title: ev.title,
            enLabel: (EVENT_EN[ev.id] || [])[0] || ev.label,
            enTitle: (EVENT_EN[ev.id] || [])[1] || ev.title,
            themeZh: th.label, themeEn: THEME_EN[th.key] || th.label,
            date: ev.date || ev.from || ''
          });
        };
        (th.events || []).forEach(function (ev) { push(ev, th.key, false); });
        (th.subrows || []).forEach(function (r) {
          (r.events || []).forEach(function (ev) { push(ev, th.key, false); });
          if (r.byCategory) {
            idx.push({
              id: r.key + '-ev', law: l.key, theme: th.key, inExpand: false, synthetic: true,
              label: r.label + '基准', title: r.label + '（' + CAT_EN.ev + '）',
              enLabel: (SUBROW_EN[r.key] || r.label) + ' baseline',
              enTitle: (SUBROW_EN[r.key] || r.label) + ' (EV batteries)',
              themeZh: th.label, themeEn: THEME_EN[th.key] || th.label,
              date: r.byCategory.ev.base
            });
          }
        });
        ((th.expand || {}).groups || []).forEach(function (g) {
          (g.events || []).forEach(function (ev) { push(ev, th.key, true); });
        });
      });
    });
    return idx;
  }
  var searchOpen = false;
  var searchReturnFocus = null;
  function openSearch() {
    var ov = document.getElementById('searchOv');
    var inp = document.getElementById('searchInput');
    if (!ov || !inp || searchOpen) return;
    searchReturnFocus = document.activeElement || null;
    searchOpen = true;
    ov.classList.add('on');
    inp.value = '';
    renderSearch();
    setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }, 50);
  }
  function closeSearch() {
    var ov = document.getElementById('searchOv');
    if (!ov || !searchOpen) return;
    searchOpen = false;
    ov.classList.remove('on');
    var target = searchReturnFocus && document.contains(searchReturnFocus) && typeof searchReturnFocus.focus === 'function'
      ? searchReturnFocus : document.getElementById('tbSearchBtn');
    searchReturnFocus = null;
    if (target) { try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); } }
  }
  function renderSearch() {
    var inp = document.getElementById('searchInput');
    var res = document.getElementById('searchRes');
    if (!inp || !res) return;
    var q = inp.value.trim().toLowerCase();
    if (!q) { res.innerHTML = '<div class="empty">' + esc(t('searchHint')) + '</div>'; return; }
    var hits = SEARCH_INDEX.filter(function (it) {
      return (it.label + ' ' + it.title + ' ' + it.enLabel + ' ' + it.enTitle + ' ' + (it.themeZh || '') + ' ' + (it.themeEn || '')).toLowerCase().indexOf(q) >= 0;
    }).slice(0, 20);
    if (!hits.length) { res.innerHTML = '<div class="empty">' + esc(t('searchEmpty')) + '</div>'; return; }
    res.innerHTML = hits.map(function (it) {
      var lab = LANG === 'en' ? it.enLabel : it.label;
      return '<a href="#" data-search-id="' + it.id + '"><div class="rt">' + esc(lab) + '</div>' +
        '<div class="rm">' + esc(lawLabelByKey(it.law)) + (it.date ? ' · ' + esc(fmtD(it.date)) : '') + '</div></a>';
    }).join('');
    $$('#searchRes a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var item = null;
        SEARCH_INDEX.forEach(function (it) { if (it.id === a.dataset.searchId) item = it; });
        if (item) goToEvent(item);
      });
    });
  }
  function goToEvent(item) {
    closeSearch();
    state.law = item.law;
    state.window = 'full';
    if (item.synthetic) state.category = 'ev';
    if (item.inExpand) state.expanded[item.theme] = true;
    render();
    requestAnimationFrame(function () {
      var el = document.querySelector('#timeline [data-evid="' + item.id + '"]');
      if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.add('search-hit');
      setTimeout(function () { el.classList.remove('search-hit'); }, 2600);
    });
  }
  function initSearch() {
    SEARCH_INDEX = buildSearchIndex();
    var btn = document.getElementById('tbSearchBtn');
    var ov = document.getElementById('searchOv');
    var inp = document.getElementById('searchInput');
    if (!btn || !ov || !inp) return;
    btn.addEventListener('click', openSearch);
    ov.addEventListener('click', function (e) { if (e.target === ov) closeSearch(); });
    inp.addEventListener('input', renderSearch);
  }

  /* ---------- 启动 ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    initLang();
    if (!__pillAnimated) movePill();
    onScroll();
    navScroll();
    initSearch();
    document.querySelectorAll('.tb-theme input[name="lca-theme"]').forEach(function (r) {
      r.addEventListener('change', function () { storeSet('lca-watch-theme', r.value); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
      if (e.key === 'Escape') {
        if (searchOpen) { closeSearch(); return; }
        if (panelEl) closePanel();
      }
    });
    window.addEventListener('resize', function () { layoutAllBands(); movePill(); navScroll(); });
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('load', function () { if (!__pillAnimated) movePill(); navScroll(); });
  });
})();

</script>
