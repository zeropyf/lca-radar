<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>!function(){try{var m=localStorage.getItem("lca-watch-theme");if(m==="dark"||m==="light")document.documentElement.classList.add("force-"+m)}catch(e){}}();</script>
<script>!function(){try{if(localStorage.getItem("lca-lang")==="en")document.documentElement.classList.add("lang-en")}catch(e){}}();</script>
<title>法规监控 · LCA 瞭望</title>
<style>
/* 法规时间轴全景 v15 预览：日报视觉语言，白底 / 深蓝 / 青色，细灰线，无卡片嵌套。 */
:root{
  --ink:#0f2841; --accent:#00bebe; --accent-text:#087f80;
  --body:#54585a; --muted:#747b83; --line:#e4e4e6; --subtle:#f4f6f8;
  --active:#e9f6f5; --warm-bg:#faebdc; --warm-text:#84552d;
  --amber:#c77414; --danger:#9b2c2c;
  --surface:#fff; --panelbg:#f7f9fb; --edge:#d5d8db; --bandline:#e9ebed;
  --themelin:#d8dce0; --tick:#c9ced3; --dash:#9aa1a8; --minor:#a8adb3; --onaccent:#fff;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--surface);color:var(--body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;padding-top:64px;transition:padding-top .3s ease}
body.tb-compact{padding-top:46px}
button{font-family:var(--font)}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.page{max-width:1360px;margin:0 auto;padding:0 36px 48px}

/* ===== 顶栏（与主站一致；顶栏所需变量定义在 .topbar 自身作用域内，不碰全局 :root）===== */
.topbar{--primary:#0f2841;--seg-bg:#F1F3F5;--seg-on:#FFFFFF;--card:#FFFFFF;--gray:#8D8D8F;
  position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:28px;
  padding:0 28px;height:64px;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  transition:height .3s ease}
.topbar.tb-compact{height:46px}
.topbar.tb-compact .tb-logo img{height:22px}
.topbar.tb-compact .tb-nav{transform:translate(-50%,-50%) scale(.87)}
.topbar.tb-compact .tb-theme .theme-switch{transform:scale(.66)}
.tb-logo{display:flex;align-items:center;text-decoration:none;line-height:0}
.tb-logo img{height:32px;width:auto;display:block;transition:height .3s ease}
.tb-logo .logo-dark{display:none}
html:has(.theme-switch input[value="dark"]:checked) .tb-logo .logo-light{display:none}
html:has(.theme-switch input[value="dark"]:checked) .tb-logo .logo-dark{display:block}
@media (prefers-color-scheme:dark){
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .tb-logo .logo-light{display:none}
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .tb-logo .logo-dark{display:block}
}
html.force-dark .tb-logo .logo-light{display:none}
html.force-dark .tb-logo .logo-dark{display:block}
html.force-light .tb-logo .logo-light{display:block}
html.force-light .tb-logo .logo-dark{display:none}
.tb-nav{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);display:flex;gap:2px;
  background:var(--seg-bg);border-radius:999px;padding:3px;transition:transform .3s ease}
.tb-nav a{position:relative;z-index:1;padding:8px 20px;border-radius:999px;font-size:15px;color:var(--gray);
  text-decoration:none;font-weight:500;white-space:nowrap;transition:color .25s}
.tb-nav a:hover{color:var(--body)}
.tb-nav a.on{color:var(--primary)}
.tb-pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--seg-on);
  box-shadow:0 1px 3px rgba(0,0,0,.10);z-index:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.3,1.25,.5,1),width .34s cubic-bezier(.3,1.25,.5,1)}
.tb-theme{display:flex;align-items:center;margin-left:auto}
.tb-theme .theme-switch{transform:scale(.82);transform-origin:right center;margin:0;transition:transform .3s ease}
.tb-search{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--gray);cursor:pointer;flex:none}
.tb-search:hover{color:var(--primary);border-color:var(--primary)}
.tb-search svg{width:18px;height:18px}
.lang-switch{position:relative;display:flex;align-items:center;border:1px solid var(--line);border-radius:18px;padding:2px;background:transparent;cursor:pointer;flex:none}
.lang-switch .thumb{position:absolute;top:2px;left:2px;width:calc(50% - 2px);height:calc(100% - 4px);background:var(--primary);border-radius:16px;z-index:0;pointer-events:none}
html.lang-ready .lang-switch .thumb{transition:transform .25s ease}
.lang-switch label{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-width:38px;height:32px;padding:0 10px;font-size:13px;font-weight:600;color:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.lang-switch label span{position:relative;z-index:1}
.lang-switch input{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.lang-switch input:checked + span{color:#fff}
.lang-switch:has(input[value="zh"]:checked) .thumb{transform:translateX(0)}
.lang-switch:has(input[value="en"]:checked) .thumb{transform:translateX(100%)}
html.lang-en .lang-switch .thumb{transform:translateX(100%)}
html:has(.theme-switch input[value="dark"]:checked) .lang-switch label{color:#c8d2e0}
html:has(.theme-switch input[value="dark"]:checked) .lang-switch input:checked+span{color:#0f2841}
@media (prefers-color-scheme:dark){
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .lang-switch label{color:#c8d2e0}
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .lang-switch input:checked+span{color:#0f2841}
}
html.force-dark .lang-switch label{color:#c8d2e0}
html.force-dark .lang-switch input:checked+span{color:#0f2841}
.theme-switch{display:inline-flex;background:var(--seg-bg);border-radius:999px;padding:3px;gap:2px;position:relative}
.theme-switch label{flex:0 0 auto;cursor:pointer;position:relative;z-index:1}
.theme-switch input{position:absolute;opacity:0;pointer-events:none;width:0}
.theme-switch label span{display:flex;align-items:center;justify-content:center;width:36px;height:30px;
  border-radius:999px;color:var(--gray);transition:color .2s}
.theme-switch label span svg{width:16px;height:16px;display:block}
.theme-switch label:hover span{color:var(--primary)}
.theme-switch input:checked+span{color:var(--primary)}
.theme-switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.theme-switch .thumb{position:absolute;top:3px;left:3px;width:36px;height:30px;background:var(--seg-on);
  border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:0;pointer-events:none;
  transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
.theme-switch:has(input[value="light"]:checked) .thumb{transform:translateX(0)}
.theme-switch:has(input[value="auto"]:checked) .thumb{transform:translateX(38px)}
.theme-switch:has(input[value="dark"]:checked) .thumb{transform:translateX(76px)}
html.force-dark .theme-switch .thumb{transform:translateX(76px)}
html.force-light .theme-switch .thumb{transform:translateX(0)}
@media(max-width:900px){
  .topbar{gap:8px;padding:0 10px;overflow:hidden}
  .tb-logo{flex:none}
  .tb-logo img{height:26px}
  .tb-nav{position:relative;left:auto;top:auto;transform:scale(1);margin:0;flex:1 1 auto;min-width:0;max-width:calc(100vw - 130px);overflow-x:auto;scrollbar-width:none;transition:transform .3s ease}
  .tb-nav::-webkit-scrollbar{display:none}
  .topbar.tb-compact .tb-nav{transform:scale(.87)}
  .tb-nav a{padding:6px 12px;font-size:14px;flex:none}
  .tb-theme{flex:none;margin-left:0}
  .tb-nav.hscroll{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
}
@media (prefers-reduced-motion:reduce){
  .tb-pill{transition:none}
  .tb-nav{transition:none}
  .topbar,.tb-logo img,.tb-theme .theme-switch{transition:none}
}
/* 顶栏搜索浮层（站内搜索，见 JS） */
.search-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.search-ov.on{display:flex}
.search-box{width:100%;max-width:560px;background:var(--surface);border-radius:16px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.2);border:1px solid var(--line)}
.search-box input{width:100%;border:none;outline:none;padding:16px 20px;font-size:16px;
  background:transparent;color:var(--ink)}
.search-res{max-height:50vh;overflow-y:auto;padding:8px}
.search-res a{display:block;padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--ink)}
.search-res a:hover{background:var(--subtle)}
.search-res .rt{font-size:14.5px;font-weight:600;line-height:1.5}
.search-res .rm{font-size:12.5px;color:var(--muted);margin-top:2px}
.search-res .empty{padding:20px;text-align:center;color:var(--minor);font-size:14px}
/* 搜索命中高亮 */
.node.search-hit .dot,.rangebar.search-hit{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}
.exp-item.search-hit{background:var(--active)}

/* 法规入口 */
.lawtabs{display:flex;gap:36px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.lawtabs::-webkit-scrollbar{display:none}
.lawtab{appearance:none;background:none;border:0;padding:14px 2px 12px;font-size:17px;color:var(--body);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.lawtab:hover{color:var(--ink)}
.lawtab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

/* 法规标题区 */
.lawhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:26px 0 4px;flex-wrap:wrap}
.lawhead h1{margin:0;font-size:30px;line-height:1.2;color:var(--ink);font-weight:700}
.lawhead .doc{margin-top:4px;font-size:14px;color:var(--muted)}
.lawhead .doc .docstatus{color:var(--accent-text)}
.lawhead .doc .docstatus.unverified{color:var(--warm-text)}
.lawhead .meta{font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:4px}
.warnbar{margin:14px 0 0;padding:10px 14px;background:var(--warm-bg);color:var(--warm-text);font-size:13px;border-radius:4px}
.contextline{margin:10px 0 0;font-size:13px;color:var(--muted)}

/* 控件 */
.controls{display:flex;gap:12px;margin:18px 0 6px;flex-wrap:wrap}
.pillselect{appearance:none;border:1px solid var(--edge);background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%2354585a' fill='none' stroke-width='1.4'/></svg>") no-repeat right 12px center;border-radius:999px;padding:8px 32px 8px 16px;font-size:14px;color:var(--ink);cursor:pointer}
.pillselect:hover{border-color:var(--accent)}
.controls .hint{font-size:12px;color:var(--muted);align-self:center}
.window-note{display:none;margin:8px 0 0;font-size:13px;color:var(--warm-text)}
.window-note.show{display:block}
.window-note button{margin-left:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent-text);border-radius:999px;padding:3px 12px;font-size:12px;cursor:pointer}

/* 时间轴 */
.tl-wrap{margin-top:14px;position:relative}
.tl-scroll{overflow-x:auto}
.tl{min-width:880px;position:relative;--labelw:200px}
.tl-obsrow{position:relative;height:38px;margin-left:var(--labelw)}
.obs-pill{position:absolute;top:0;background:var(--accent);color:var(--onaccent);font-size:11px;line-height:1.25;padding:5px 9px;border-radius:4px;text-align:center;white-space:nowrap;z-index:4}
.obsline{position:absolute;top:38px;bottom:0;left:calc(var(--labelw) + (100% - var(--labelw)) * var(--obsx, 0));width:0;border-left:2px dashed var(--accent);pointer-events:none;z-index:0}
.tl-axis{position:relative;height:34px;margin-left:var(--labelw);border-bottom:1px solid var(--line)}
.tl-axis .tick{position:absolute;top:0;transform:translateX(-50%);font-size:12px;color:var(--muted);padding-top:6px}
.tl-axis .tick::after{content:"";position:absolute;left:50%;top:26px;width:1px;height:6px;background:var(--tick)}
.tl-axis .tick.minor{color:var(--minor)}
.theme{border-bottom:1px solid var(--themelin);padding-bottom:10px;--lane-bg:var(--surface)}
.theme.alt{background:var(--surface);--lane-bg:var(--surface)}
.theme-row{display:grid;grid-template-columns:var(--labelw) 1fr;align-items:center}
.theme-label{padding:10px 16px 10px 0;color:var(--ink);display:flex;flex-direction:column;justify-content:center;background:var(--lane-bg)}
@media (max-width:768px){
  .theme-label{position:sticky;left:0;z-index:5;box-shadow:8px 0 8px -8px rgba(15,40,65,.18)}
}
.theme-label .tname{font-size:16px;font-weight:700;line-height:1.3}
.theme-label .tsub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.theme-label .tsub .rule{color:var(--accent-text)}
.theme-label .subname{font-size:12px;color:var(--muted);line-height:1.4;padding:2px 0}
.theme-label .subname.on{color:var(--ink);font-weight:600}
.expand-btn{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink);cursor:pointer}
.expand-btn:hover{border-color:var(--accent)}
.expand-btn .plus{display:inline-block;width:16px;height:16px;border:1px solid currentColor;border-radius:50%;line-height:14px;text-align:center;font-size:12px}
.track{position:relative}
.band{position:relative;border-top:1px solid var(--bandline);display:flex;align-items:center}
.band:first-child{border-top:0}
.band .noterow,.band .emptyrow{flex:1}
.node{position:absolute;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;background:none;border:0;padding:0;cursor:pointer;z-index:2}
.node .dot{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.node.cond .dot{width:11px;height:11px;background:var(--surface);border:2px solid var(--amber);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.node.plan .dot{width:11px;height:11px;background:var(--surface);border:2px solid var(--muted);border-radius:50%}
.node:hover .dot,.node:focus-visible .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.node .nlabel{position:absolute;left:32px;top:50%;transform:translateY(-50%);text-align:left;white-space:nowrap;background:var(--surface);padding:2px 6px;border-radius:3px}
.node:hover .nlabel,.node:focus-visible .nlabel{background:var(--active)}
.node .nlabel .d{font-size:11px;color:var(--muted);line-height:1.3}
.node .nlabel .t{font-size:13px;color:var(--ink);line-height:1.35;font-weight:600}
.node .nlabel .pre{display:block;font-size:11px;line-height:1.35;color:var(--accent-text);font-weight:500;margin-top:1px}
.node .nlabel .t .badge{font-size:10px;font-weight:400;color:var(--warm-text);background:var(--warm-bg);border-radius:3px;padding:1px 4px;margin-left:4px;white-space:nowrap}
.node .nlabel .go,.rangebar .rlabel .go{color:var(--accent-text);font-weight:700}
.node .nlabel.flip{left:auto;right:32px;text-align:right}
.rangebar{position:absolute;top:50%;transform:translateY(-50%);height:8px;border-radius:4px;z-index:1;cursor:pointer}
.rangebar.firm{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.rangebar.plan{background:repeating-linear-gradient(90deg,var(--surface) 0 6px,var(--accent) 6px 12px);border:1px dashed var(--accent);height:10px}
.rangebar.period{background:color-mix(in srgb,var(--ink) 18%,transparent);border:1px dashed var(--dash)}
.rangebar .rlabel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;background:var(--surface);padding:2px 6px;border-radius:3px}
.rangebar:hover .rlabel,.rangebar:focus-visible .rlabel{background:var(--active)}
.rangebar .rlabel .d{font-size:11px;color:var(--muted)}
.rangebar .rlabel .t{font-size:13px;color:var(--ink);font-weight:600}
.rangebar .rlabel .t .badge{font-size:10px;font-weight:400;color:var(--warm-text);background:var(--warm-bg);border-radius:3px;padding:1px 4px;margin-left:4px}
/* 沿革与依据：竖排列表（最早在上）。节点标识按日期落在主时间轴同一刻度（--mx，与主泳道共用 frac），
   标签贴在标识旁、按剩余空间自动换边（.r 在右、.l 在左）；无日期行与窄屏（≤768px）回落为对齐列表。 */
.theme-row.exp-row{align-items:start;position:relative;z-index:1;background:var(--lane-bg)}
.theme-row.exp-row .theme-label{justify-content:flex-start;padding-top:14px}
.exp-list{display:flex;flex-direction:column;padding:4px 0}
.exp-item{position:relative;display:block;width:100%;height:36px;text-align:left;background:none;border:0;padding:0;cursor:pointer;border-radius:4px}
.exp-item:hover,.exp-item:focus-visible{background:var(--active)}
.exp-mark{position:absolute;left:var(--mx);top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.exp-mark.cond{width:11px;height:11px;background:var(--surface);border:2px solid var(--amber);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.exp-mark.plan{width:11px;height:11px;background:var(--surface);border:2px solid var(--muted)}
.exp-mark.period{width:11px;height:11px;background:var(--surface);border:1px dashed var(--dash)}
.exp-range{position:absolute;left:var(--mx1);width:calc(var(--mx2) - var(--mx1));top:50%;transform:translateY(-50%);height:8px;border-radius:4px}
.exp-range.firm{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.exp-range.plan{background:repeating-linear-gradient(90deg,var(--surface) 0 6px,var(--accent) 6px 12px);border:1px dashed var(--accent);height:10px}
.exp-range.period{background:color-mix(in srgb,var(--ink) 18%,transparent);border:1px dashed var(--dash)}
.exp-label{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;max-width:380px;overflow:hidden;white-space:nowrap;background:var(--surface);padding:2px 6px;border-radius:3px}
.exp-label.r{left:calc(var(--mx) + 14px);text-align:left}
.exp-label.l{right:calc(100% - var(--mx) + 14px);text-align:right}
.exp-label .exp-date{flex:0 0 auto;font-size:11px;color:var(--muted);line-height:1.3}
.exp-label .exp-title{font-size:13px;color:var(--ink);line-height:1.35;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.exp-label .exp-title .badge{font-size:10px;font-weight:400;color:var(--warm-text);background:var(--warm-bg);border-radius:3px;padding:1px 4px;margin-left:4px;white-space:nowrap}
.exp-label .exp-go{flex:0 0 auto;color:var(--accent-text);font-weight:700}
/* 无日期事件：固定对齐行 */
.exp-item.static{display:flex;align-items:center;gap:10px;padding:7px 8px;height:auto}
.exp-item.static .exp-mark{position:static;transform:none;flex:0 0 auto}
.exp-item.static .exp-label{position:static;transform:none;max-width:none;flex:1}
@media (max-width:768px){
  /* 窄屏轨道太窄，节点不按日期横向定位，回落为对齐列表 */
  .exp-list .exp-item{display:flex;align-items:center;gap:10px;padding:7px 8px;height:auto}
  .exp-list .exp-item .exp-mark,.exp-list .exp-item .exp-range{position:static;transform:none;flex:0 0 auto;left:auto;width:12px}
  .exp-list .exp-item .exp-range{width:22px}
  .exp-list .exp-item .exp-label{position:static;transform:none;max-width:none;flex:1}
}
.noterow{display:flex;align-items:center;gap:10px;min-height:76px}
.noterow .notetext{font-size:13px;color:var(--ink)}
.noterow .notetext button{appearance:none;background:none;border:0;padding:0;color:var(--accent-text);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.emptyrow{display:flex;align-items:center;min-height:76px;color:var(--muted);font-size:13px}
.nodate-row{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 0 10px;font-size:12px;color:var(--muted)}
.nodate-item .nodate-mark{color:var(--muted)}
.nodate-item button{appearance:none;background:none;border:0;padding:0;color:var(--accent-text);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* 图例与页脚 */
.legend{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--muted)}
.legend .li{display:inline-flex;align-items:center;gap:7px}
.legend .sw-dot{width:11px;height:11px;border-radius:50%;background:var(--ink);display:inline-block}
.legend .sw-dia{width:10px;height:10px;background:var(--surface);border:2px solid var(--amber);border-radius:2px;transform:rotate(45deg);display:inline-block}
.legend .sw-pln{width:10px;height:10px;background:var(--surface);border:2px solid var(--muted);border-radius:50%;display:inline-block}
.legend .sw-rng{width:26px;height:0;border-top:2px dashed var(--accent);display:inline-block}
.legend .sep{color:var(--edge)}
.legend .right{margin-left:auto;text-align:right}

/* 行内详情面板：展开在所属主题下方，手机端为底部浮层 */
.detail-panel{position:relative;z-index:1;margin:0;border-top:1px solid var(--line);background:var(--panelbg);border-left:3px solid var(--accent);padding:16px 20px 20px;font-size:14px}
.detail-panel .dp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-panel .kicker{font-size:12px;color:var(--accent-text)}
.detail-panel h2{margin:4px 0 0;font-size:19px;line-height:1.35;color:var(--ink)}
.detail-panel .dp-close{appearance:none;background:var(--surface);border:1px solid var(--edge);border-radius:50%;width:32px;height:32px;font-size:16px;line-height:1;color:var(--body);cursor:pointer;flex:none}
.detail-panel .dp-head-right{display:flex;align-items:center;gap:10px;flex:none}
.status-tag{font-size:12px;font-weight:700;line-height:1;padding:7px 11px;border-radius:999px;white-space:nowrap}
.status-tag.st-done{background:var(--accent);color:var(--onaccent)}
.status-tag.st-pending{background:var(--subtle);color:var(--muted)}
.status-tag.st-draft{background:var(--warm-bg);color:var(--warm-text)}
.status-tag.st-cond{background:transparent;color:var(--accent-text);border:1px solid var(--accent)}
.detail-panel .dp-body{max-width:860px}
.detail-panel .kv{display:grid;grid-template-columns:86px 1fr;gap:4px 12px;margin:14px 0}
.detail-panel .kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.detail-panel .kv dd{margin:0;color:var(--ink)}
.detail-panel .kv dd .tag{display:inline-block;font-size:11px;border-radius:3px;padding:1px 6px;margin-left:6px;background:var(--subtle);color:var(--muted)}
.detail-panel .kv dd .tag.warn{background:var(--warm-bg);color:var(--warm-text)}
.detail-panel h3{font-size:13px;color:var(--ink);margin:18px 0 6px}
.detail-panel blockquote.quote{margin:6px 0 0;padding:12px 14px;background:var(--subtle);border-left:3px solid var(--accent);font-size:13px;line-height:1.65;color:var(--ink)}
.detail-panel blockquote.quote p{margin:0}
.detail-panel blockquote.quote cite{display:block;margin-top:8px;font-size:12px;color:var(--muted);font-style:normal}
.detail-panel .qnote{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.detail-panel .noquote{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
.detail-panel p{margin:0 0 10px}
.detail-panel .long{max-height:96px;overflow:hidden;position:relative}
.detail-panel .long.open{max-height:none}
.detail-panel .more{appearance:none;background:none;border:0;padding:0;color:var(--accent-text);font-size:13px;cursor:pointer}
.detail-panel ul.srcs{margin:6px 0 0;padding-left:18px}
.detail-panel ul.srcs li{margin-bottom:6px}
.detail-panel ul.srcs a{word-break:break-all}
.detail-panel .verify{margin-top:16px;padding:10px 12px;background:var(--subtle);border-radius:4px;font-size:12px;color:var(--muted)}
.detail-panel .verify b{color:var(--ink)}
.detail-panel .verify .warn{color:var(--warm-text)}

/* 手机 */
@media (max-width:768px){
  .page{padding:0 16px 40px}
  .lawtabs{gap:22px}
  .lawtab{font-size:15px;padding:12px 2px 10px}
  .lawhead{margin-top:20px}
  .lawhead h1{font-size:26px}
  .lawhead .meta{white-space:normal}
  .tl-scroll{margin:0 -16px;padding:0 16px}
  .tl{--labelw:150px}
  .theme-label{padding:8px 10px 8px 0}
  .theme-label .tname{font-size:15px}
  .detail-panel{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78vh;overflow-y:auto;background:var(--surface);box-shadow:0 -8px 24px rgba(15,40,65,.16);border-left:0;border-top:3px solid var(--accent)}
  .legend .right{margin-left:0;text-align:left}
}

/* ===== 深色主题（与主站同机制：手动深色 / 跟随系统且系统深色）=====
   时间轴变量在 :root 层重定义；顶栏变量在 .topbar 作用域内重定义。 */
html:has(.theme-switch input[value="dark"]:checked), html.force-dark{
  --ink:#edf1f6; --accent:#33d6d6; --accent-text:#33d6d6;
  --body:#a9b3c0; --muted:#8b96a5; --line:#233142; --subtle:#16202e;
  --active:#1b3a5c; --warm-bg:#17222f; --warm-text:#e0a866;
  --amber:#e8a13c; --danger:#e07878;
  --surface:#0d141f; --panelbg:#141e2c; --edge:#2b3c55; --bandline:#233142;
  --themelin:#233142; --tick:#5d6a7d; --dash:#5d6a7d; --minor:#5d6a7d; --onaccent:#0d141f;
  color-scheme:dark;
}
html:has(.theme-switch input[value="dark"]:checked) .topbar, html.force-dark .topbar{
  --primary:#dce8f7; --seg-bg:#1a2434; --seg-on:#2b3c55; --card:#141e2c; --gray:#8b96a5;
}
html:has(.theme-switch input[value="dark"]:checked) .pillselect, html.force-dark .pillselect{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23a9b3c0' fill='none' stroke-width='1.4'/></svg>");
}
@media (prefers-color-scheme:dark){
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked){
    --ink:#edf1f6; --accent:#33d6d6; --accent-text:#33d6d6;
    --body:#a9b3c0; --muted:#8b96a5; --line:#233142; --subtle:#16202e;
    --active:#1b3a5c; --warm-bg:#17222f; --warm-text:#e0a866;
    --amber:#e8a13c; --danger:#e07878;
    --surface:#0d141f; --panelbg:#141e2c; --edge:#2b3c55; --bandline:#233142;
    --themelin:#233142; --tick:#5d6a7d; --dash:#5d6a7d; --minor:#5d6a7d; --onaccent:#0d141f;
    color-scheme:dark;
  }
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .topbar{
    --primary:#dce8f7; --seg-bg:#1a2434; --seg-on:#2b3c55; --card:#141e2c; --gray:#8b96a5;
  }
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .pillselect{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23a9b3c0' fill='none' stroke-width='1.4'/></svg>");
  }
}

": "等级委托法案", "offset": 18}, {"act": "标签实施法案", "offset": 18}]}, "ind": {"base": "2027-08-18", "deps": [{"act": "等级委托法案", "offset": 18}, {"act": "标签实施法案", "offset": 18}]}, "lmt": {"base": "2030-02-18", "deps": [{"act": "等级委托法案", "offset": 18}, {"act": "标签实施法案", "offset": 18}]}, "ind-ext": {"base": "2032-02-18", "deps": [{"act": "等级委托法案", "offset": 18}, {"act": "标签实施法案", "offset": 18}]}}, "rule": "法定基准日、等级委托法案与标签实施法案两者较晚生效后 18 个月，取最晚。", "status": "规则已核验；配套法案实时状态待核验", "verifyNote": "2026-11-17 一手核验：Art 7(2) 等级委托法案仍为草案，未通过；实际适用日待配套法案生效后确定。", "detail": "等级划分依赖 Art 7(1) 方法学先行，是碳足迹三步中的第二步。待等级法案出台后，按等级阈值准备产品碳足迹分级数据与标签信息。", "sources": ["S01"], "quote": {"ref": "Art 7(2), Regulation (EU) 2023/1542", "text": "Electric vehicle batteries, rechargeable industrial batteries with a capacity greater than 2 kWh and LMT batteries shall bear a conspicuous, clearly legible and indelible label indicating the carbon footprint of the battery [...] and declaring the carbon footprint performance class to which the relevant battery model per manufacturing plant corresponds. [...] The carbon footprint performance class requirements in the first subparagraph shall apply from: (a) 18 August 2026 or 18 months after the date of entry into force either of the delegated act or of the implementing act [...] whichever is the latest, for electric vehicle batteries [...].", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}, {"key": "cf3", "label": "最高阈值", "article": "Art 7(3)", "roles": "投放欧盟市场的经济运营者", "byCategory": {"ev": {"base": "2028-02-18", "deps": [{"act": "阈值委托法案", "offset": 18}]}, "ind": {"base": "2029-02-18", "deps": [{"act": "阈值委托法案", "offset": 18}]}, "lmt": {"base": "2031-08-18", "deps": [{"act": "阈值委托法案", "offset": 18}]}, "ind-ext": {"base": "2033-08-18", "deps": [{"act": "阈值委托法案", "offset": 18}]}}, "rule": "法定基准日与阈值委托法案生效后 18 个月取最晚；仅委托法案，无实施法案分支。", "status": "规则已核验；配套法案实时状态待核验", "verifyNote": "2026-11-17 一手核验：Art 7(3) 阈值委托法案仍为草案，未通过；实际适用日待配套法案生效后确定。", "detail": "超过阈值不得投放市场。阈值增加的是量化上限要求；申报、标签等其他要求的合规效力依各自法条与适用条件分别判断。", "sources": ["S01"], "quote": {"ref": "Art 7(3), Regulation (EU) 2023/1542", "text": "For electric vehicle batteries, rechargeable industrial batteries with a capacity greater than 2 kWh and LMT batteries, the technical documentation [...] shall demonstrate that the declared life cycle carbon footprint value for the relevant battery model per manufacturing plant, is below the maximum threshold established in the delegated act adopted pursuant to the third subparagraph. The requirement for a maximum life cycle carbon footprint threshold [...] shall apply as of: (a) 18 February 2028 or 18 months after the date of entry into force of the delegated act referred to in the third subparagraph, whichever is the latest, for electric vehicle batteries [...].", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}], "expand": {"label": "沿革与依据", "groups": [{"label": "方法学草案与咨询", "events": [{"id": "cf-jrc-ev", "itemId": "cf1", "kind": "firm", "prec": "month", "date": "2023-06-01", "from": null, "to": null, "label": "JRC 方法草案", "title": "JRC 碳足迹方法草案（EV 电池）2023 年 6 月", "status": null, "article": "JRC CFB-EV", "scope": null, "conditions": null, "detail": "JRC《电动汽车电池碳足迹计算规则》（CFB-EV）最终草案，2023 年 6 月；2021 年第四季度至 2023 年第二季度利益相关方工作成果，是 Art 7 EV 方法学的依据。标题页标注 Final draft 2023，月份取自文件记录。", "badge": null, "verified": "2026-11-17", "verifyNote": "JRC 报告 PDF 已读；月份精度，不写具体日", "sources": ["X01"], "cats": ["ev"], "quote": {"ref": "Abstract, JRC CFB-EV, Final draft, June 2023", "text": "This report provides the methodological guidelines for calculating the Carbon Footprint of batteries (CFB). It is based on the Environmental Footprint (EF) method developed by the European Commission (as in EC Recommendations 2279/2021) and Product Environmental Footprint Categories Rules for Batteries (PEFCR), and it provides detailed guidelines on methodological choices, modelling approaches, and documentation and verification requirements for the CFB. This work is supposed to provide the basis for the enforcement of requirements as in Article 7 of the Battery Regulation Proposal, supplementing the Regulation by establishing the methodology for calculation and verification of the carbon footprint of batteries.", "url": "https://eplca.jrc.ec.europa.eu/permalink/battery/GRB-CBF_CarbonFootprintRules-EV_June_2023.pdf", "verified": "2026-11-17", "note": "JRC technical report, not a legal article."}}, {"id": "cf-da-consult", "itemId": "cf1", "kind": "period", "prec": "day", "date": null, "from": "2024-04-30", "to": "2024-05-28", "label": "方法学草案咨询", "title": "Art 7 方法学委托法案草案公开咨询（2024-04-30–2024-05-28）", "status": null, "article": "Ares(2024)3131389", "scope": null, "conditions": null, "detail": "Art 7(1) 方法学委托法案草案公开咨询，倡议 13877；草案至今未通过、无 OJ 编号。", "badge": null, "verified": "2026-11-17", "verifyNote": "EUR-Lex 草案页与咨询期已核验", "sources": ["X03"], "cats": ["ev"], "quote": {"ref": "Annex, s.2 (Calculation rules), Draft delegated regulation, Ares(2024)3131389", "text": "The carbon footprint of electric vehicle batteries shall be calculated as the amount of CO2-equivalent emitted during the life cycle stages of the battery that are within the system boundary, expressed in kilogram (‘kg’) CO2-equivalent, divided by the total amount of energy provided by the battery over the battery’s service life determined in accordance with section 2.1. It shall be reported in kg CO2-equivalent/kilowatt-hour (‘kWh’) with a resolution of 0,001 kg CO2-equivalent/kWh.", "url": "https://www.qualenergia.it/wp-content/uploads/2024/05/allegato-1.pdf", "verified": "2026-11-17", "note": "Draft delegated act, not adopted. Art 1 itself is only 21 words ('The methodology for the calculation and verification of the carbon footprint of electric vehicle batteries is laid down in the Annex.'), so the operative calculation rule from Annex s.2 is quoted instead. Text obtained via a mirror copy of Ares(2024)3131389; the EUR-Lex PIN page showed only the initiative summary.", "showNote": true}}, {"id": "cf-jrc-ind-draft", "itemId": "cf1", "kind": "firm", "prec": "month", "date": "2024-06-01", "from": null, "to": null, "label": "JRC 工业电池方法草案", "title": "JRC 工业电池碳足迹方法草案 2024 年 6 月", "status": null, "article": "JRC CFB-IND", "scope": null, "conditions": null, "detail": "JRC 工业电池碳足迹方法草案 2024 年 6 月传阅，作为第二次利益相关方咨询的依据；见 CFB-IND 正式报告内文。", "badge": null, "verified": "2026-11-17", "verifyNote": "CFB-IND 报告内文载明；月份精度，不写具体日", "sources": ["X02"], "cats": ["ind", "ind-ext"], "quote": {"ref": "Abstract, JRC141282, Calculating the carbon footprint of industrial batteries (final report, 2025-04-11)", "text": "This report provides the methodological guidelines for calculating the carbon footprint of industrial batteries (CFB-IND), providing the basis for the enforcement of requirements as in Article 7 of Regulation (EU) 2023/1542 (Batteries Regulation), establishing the methodology for calculation and verification of the carbon footprint of batteries. The present report is targeting industrial batteries with exclusively internal storage and with an energy storage capacity >2 kWh.", "url": "https://publications.jrc.ec.europa.eu/repository/handle/JRC141282", "verified": "2026-11-17", "note": "JRC technical report, not a legal article. The June 2024 draft itself was not opened separately; the final report states it 'is based on the previous JRC draft report that was distributed in June 2024 as a basis for a second stakeholder consultation', so the final report's aim/scope sentence is given for both keys."}}, {"id": "cf-jrc-ind", "itemId": "cf1", "kind": "firm", "prec": "day", "date": "2025-04-11", "from": null, "to": null, "label": "JRC 工业电池方法报告", "title": "JRC 工业电池碳足迹方法报告（JRC141282）", "status": null, "article": "JRC CFB-IND", "scope": null, "conditions": null, "detail": "JRC《工业电池碳足迹计算：方法学支持》（JRC141282，EUR 40286），针对可充电工业电池（>2kWh，内部储能）；报告日期 2025-04-11，2025-05-28 公开发布。", "badge": null, "verified": "2026-11-17", "verifyNote": "Publications Office 记录与 JRC 新闻核验", "sources": ["X02"], "cats": ["ind", "ind-ext"], "quote": {"ref": "Abstract, JRC141282, Calculating the carbon footprint of industrial batteries (final report, 2025-04-11)", "text": "This report provides the methodological guidelines for calculating the carbon footprint of industrial batteries (CFB-IND), providing the basis for the enforcement of requirements as in Article 7 of Regulation (EU) 2023/1542 (Batteries Regulation), establishing the methodology for calculation and verification of the carbon footprint of batteries. The present report is targeting industrial batteries with exclusively internal storage and with an energy storage capacity >2 kWh.", "url": "https://publications.jrc.ec.europa.eu/repository/handle/JRC141282", "verified": "2026-11-17", "note": "JRC technical report, not a legal article."}}]}]}}, {"key": "recycled", "label": "再生材料", "sub": "申报看生效触发，最低值看固定日", "events": [{"id": "rc-decl", "itemId": "rc", "kind": "cond", "prec": "day", "date": "2028-08-18", "from": null, "to": null, "label": "申报基准", "title": "申报基准", "status": "Art 8 规则已核验：申报为生效触发、最低值为固定日；方法学委托法案草案 Ares(2026)7823470 仍未通过，法定通过日 2026-08-18 已逾期", "article": "Art 8(1)", "scope": "工业电池 >2kWh（排除仅外部储能）、EV 电池、SLI 电池", "conditions": "法定基准日 2028-08-18 或方法学委托法案生效后 24 个月，取较晚者；方法学委托法案须 2026-08-18 前通过（已逾期，草案仍未通过）", "detail": "钴／锂／镍按活性物质中回收份额，铅按电池中回收份额；文件按每个电池型号、每年、每个制造工厂提供。2026-11-17 一手核验：Art 8 方法学委托法案草案 Ares(2026)7823470 仍为草案，未通过。实际申报起始日因“取较晚者”机制必然晚于 2028-08-18。", "badge": null, "verified": "2026-10-24", "verifyNote": "2026-11-17 一手核验：Art 8 方法学委托法案草案仍为草案，未通过", "roles": "投放欧盟市场的经济运营者", "sources": ["S01"], "pre": "前置：方法学 DA +24月", "cats": ["ev", "ind"], "quote": {"ref": "Art 8(1), Regulation (EU) 2023/1542", "text": "From 18 August 2028 or 24 months after the date of entry into force of the delegated act referred to in the third subparagraph, whichever is the latest, [...] electric vehicle batteries [...] that contain cobalt, lead, lithium or nickel in active materials, shall be accompanied by documentation containing information about the percentage share of cobalt, lithium or nickel [...] that has been recovered from battery manufacturing waste or post-consumer waste, and the percentage share of lead [...] that has been recovered from waste, for each battery model per year and per manufacturing plant. [...] The first subparagraph shall apply from 18 August 2033 to LMT batteries that contain cobalt, lead, lithium or nickel in active materials.", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}, {"id": "rc-min31", "itemId": "rc", "kind": "firm", "prec": "day", "date": "2031-08-18", "from": null, "to": null, "label": "最低含量", "title": "最低含量", "status": "Art 8 规则已核验：申报为生效触发、最低值为固定日；方法学委托法案草案 Ares(2026)7823470 仍未通过，法定通过日 2026-08-18 已逾期", "article": "Art 8(2)", "scope": "工业、EV、SLI 电池（LMT 除外）", "conditions": null, "detail": "2031-08-18 起适用最低再生含量。", "badge": null, "verified": "2026-10-24", "verifyNote": "规则已核验；方法学委托法案实时状态待复核", "roles": "投放欧盟市场的经济运营者", "sources": ["S01"], "cats": ["ev", "ind"], "quote": {"ref": "Art 8(2), Regulation (EU) 2023/1542", "text": "From 18 August 2031, for industrial batteries with a capacity greater than 2 kWh, except those with exclusively external storage, electric vehicle batteries and SLI batteries that contain cobalt, lead, lithium or nickel in active materials, the technical documentation [...] shall demonstrate that those batteries contain, in active materials, the following minimum percentage share of, respectively, cobalt, lithium or nickel that has been recovered from battery manufacturing waste or post-consumer waste, and the minimum percentage share of lead that is present in the battery and that has been recovered from waste, for each battery model per year and per manufacturing plant: (a) 16 % cobalt; (b) 85 % lead; (c) 6 % lithium; (d) 6 % nickel.", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}, {"id": EU) 2023/1542", "text": "From 18 August 2036, for industrial batteries with a capacity greater than 2 kWh, except those with exclusively external storage, electric vehicle batteries, LMT batteries and SLI batteries that contain cobalt, lead, lithium or nickel in active materials, the technical documentation [...] shall demonstrate that those batteries contain, in the active materials, the following minimum percentage share of, respectively, cobalt, lithium or nickel that has been recovered from battery manufacturing waste or post-consumer waste, and the minimum percentage share of lead that is present in the battery and that has been recovered from waste, for each battery model per year and per manufacturing plant: (a) 26 % cobalt; (b) 85 % lead; (c) 12 % lithium; (d) 15 % nickel.", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}], "expand": {"label": "沿革与依据", "groups": [{"label": "方法学草案与咨询", "events": [{"id": "rc-da-draft", "itemId": "rc", "kind": "firm", "prec": "day", "date": "2026-08-12", "from": null, "to": null, "label": "方法学草案", "title": "Art 8 方法学委托法案草案（Ares(2026)7823470）", "status": null, "article": "Ares(2026)7823470", "scope": null, "conditions": null, "detail": "Art 8 方法学委托法案草案：钴／镍／锂／铅再生含量的计算与核验方法及文件格式，适用工业（>2kWh）、EV、SLI 与 LMT 电池；草案日期 2026-08-12，至今未通过。方法学委托法案法定须于 2026-08-18 前通过（已逾期）。WTO 通报 G/TBT/N/EU/1233（2026-08-14），意见截止 2026-10-13，拟 2026 年 10 月通过（仅为计划，未实现）。", "badge": null, "verified": "2026-11-17", "verifyNote": "HYS 倡议页与 WTO 通报核验", "sources": ["X04"]}, {"id": "rc-da-consult", "itemId": "rc", "kind": "period", "prec": "day", "date": null, "from": "2026-08-12", "to": "2026-09-09", "label": "方法学草案咨询", "title": "Art 8 方法学委托法案草案公开咨询（2026-08-12–2026-09-09）", "status": null, "article": "Ares(2026)7823470", "scope": null, "conditions": null, "detail": "Art 8 方法学委托法案草案公开咨询，倡议 14858；咨询期 2026-08-12 至 2026-09-09。", "badge": null, "verified": "2026-11-17", "verifyNote": "HYS 倡议页与 WTO 通报核验", "sources": ["X04"], "quote": {"ref": "Art 1, Draft delegated regulation, Ares(2026)7823470", "text": "The methodology for the calculation and verification of the recycled content of nickel, cobalt, lithium and lead in industrial batteries with a capacity greater than 2 kWh, except those with exclusively external storage, electric vehicle batteries, SLI batteries and LMT batteries shall be as set out in sections 1, 2 and 3 of the Annex. The format for the documentation demonstrating the share of recycled content of nickel, cobalt, lithium and lead in the batteries referred to in the first paragraph shall be as set out in section 4 of the Annex.", "url": "https://karabuktso.org.tr//storage/upload/documents/2026/08/announcements/ab-batarya-tuzugu-danisma-sureci_8936_rmINZkqhgf.pdf", "verified": "2026-11-17", "note": "Draft delegated act, not adopted. Text obtained via a TOBB-hosted copy of Ares(2026)7823470; the EUR-Lex PIN fetch failed (empty response, http 202) and the Have Your Say 14858 page returned only a subscription box in text fetch.", "showNote": true}}]}]}}, {"key": "passport", "label": "电池护照", "sub": "主线只显示强制适用节点", "events": [{"id": "pp-app", "itemId": "passport", "kind": "firm", "prec": "day", "date": "2027-02-18", "from": null, "to": null, "label": "强制适用", "title": "强制适用", "status": "母法已生效；配套文件见关联配套文件", "article": "Art 77", "scope": "所有须附护照的电池", "conditions": null, "detail": "Annex XIII 数据；经 ESPR 中央注册库登记。护照中的碳足迹项在上线时不填。", "badge": null, "verified": "2026-10-24", "verifyNote": "适用日已核验；配套文件状态见各事项", "roles": "投放欧盟市场的经济运营者", "sources": ["S01", "S10"], "quote": {"ref": "Art 77(1)-(3), Regulation (EU) 2023/1542", "text": "From 18 February 2027 each LMT battery, each industrial battery with a capacity greater than 2 kWh and each electric vehicle battery placed on the market or put into service shall have an electronic record ('battery passport'). The battery passport shall contain information relating to the battery model and information specific to the individual battery, including resulting from the use of that battery, as set out in Annex XIII. [...] The battery passport shall be accessible through the QR code referred to in Article 13(6) which links to a unique identifier that the economic operator placing the battery on the market shall attribute to it.", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}], "expand": {"label": "沿革与依据", "groups": [{"label": "注册库与访问权限", "events": [{"id": "reg-live", "itemId": "registry", "kind": "firm", "prec": "day", "date": "2026-07-20", "from": null, "to": null, "label": "上线", "title": "上线", "status": "已上线（2026-07-20，含测试环境）", "article": "ESPR Art 13", "scope": "数字产品护照中央注册库", "conditions": null, "detail": "2026-07-20 上线，含测试环境。上线 ≠ 可注册：指南原文确认电池 DPP 成功注册目前不可用（语义目录尚未定义，2026-11-18 核验）。电池护照唯一标识须在此登记（1542 Art 77(10)，ESPR Art 78 增加）。注册库主要记录注册与元数据，不等于护照全文访问。注册库运行规则见实施条例 (EU) 2026/1778（2026-07-16 通过、2026-08-06 生效）。", "badge": null, "verified": "2026-11-18", "verifyNote": "指南原文核验（2026-11-18）：电池 DPP 成功注册目前不可用", "roles": "投放欧盟市场的经济运营者（注册义务方）", "sources": ["S10", "S16", "S25", "S34"], "quote": {"ref": "Art 13(1), Regulation (EU) 2024/1781", "text": "By 19 July 2026, the Commission shall set up a digital registry (the ‘registry’) which stores in a secure manner at least the unique identifiers. In the case of products intended to be placed under the customs procedure ‘release for free circulation’, the registry shall store the commodity code. The registry shall store the unique identifiers for batteries as referred to in Article 77(3) of Regulation (EU) 2023/1542 [...]. The Commission shall manage the registry and shall ensure that the data stored in the registry are processed securely and in compliance with Union law, including applicable rules on the protection of personal data.", "url": "https://eur-lex.europa.eu/eli/reg/2024/1781/oj/eng", "verified": "2026-11-17", "note": "The registry is Art 13, not Art 12 (Art 12 is 'Unique identifiers'). The [...] omits the footnote reference '(61)' after  page returned only a subscription box in text fetch. All three ia779 keys concern this same draft."}}, {"id": "ia779-ce", "itemId": "ia779", "kind": "firm", "prec": "day", "date": "2026-11-16", "from": null, "to": null, "label": "咨询截止", "title": "咨询截止", "status": "咨询已截止（2026-11-16）；草案未通过", "article": "实施条例草案", "scope": null, "conditions": null, "detail": "咨询已于 2026-11-16 截止，共收到 98 条反馈（HYS 页 2026-11-18 核验）。草案本身未获通过；欧委会登记称计划 2026 年 Q4 通过（指示性），WTO 通报 G/TBT/N/EU/1248 称拟 2027 年 1 月通过、意见截止 2026-12-25。另：电池法 Art 77(9) 要求该实施法案的法定截止日为 2026-08-18，草案迟到 62 天。", "badge": null, "verified": "2026-11-18", "verifyNote": "咨询起止与反馈数量已核验（HYS 页 2026-11-18）", "roles": "护照数据访问方（按合法利益分层）", "sources": ["S01", "S10", "S11"], "quote": {"ref": "Art 2(1), Draft implementing regulation, Ares(2026)9814179", "text": "1. The persons referred to in Article 1(1), (2) and (4), shall have access to the information referred to in point 2(a) to (c) and point 4 of Annex XIII to Regulation (EU) 2023/1542 only for the purposes of the following activities: (a) evaluating the status and residual value of the battery and its capability for further use; and (b) repair, preparation for re-use, preparation for repurposing, repurposing, remanufacturing or recycling of the battery, or choosing between those operations.", "url": "https://members.wto.org/crnattachments/2026/TBT/EEC/26_05561_00_e.pdf", "verified": "2026-11-17", "note": "Draft implementing regulation, not adopted; same draft as ia779-cs, via WTO TBT notification G/TBT/N/EU/1248 attachment."}}, {"id": "ia779-vote", "itemId": "ia779", "kind": "plan", "prec": "month", "date": null, "from": "2026-12-01", "to": "2027-01-31", "label": "委员会投票目标·拟", "title": "委员会投票目标·拟", "status": "咨询已截止；草案未通过，待委员会程序（无已定投票日）", "article": "实施条例草案", "scope": null, "conditions": null, "detail": "委员会投票目标 2026 年 12 月至 2027 年 1 月（InfoDPP 研讨会口径）；欧委会登记称计划 2026 年 Q4 通过，WTO 通报 G/TBT/N/EU/1248 称拟 2027 年 1 月通过；投票日未定，计划不等于已通过。", "badge": null, "verified": "2026-10-24", "verifyNote": "咨询期与草案       detail: row.detail, verified: null, pre: pre, quote: row.quote || null,

  function catLabel(row) {

  function themeHtml(th, range, idx) {
    // 每行 = 左侧标签格 + 右侧一条 band；子行各占一行，标签与 band 纵向对齐。
    var lines = [];
    var head = '<div class="tname">' + esc(themeLabel(th)) + '</div>' +
      (th.sub ? '<div class="tsub">' + esc(themeSub(th)) + '</div>' : '');

        esc(row0.byCategory[state.category].base.replace(/-/g, '.')) + (LANG === 'en' ? ' onward, ' : ' 起，') +
        esc(depsText(row0.byCategory[state.category].deps)) + (LANG === 'en' ? ', latest applies' : ' 取最晚') + '</div>';
    }

    if (th.expand) {

      expandBtn = '<button type="button" class="expand-btn" data-expand="' + esc(th.key) + '" aria-expanded="' + open + '">' +
        '<span class="plus">' + (open ? '−' : '+') + '</span> ' + esc(t('expandLabel')) + '</button>';
    }
    function bandFor(events) {
      var dated = events.filter(function (ev) { return ev.date || ev.from || ev.to; })
        .map(function (ev) { return clipEvent(ev, range); })
        .filter(function (ev) { return ev; });
      var undated = events.filter(function (ev) { return !ev.date && !ev.from && !ev.to; });
      var inner = '';
      dated.forEach(function (ev) { inner += isRange(ev) ? rangeBarHtml(ev, range) : eventNodeHtml(ev, range); });
      var html = '<div class="band">' + inner + '</div>';
      if (undated.length) {
        html += '<div class="nodate-row">' + undated.map(function (ev) {
          return '<span class="nodate-item"><span class="nodate-mark">○</span> ' + esc(evLabel(ev)) + ' — ' +
            esc(ev.status || t('nodate')) +
            ' <button type="button" data-evid="' + ev.id + '">' + t('viewDetail') + '</button></span>';
        }).join('') + '</div>';
      }
      return html;
    }
    function listFor(events) {
      // 沿革与依据按时间顺序竖排（最早在上）；节点标识按日期落在主时间轴同一刻度上
      // （与主泳道共用 frac/当前窗口，同一日期在展开列表与主带里横向对齐），
      // 标签贴在标识旁、按剩余空间自动换边（≤0.65 放右、>0.65 放左）；窗口外事件夹取到边缘。
      // 窄屏（≤768px）轨道太窄，CSS 回落为对齐列表，定位失效但不溢出。
      var clamp = function (x) { return Math.max(0.015, Math.min(0.985, x)); };
      var dated = events.filter(function (ev) { return ev.date || ev.from || ev.to; });
      var undated = events.filter(function (ev) { return !ev.date && !ev.from && !ev.to; });
      dated.sort(function (a, b) {
        var da = a.date || a.from, db = b.date || b.from;
        return da < db ? -1 : (da > db ? 1 : 0);
      });
      var html = '<div class="exp-list">';
      dated.forEach(function (ev) {
        var labelInner = '<span class="exp-date">' + esc(dateText(ev)) + '</span>' +
          '<span class="exp-title">' + esc(evLabel(ev)) + badgeHtml(ev) + '</span>' +
          '<span class="exp-go" aria-hidden="true">›</span>';
        if (isRange(ev)) {
          var fx1 = clamp(frac(ev.from, range)), fx2 = clamp(frac(ev.to, range));
          var cx = (fx1 + fx2) / 2;
          var side = cx <= 0.65 ? 'r' : 'l';
          var anchor = side === 'r' ? fx2 : fx1;
          html += '<button type="button" class="exp-item" data-evid="' + ev.id + '" aria-label="' + esc(ev.title) + ' ' + esc(dateText(ev)) + '">' +
            '<span class="exp-range ' + rangeClass(ev) + '" style="--mx1:' + (fx1 * 100).toFixed(2) + '%;--mx2:' + (fx2 * 100).toFixed(2) + '%" aria-hidden="true"></span>' +
            '<span class="exp-label ' + side + '" style="--mx:' + (anchor * 100).toFixed(2) + '%">' + labelInner + '</span></button>';
        } else {
          var fx = clamp(frac(ev.date, range));
          var side2 = fx <= 0.65 ? 'r' : 'l';

          html += '<button type="button" class="exp-item" data-evid="' + ev.id + '" aria-label="' + esc(ev.title) + ' ' + esc(dateText(ev)) + '">' +
            '<span class="exp-mark ' + mark + '" style="--mx:' + (fx * 100).toFixed(2) + '%" aria-hidden="true"></span>' +
            '<span class="exp-label ' + side2 + '" style="--mx:' + (fx * 100).toFixed(2) + '%">' + labelInner + '</span></button>';
        }

      undated.forEach(function (ev) {
        html += '<button type="button" class="exp-item static" data-evid="' + ev.id + '" aria-label="' + esc(ev.title) + ' ' + esc(dateText(ev)) + '">' +

    if (th.subrows) {

        var catSum = '<div class="tsub"><span class="rule">' + esc(catLabel(th.subrows[0])) + (LANG === 'en' ? ': ' : '：') + '</span>' +
          th.subrows.map(function (r) {

          }).join(' · ') + '</div>';

      } else {
        th.subrows.forEach(function (r, i) {

            if (c) inner += isRange(c) ? rangeBarHtml(c, range) : eventNodeHtml(c, range);

            '<div class="subname first">' + esc(subrowLabel(r)) + '</div>' +
            (th.sub ? '<div class="tsub">' + esc(themeSub(th)) + '</div>' : '') +
            (th.categoryControl ? '<div class="tsub"><span class="rule">' + esc(catLabel(r)) + (LANG === 'en' ? ': ' : '：') + '</span>' +
              esc(r.byCategory[state.category].base.replace(/-/g, '.')) + (LANG === 'en' ? ' onward, ' : ' 起，') +
              esc(depsText(r.byCategory[state.category].deps)) + (LANG === 'en' ? ', latest applies' : ' 取最晚') + '</div>' : '') +
            expandBtn;
          lines.push({
            label: i === 0 ? firstLabel : '<div class="subname">' + esc(subrowLabel(r)) + '</div>',
            band: '<div class="band">' + inner + '</div>'

      }
    } else if (th.noteRow) {
      lines.push({
        label: head + expandBtn,
        band: '<div class="band"><div class="noterow"><span class="notetext">' + esc(th.noteRow.text) +
          ' <button type="button" data-noterow="' + esc(th.key) + '">' + t('viewDetail') + '</button></span></div></div>'
      });
    } else if ((th.events || []).length) {
      lines.push({ label: head + expandBtn, band: bandFor((th.events || []).filter(visibleByCaliber)) });
    } else {
      lines.push({ label: head + expandBtn, band: '<div class="band"><div class="emptyrow">' + t('emptyTheme') + '</div></div>' });
    }
    if (th.expand && state.expanded[th.key]) {
      th.expand.groups.forEach(function (g) {
        var evs = g.events;
        // 口径过滤（页面级，v15.12）：全主题适用，无 cats 字段的事件对所有口径可见
        evs = evs.filter(visibleByCaliber);
        if (!evs.length) return;
        lines.push({
          cls: ' exp-row',
          label: '<div class="subname on">' + esc(groupLabel(g.label)) + '</div>',
          band: listFor(evs)
        });
      });
    }
    return '<section class="theme' + (idx % 2 === 1 ? ' alt' : '') + '" data-theme="' + esc(th.key) + '">' +
      lines.map(function (ln) {
        return '<div class="theme-row' + (ln.cls || '') + '"><div class="theme-label">' + ln.label + '</div><div class="track">' + ln.band + '</div></div>';
      }).join('') + '</section>';
  }

  function axisHtml(range) {
    var ticks = '';
    var y0 = +range[0].slice(0, 4), y1 = +range[1].slice(0, 4);
    var span = parseD(range[1]).getTime() - parseD(range[0]).getTime();
    var years = 864e5 * 365.25;
    for (var y = y0; y <= y1; y++) {
      var d = y + '-01-01';
      if (d < range[0] || d >= range[1]) continue;
      ticks += '<span class="tick" style="left:' + (frac(d, range) * 100).toFixed(3) + '%">' + y + '</span>';
    }
    if (span < 3.2 * years) {
      for (var y2 = y0; y2 <= y1; y2++) {
        var d2 = y2 + '-07-01';
        if (d2 < range[0] || d2 >= range[1]) continue;
        ticks += '<span class="tick minor" style="left:' + (frac(d2, range) * 100).toFixed(3) + '%">' + y2 + '.07</span>';
      }
    }
    return ticks;
  }

  function renderTimeline() {
    var l = law();

  function findEvent(evid) {
    var found = null;
    allEvents(law()).forEach(function (ev) { if (ev.id === evid) found = ev; });
    if (found) return found;

    law().themes.forEach(function (th) {
      (th.subrows || []).forEach(function (r) {

          var cat = r.byCategory[state.category];

            id: evid, itemId: r.key, kind: 'cond', prec: 'day', date: cat.base,

            detail: r.detail, verified: null, verifyNote: r.verifyNote || '规则已核验；配套法案实时状态待核验',
            quote: r.quote || null, sources: r.sources

  function renderLegend() {

      '<span class="sep">|</span><span>ⓘ ' + t('legHint') + '</span>' +

  /* ---------- 标签避让：按垂直区位贪心分槽 ---------- */
  // 区位 = 标签中心相对节点线的偏移(px)；同一区位内按横向区间排他。
  // 区位步距按本带最矮标签动态取（2 行标签 44px，3 行标签取标签高+8），相邻区位标签上下不重叠。
  function layoutAllBands() {
    // 高度只在同组内统一：主泳道一组、展开组一组；展开不再拉宽主泳道。
    // 带未注明日期行（nodate-row）的泳道，节点线按整条泳道（含该行）居中。
    $$('#timeline .theme').forEach(function (theme) {
      unifyGroup($$('.theme-row:not(.exp-row) .band', theme));
      unifyGroup($$('.theme-row.exp-row .band', theme));
    });
  }
  function unifyGroup(bands) {
    if (!bands.length) return;
    var maxLane = 76, items = [];
    bands.forEach(function (b) {
      var n = nodateH(b);
      var h = layoutBand(b, n);
      items.push({ band: b, n: n, lane: h + n });
      if (h + n > maxLane) maxLane = h + n;
    });
    items.forEach(function (it) { it.band.style.minHeight = (maxLane - it.n) + 'px'; });
  }
  function nodateH(band) {
    var nr = band.nextElementSibling;
    return (nr && nr.classList.contains('nodate-row')) ? nr.offsetHeight : 0;
  }
  function layoutBand(band, nodate) {
    var w = band.clientWidth;
    if (!w) return 76;
    var shift = (nodate || 0) / 2; // 节点线下移半个 nodate-row 高，与整条泳道中心对齐
    var nodes = [];
    var labels = [];
    $$('.node', band).forEach(function (n) {
      var lb = $('.nlabel', n);
      if (!lb) return;
      var x = parseFloat(n.style.left) / 100 * w;
      var lw = lb.offsetWidth;
      var flip = lb.classList.contains('flip');
      // 标签盒左缘在节点右侧 10px（留出标记图形），翻转时对称
      var item = { el: n, lb: lb, isRange: false, x: x, dotOff: 0,
        L: flip ? x - 10 - lw : x + 10, R: flip ? x - 10 : x + 10 + lw };
      nodes.push(item);
      labels.push(item);
    });
    $$('.rangebar', band).forEach(function (r) {
      var lb = $('.rlabel', r);
      if (!lb) return;
      var cx = parseFloat(lb.dataset.cx) * w;
      var lw = lb.offsetWidth;
      // 区间标签夹在轨道内，不伸进左侧标签列或溢出右缘
      var cxc = Math.max(lw / 2, Math.min(w - lw / 2, cx));
      if (cxc !== cx) lb.style.left = 'calc(50% + ' + (cxc - cx).toFixed(1) + 'px)';
      else lb.style.left = '';
      var barL = parseFloat(r.style.left) / 100 * w;
      var barR = barL + parseFloat(r.style.width) / 100 * w;
      labels.push({ el: r, lb: lb, isRange: true, x: cxc, L: cxc - lw / 2, R: cxc + lw / 2, barL: barL, barR: barR });
    });
    // 日期相近的节点图形上下错开（x 不动，日期读数不变）
    var sorted = nodes.slice().sort(function (a, b) { return a.x - b.x; });
    var offs = [0, 14, -14, 28, -28, 42, -42];
    var ci = 0;
    sorted.forEach(function (it, i) {
      if (i > 0 && it.x - sorted[i - 1].x > 11) ci = 0;
      it.dotOff = offs[ci] || 0;
      ci++;
    });
    // 3 行标签（前置法规行）需要更大的区位步距，避免相邻区位上下重叠
    var maxH = 34;
    labels.forEach(function (it) { maxH = Math.max(maxH, it.lb.offsetHeight); });
    var step = Math.max(44, maxH + 8);
    var Z = [0, step, -step, 2 * step, -2 * step, 3 * step, -3 * step];
    var NODE_PREF = Z.slice();
    var RANGE_PREF = [step, -step, 2 * step, -2 * step, 3 * step, -3 * step, 0];
    labels.sort(function (a, b) { return a.L - b.L; });
    var zoneLabels = {}; // 区位 -> 已放标签 [{L, R}]
    var zoneBars = {};   // 区位 -> 已放区间条 [{L, R}]
    var used = {};
    function zoneBlocked(it, z, lh) {
      var ls = zoneLabels[z] || [];
      var bs = zoneBars[z] || [];
      var i, k;
      // 同区位已有标签横向相交
      for (i = 0; i < ls.length; i++) if (ls[i].R + 8 > it.L && ls[i].L - 8 < it.R) return true;
      // 该区位的标签是否会盖住别的节点图形（按实际纵向位置判断）
      for (k = 0; k < nodes.length; k++) {
        var nd = nodes[k];
        if (nd.x + 6 < it.L || nd.x - 6 > it.R) continue;
        var dTop = shift + nd.dotOff - 6, dBot = shift + nd.dotOff + 6;
        var lTop = shift + z - lh / 2, lBot = shift + z + lh / 2;
        if (dBot > lTop && dTop < lBot) return true;
      }
      // 标签与同区位区间条相交（双向：节点标签撞已放的条，新区间条撞已放的标签）
      if (it.isRange) {
        for (i = 0; i < ls.length; i++) if (ls[i].R > it.barL && ls[i].L < it.barR) return true;
      } else {
        for (i = 0; i < bs.length; i++) if (bs[i].R > it.L && bs[i].L < it.R) return true;
      }
      return false;
    }
    // 区位分配迭代：图形错位与标签区位同向对齐（同一簇内，图形在标签同侧），
    // 避免图形与标签上下颠倒、可读性差；图形移动后可能改变盖点检查结果，故重跑分配，最多 3 轮。
    for (var iter = 0; iter < 3; iter++) {
      zoneLabels = {}; zoneBars = {}; used = {};
      labels.forEach(function (it) {
        var pref = it.isRange ? RANGE_PREF : NODE_PREF;
        var lh = it.lb.offsetHeight;
        var zone = pref[pref.length - 1];
        for (var i = 0; i < pref.length; i++) {
          var z = pref[i];
          if (zoneBlocked(it, z, lh)) continue;
          zone = z;
          break;
        }
        it.zone = zone;
        (zoneLabels[zone] = zoneLabels[zone] || []).push({ L: it.L, R: it.R });
        if (it.isRange) (zoneBars[zone] = zoneBars[zone] || []).push({ L: it.barL, R: it.barR });
        used[zone] = true;
      });
      var changed = false;
      var clusters = [];
      var cur = null;
      sorted.forEach(function (it) {
        if (!cur || it.x - cur.last.x > 11) { cur = { items: [], last: it }; clusters.push(cur); }
        cur.items.push(it); cur.last = it;
      });
      clusters.forEach(function (c) {
        if (c.items.length < 2) return;
        var pos = c.items.filter(function (it) { return it.zone > 0; }).sort(function (a, b) { return a.zone - b.zone; });
        var neg = c.items.filter(function (it) { return it.zone < 0; }).sort(function (a, b) { return b.zone - a.zone; });
        var zero = c.items.filter(function (it) { return it.zone === 0; }).sort(function (a, b) { return a.x - b.x; });
        var i, off;
        for (i = 0; i < pos.length; i++) { off = (i + 1) * 14; if (pos[i].dotOff !== off) { pos[i].dotOff = off; changed = true; } }
        for (i = 0; i < neg.length; i++) { off = -(i + 1) * 14; if (neg[i].dotOff !== off) { neg[i].dotOff = off; changed = true; } }
        for (i = 0; i < zero.length; i++) { off = i === 0 ? 0 : (i % 2 ? 14 : -14) * Math.ceil(i / 2); if (zero[i].dotOff !== off) { zero[i].dotOff = off; changed = true; } }
      });
      if (!changed) break;
    }
    labels.forEach(function (it) {
      if (it.isRange) {
        // 区间条随区位移动，标签居中于条上，不再双重偏移。
        it.el.style.top = 'calc(50% + ' + (it.zone + shift) + 'px)';
        it.lb.style.top = '50%';
      } else {
        // 节点按钮整体下移 shift 与图形错位 dotOff，标签相对按钮反补 dotOff，仍落在指定区位。
        it.el.style.top = 'calc(50% + ' + (shift + it.dotOff) + 'px)';
        it.lb.style.top = 'calc(50% + ' + (it.zone - it.dotOff) + 'px)';
      }
    });
    var pos = 0, neg = 0;
    Object.keys(used).forEach(function (k) {
      var z = +k;
      if (z > 0) pos = Math.max(pos, z);
      if (z < 0) neg = Math.max(neg, -z);
    });
    return 76 + pos + neg;
  }

  /* ---------- 行内详情面板（展开在所属主题下方，手机端为底部浮层） ---------- */
  var lastFocus = null;
  var panelEl = null;
  var panelKey = null;
  function sourceList(keys) {
    if (!keys || !keys.length) return '<p>' + t('nosrc') + '</p>';
    return '<ul class="srcs">' + keys.map(function (k) {
      var s = DATA.sources[k];
      if (!s) return '';
      return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.org) + ' · ' + esc(s.title) + '</a>' +
        (s.doc ? '（' + esc(s.doc) + '）' : '') + '</li>';
    }).join('') + '</ul>';
  }
  var STATUS_TAG_OVERRIDE = { 'dd-orig': '已延期', 'dd-guide': '已逾期' };
  function statusTag(ev) {
    if (STATUS_TAG_OVERRIDE[ev.id]) return STATUS_TAG_OVERRIDE[ev.id];
    if (ev.badge === '草案') return '草案';
    if (ev.badge === '提案') return '提案';
    if (ev.kind === 'cond') return '待配套法案';
    if (ev.kind === 'plan') return '计划';
    if (ev.kind === 'period') return '期间';
    var st = ev.status || '';
    var ti = ev.title || '';
    if (/咨询已截止/.test(st)) return '咨询已截止';
    if (/已上线/.test(st)) return '已上线';
    if (/已发布/.test(st)) return '已发布';
    if (/尚未适用/.test(st)) return '尚未适用';
    if (/正式期进行中/.test(st)) return '进行中';
    if (/部分已适用/.test(st)) return '部分已适用';
    var d = ev.date || ev.from || '';
    if (d && d > OBS) return '待适用';
    if (/生效/.test(ti)) return '已生效';
    if (/通过/.test(ti)) return '已通过';
    if (/发布/.test(ti)) return '已发布';
    if (/上线/.test(ti)) return '已上线';
    if (/截止/.test(ti)) return '已截止';
    if (/开始/.test(ti)) return '已开始';
    if (/提案/.test(ti)) return '已提案';
    if (/草案/.test(ti)) return '草案';
    if (/报告/.test(ti)) return '已发布';
    if (/延期/.test(ti)) return '已延期';
    return '已确定';
  }
  function statusTagClass(tag) {
    if (tag === '草案' || tag === '提案' || tag === '已逾期') return 'st-draft';
    if (tag === '待配套法案') return 'st-cond';
    if (tag === '计划' || tag === '期间' || tag === '待适用' || tag === '尚未适用') return 'st-pending';
    return 'st-done';
  }
  function quoteHtml(ev) {
    var q = ev.quote;
    if (q && q.text) {
      return '<h3>' + t('origLaw') + '</h3><blockquote class="quote"><p>' + esc(q.text) + '</p>' +
        '<cite>' + esc(q.ref || ev.article || '') +
        (q.url ? ' · <a href="' + esc(q.url) + '" target="_blank" rel="noopener">' + t('viewOJ') + '</a>' : '') + '</cite></blockquote>' +
        (q.showNote && q.note ? '<p class="qnote">' + esc(q.note) + '</p>' : '');
    }
    return '<h3>' + t('origLaw') + '</h3><p class="noquote">' + esc((q && q.note) || t('noquote')) +
      ((q && q.url) ? ' <a href="' + esc(q.url) + '" target="_blank" rel="noopener">' + t('viewSrc') + '</a>' : '') + '</p>';
  }
  function panelHtml(titleHtml, tagHtml, quote, kvHtml, detailText, sources) {
    var longCls = detailText && detailText.length > 220 ? ' long' : '';
    return '<div class="dp-head"><div>' + titleHtml + '</div>' +
      '<div class="dp-head-right">' + tagHtml +
      '<button type="button" class="dp-close" id="dpClose" aria-label="' + t('closeDetail') + '">✕</button></div></div>' +
      '<div class="dp-body">' + quote +
      '<h3>' + t('keyinfo') + '</h3><dl class="kv">' + kvHtml + '</dl>' +
      (detailText ? '<h3>' + t('desc') + '</h3><p class="detail' + longCls + '">' + esc(detailText) + '</p>' +
        (detailText.length > 220 ? '<button type="button" class="more" id="dpMore">' + t('more') + '</button>' : '') : '') +
      '<h3>' + t('sources') + '</h3>' + sourceList(sources) + '</div>';
  }
  function openPanel(themeKey, key, html, invoker) {
    closePanel(true);
    lastFocus = invoker || document.activeElement;
    panelKey = key;
    var sec = $('.theme[data-theme="' + themeKey + '"]', $('#timeline'));
    if (!sec) return;
    panelEl = document.createElement('div');
    panelEl.className = 'detail-panel';
    panelEl.setAttribute('role', 'region');
    panelEl.setAttribute('aria-label', t('detailRegion'));
    panelEl.innerHTML = html;
    sec.appendChild(panelEl);
    $('#dpClose', panelEl).addEventListener('click', function () { closePanel(); });
    var mb = $('#dpMore', panelEl);
    if (mb) mb.addEventListener('click', function () {
      var p = $('.detail', panelEl);
      p.classList.toggle('open');
      mb.textContent = p.classList.contains('open') ? t('less') : t('more');
    });
    $('#dpClose', panelEl).focus();
    if (window.innerWidth > 768) panelEl.scrollIntoView({ block: 'nearest' });
  }
  function closePanel(keepFocus) {
    if (panelEl) { panelEl.remove(); panelEl = null; }
    panelKey = null;
    if (!keepFocus && lastFocus && lastFocus.focus) {
      try { lastFocus.focus(); } catch (e) { /* 原节点已被重渲染移除 */ }
      lastFocus = null;
    }
  }
  function themeOf(ev) {
    var found = null;
    law().themes.forEach(function (th) {
      var hit = (th.events || []).some(function (e) { return e.id === ev.id; }) ||
        (th.subrows || []).some(function (r) {
          return r.key === ev.itemId || (r.events || []).some(function (e) { return e.id === ev.id; });
        }) ||
        ((th.expand || {}).groups || []).some(function (g) { return g.events.some(function (e) { return e.id === ev.id; }); });
      if (hit) found = th;
    });
    return found;
  }
  function kindTag(ev) {
    if (isRange(ev)) return ev.kind === 'plan' ? t('kindRangePlan') : (ev.kind === 'period' ? t('kindPeriod') : t('kindRange'));
    return ev.kind === 'cond' ? t('kindCond') : (ev.kind === 'plan' ? t('kindPlan') : t('kindFirm'));
  }
  function openDetail(ev, invoker) {
    if (!ev) return;
    var th = themeOf(ev);
    var l = law();
    var head = '<div class="kicker">' + esc(lawLabel(l)) + (th ? ' · ' + esc(themeLabel(th)) : '') + '</div><h2>' + esc(evTitle(ev)) + '</h2>';
    var kv = '<dt>' + t('kvDate') + '</dt><dd>' + esc(dateText(ev)) + '<span class="tag">' + kindTag(ev) + '</span>' +
      (ev.badge ? '<span class="tag warn">' + esc(badgeText(ev.badge)) + '</span>' : '') + '</dd>';
    if (ev.article) kv += '<dt>' + t('kvArt') + '</dt><dd>' + esc(ev.article) + '</dd>';
    if (ev.scope) kv += '<dt>' + t('kvScope') + '</dt><dd>' + esc(ev.scope) + '</dd>';
    if (ev.roles) kv += '<dt>' + t('kvRoles') + '</dt><dd>' + esc(ev.roles) + '</dd>';
    if (ev.conditions) kv += '<dt>' + t('kvCond') + '</dt><dd>' + esc(ev.conditions) + '</dd>';
    var tag = tagText(statusTag(ev));
    var tagHtml = '<span class="status-tag ' + statusTagClass(tag) + '">' + esc(tag) + '</span>';
    openPanel(th ? th.key : l.themes[0].key, 'ev:' + ev.id,
      panelHtml(head, tagHtml, quoteHtml(ev), kv, ev.detail, ev.sources), invoker);
  }
  function openNoteRow(th, invoker) {
    var nr = th.noteRow;
    var l = law();
    var head = '<div class="kicker">' + esc(lawLabel(l)) + ' · ' + esc(themeLabel(th)) + '</div><h2>' + esc(nr.title) + '</h2>';
    var kv = '<dt>' + t('kvDate') + '</dt><dd>' + t('noDateNote') + '</dd>';
    if (nr.article) kv += '<dt>' + t('kvArt') + '</dt><dd>' + esc(nr.article) + '</dd>';
    openPanel(th.key, 'nr:' + th.key,
      panelHtml(head, '', '', kv, nr.detail, nr.sources),
      invoker);
  }

  /* ---------- 顶栏：胶囊定位 / 滚动收紧 / 主题记忆 ---------- */
  function movePill(instant) {
    var on = document.querySelector('.tb-nav a.on');
    var pill = document.querySelector('.tb-pill');
    if (!on || !pill) return;
    if (instant) pill.style.transition = 'none';
    pill.style.transform = 'translateX(' + on.offsetLeft + 'px)';
    pill.style.width = on.offsetWidth + 'px';
    if (instant) { void pill.offsetWidth; pill.style.transition = ''; }
  }
  window.movePill = movePill;
  var __pillAnimated = (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('.tb-nav a'));
    var cur = -1;
    links.forEach(function (a, i) { if (a.classList.contains('on')) cur = i; });
    if (cur < 0) return false;
    var prev = -1;
    try { prev = parseInt(sessionStorage.getItem('lcaradar-nav-prev') || '-1', 10); } catch (e) {}
    try { sessionStorage.setItem('lcaradar-nav-prev', String(cur)); } catch (e) {}
    var pill = document.querySelector('.tb-pill');
    if (!pill) return false;
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (prev >= 0 && prev < links.length && prev !== cur && !reduced) {
      pill.style.transition = 'none';
      pill.style.transform = 'translateX(' + links[prev].offsetLeft + 'px)';
      pill.style.width = links[prev].offsetWidth + 'px';
      window.addEventListener('load', function () {
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          pill.style.transition = '';
          void pill.offsetWidth;
          movePill();
        }); });
      });
      return true;
    }
    movePill(true);
    return false;
  })();
  function onScroll() {
    var tb = document.querySelector('.topbar');
    if (!tb) return;
    var c = window.scrollY > 48;
    if (tb.classList.contains('tb-compact') !== c) {
      tb.classList.toggle('tb-compact', c);
      document.body.classList.toggle('tb-compact', c);
    }
  }
  function navScroll() {
    var nav = document.querySelector('.tb-nav');
    var on = document.querySelector('.tb-nav a.on');
    if (nav && on) { try { on.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
    document.querySelectorAll('.tb-nav').forEach(function (el) {
      el.classList.toggle('hscroll', el.scrollWidth > el.clientWidth + 2);
    });
  }

  /* ---------- 语言切换：重渲染全部内容 ---------- */
  function applyLang(lang) {
    LANG = (lang === 'en') ? 'en' : 'zh';
    storeSet('lca-lang', LANG);
    document.documentElement.classList.toggle('lang-en', LANG === 'en');
    document.documentElement.setAttribute('lang', LANG === 'en' ? 'en' : 'zh-CN');
    document.title = LANG === 'en' ? 'Regulation Tracker · LCA RADAR' : '法规监控 · LCA 瞭望';
    document.querySelectorAll('input[name="lca-lang"]').forEach(function (r) { r.checked = (r.value === LANG); });
    document.querySelectorAll('.tb-nav a[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      if (TL[LANG] && (k in TL[LANG])) el.textContent = TL[LANG][k];
    });
    var si = document.getElementById('searchInput');
    if (si) si.setAttribute('placeholder', t('searchPh'));
    var ov = document.getElementById('searchOv');
    if (ov) ov.setAttribute('aria-label', t('searchLabel'));
    var sb = document.getElementById('tbSearchBtn');
    if (sb) sb.setAttribute('title', t('searchTitle'));
    var lt = document.querySelector('.lawtabs');
    if (lt) lt.setAttribute('aria-label', t('lawtabsLabel'));
    var ts = document.querySelector('.theme-switch');
    if (ts) ts.setAttribute('aria-label', t('themeLabel'));
    render();
    if (window.movePill) requestAnimationFrame(function () { window.movePill(true); });
  }
  function initLang() {
    applyLang(LANG);
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      document.documentElement.classList.add('lang-ready');
    }); });
    document.querySelectorAll('.lang-switch').forEach(function (sw) {
      if (sw.__langBound) return;
      sw.__langBound = true;
      sw.addEventListener('click', function (e) {
        var label = e.target.closest('label');
        if (!label) return;
        var input = label.querySelector('input');
        if (input) applyLang(input.value);
      });
    });
  }

  /* ---------- 顶栏搜索：事件标题关键词搜索，定位并高亮 ---------- */
  var SEARCH_INDEX = null;
  function buildSearchIndex() {
    var idx = [];
    DATA.laws.forEach(function (l) {
      l.themes.forEach(function (th) {
        var push = function (ev, themeKey, inExpand) {
          idx.push({
            id: ev.id, law: l.key, theme: themeKey, inExpand: !!inExpand,
            label: ev.label, title: ev.title,
            enLabel: (EVENT_EN[ev.id] || [])[0] || ev.label,
            enTitle: (EVENT_EN[ev.id] || [])[1] || ev.title,
            themeZh: th.label, themeEn: THEME_EN[th.key] || th.label,
            date: ev.date || ev.from || ''
          });
        };
        (th.events || []).forEach(function (ev) { push(ev, th.key, false); });
        (th.subrows || []).forEach(function (r) {
          (r.events || []).forEach(function (ev) { push(ev, th.key, false); });
          if (r.byCategory) {
            idx.push({
              id: r.key + '-ev', law: l.key, theme: th.key, inExpand: false, synthetic: true,
              label: r.label + '基准', title: r.label + '（' + CAT_EN.ev + '）',
              enLabel: (SUBROW_EN[r.key] || r.label) + ' baseline',
              enTitle: (SUBROW_EN[r.key] || r.label) + ' (EV batteries)',
              themeZh: th.label, themeEn: THEME_EN[th.key] || th.label,
              date: r.byCategory.ev.base
            });
          }
        });
        ((th.expand || {}).groups || []).forEach(function (g) {
          (g.events || []).forEach(function (ev) { push(ev, th.key, true); });
        });
      });
    });
    return idx;
  }
  var searchOpen = false;
  var searchReturnFocus = null;
  function openSearch() {
    var ov = document.getElementById('searchOv');
    var inp = document.getElementById('searchInput');
    if (!ov || !inp || searchOpen) return;
    searchReturnFocus = document.activeElement || null;
    searchOpen = true;
    ov.classList.add('on');
    inp.value = '';
    renderSearch();
    setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }, 50);
  }
  function closeSearch() {
    var ov = document.getElementById('searchOv');
    if (!ov || !searchOpen) return;
    searchOpen = false;
    ov.classList.remove('on');
    var target = searchReturnFocus && document.contains(searchReturnFocus) && typeof searchReturnFocus.focus === 'function'
      ? searchReturnFocus : document.getElementById('tbSearchBtn');
    searchReturnFocus = null;
    if (target) { try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); } }
  }
  function renderSearch() {
    var inp = document.getElementById('searchInput');
    var res = document.getElementById('searchRes');
    if (!inp || !res) return;
    var q = inp.value.trim().toLowerCase();
    if (!q) { res.innerHTML = '<div class="empty">' + esc(t('searchHint')) + '</div>'; return; }
    var hits = SEARCH_INDEX.filter(function (it) {
      return (it.label + ' ' + it.title + ' ' + it.enLabel + ' ' + it.enTitle + ' ' + (it.themeZh || '') + ' ' + (it.themeEn || '')).toLowerCase().indexOf(q) >= 0;
    }).slice(0, 20);
    if (!hits.length) { res.innerHTML = '<div class="empty">' + esc(t('searchEmpty')) + '</div>'; return; }
    res.innerHTML = hits.map(function (it) {
      var lab = LANG === 'en' ? it.enLabel : it.label;
      return '<a href="#" data-search-id="' + it.id + '"><div class="rt">' + esc(lab) + '</div>' +
        '<div class="rm">' + esc(lawLabelByKey(it.law)) + (it.date ? ' · ' + esc(fmtD(it.date)) : '') + '</div></a>';
    }).join('');
    $$('#searchRes a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var item = null;
        SEARCH_INDEX.forEach(function (it) { if (it.id === a.dataset.searchId) item = it; });
        if (item) goToEvent(item);
      });
    });
  }
  function goToEvent(item) {
    closeSearch();
    state.law = item.law;
    state.window = 'full';
    if (item.synthetic) state.category = 'ev';
    if (item.inExpand) state.expanded[item.theme] = true;
    render();
    requestAnimationFrame(function () {
      var el = document.querySelector('#timeline [data-evid="' + item.id + '"]');
      if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.add('search-hit');
      setTimeout(function () { el.classList.remove('search-hit'); }, 2600);
    });
  }
  function initSearch() {
    SEARCH_INDEX = buildSearchIndex();
    var btn = document.getElementById('tbSearchBtn');
    var ov = document.getElementById('searchOv');
    var inp = document.getElementById('searchInput');
    if (!btn || !ov || !inp) return;
    btn.addEventListener('click', openSearch);
    ov.addEventListener('click', function (e) { if (e.target === ov) closeSearch(); });
    inp.addEventListener('input', renderSearch);
  }

  /* ---------- 启动 ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    initLang();
    if (!__pillAnimated) movePill();
    onScroll();
    navScroll();
    initSearch();
    document.querySelectorAll('.tb-theme input[name="lca-theme"]').forEach(function (r) {
      r.addEventListener('change', function () { storeSet('lca-watch-theme', r.value); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
      if (e.key === 'Escape') {
        if (searchOpen) { closeSearch(); return; }
        if (panelEl) closePanel();
      }
    });
    window.addEventListener('resize', function () { layoutAllBands(); movePill(); navScroll(); });
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('load', function () { if (!__pillAnimated) movePill(); navScroll(); });
  });
})();

</script>
