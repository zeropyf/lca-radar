    --badge-alert-bg:#c0392b; --badge-alert-fg:#ffffff; --badge-steel-bg:#0077B6; --badge-steel-fg:#ffffff;

  html[data-theme="dark"]{

  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}

  h1{font-size:25px;margin:0;line-height:1.3}
  .draft-tag{display:inline-block;background:var(--sel);color:var(--primary);border:1px solid var(--steel);font-size:12px;border-radius:20px;padding:1px 10px;margin-left:10px;vertical-align:3px;font-weight:600}

  .toggles button.on{background:var(--steel);border-color:var(--steel);color:var(--on-text)}

  .recent a{color:var(--link)}
  .recent h4{font-size:12.5px;margin:12px 0 2px;color:var(--ink2)}
  .method summary{cursor:pointer;font-weight:700;font-size:13.5px}
  .method p{font-size:13px;color:var(--ink2);line-height:1.75;margin:8px 0 0}
  .legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .lg{display:inline-flex;align-items:center;gap:6px;border:1.5px solid;border-radius:20px;padding:2px 11px;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent}
  .lg .n{font-weight:800}
  .lg.applied{color:var(--applied);border-color:var(--applied);background:var(--applied-bg)}
  .lg.pending{color:var(--pending);border-color:var(--pending);background:var(--pending-bg)}
  .lg.consult{color:var(--consult);border-color:var(--consult);background:var(--consult-bg)}
  .lg.awaited{color:var(--awaited);border-color:var(--awaited);background:var(--awaited-bg)}
  .lg.proposal{color:var(--proposal);border-color:var(--proposal);border-style:dashed}
  .lg.published{color:var(--published);border-color:var(--published);background:var(--published-bg)}
  .lg.off{opacity:1;background:transparent;color:var(--ink2)}
  .lg-hint{color:var(--ink2);font-size:12px;margin-left:4px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .filters label{font-size:12.5px;color:var(--ink2)}
  .filters input,.filters select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13px;max-width:100%}
  .filters button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer}
  .filters button.on{background:var(--steel);border-color:var(--steel);color:var(--on-text)}
  .countline{font-size:13px;color:var(--ink2);margin-top:10px}

  .toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}

  .vl em{font-style:normal}
  .sh{display:inline-block;flex:none}
  .sh.dia{width:11px;height:11px;transform:rotate(45deg);background:var(--ink)}
  .sh.dia.hollow{background:var(--card);border:1.8px solid var(--ink)}
  .sh.bar{width:26px;height:9px;border-radius:5px;background:var(--ink);opacity:.75}
  .sh.bar.dashed{background:transparent;border:1.4px dashed var(--ink)}
  .sh.tline{width:0;height:16px;border-left:1.8px dashed var(--alert)}
  .sh.badge{background:var(--badge-alert-bg);color:var(--badge-alert-fg);font-style:normal;font-size:10px;font-weight:700;border-radius:7px;padding:1px 6px}
  .sh.tbc{font-style:normal;font-size:11px;border:1.4px solid var(--ink2);border-radius:10px;padding:1px 9px;color:var(--ink)}

  .chartmin{min-width:900px}
  svg text{font-family:inherit}
  .rowbtn{cursor:pointer}
  /* list view */

  .pill.pending{color:var(--pending);border-color:var(--pending);background:var(--pending-bg)}
  .pill.consult{color:var(--consult);border-color:var(--consult);background:var(--consult-bg)}
  .pill.awaited{color:var(--awaited);border-color:var(--awaited);background:var(--awaited-bg)}

  .pill.published{color:var(--published);border-color:var(--published);background:var(--published-bg)}
  .pill.phased{color:var(--applied);border-color:var(--applied);background:var(--applied-bg)}
  .pill.framework{color:var(--applied);border-color:var(--applied);background:var(--applied-bg)}
  .pill.definitive{color:var(--published);border-color:var(--published);background:var(--published-bg)}
  .pill.running{color:var(--pending);border-color:var(--pending);background:var(--pending-bg)}
  .pill.unverified{color:var(--ink2);border-color:var(--ink2);background:var(--chip-bg);border-style:dashed}
  .typechip{display:inline-block;font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
  .kv{display:grid;grid-template-columns:132px 1fr;row-gap:8px;font-size:13.5px;border-bottom:1px dashed var(--line);padding-bottom:12px}
  .kv dt{color:var(--ink2);white-space:normal}
  .kv dd{margin:0;overflow-wrap:anywhere}

  .src{font-size:13px;margin-top:12px;line-height:1.8}
  .src b{color:var(--ink2);font-weight:600}
  .src a{color:var(--link);overflow-wrap:anywhere}
  .note{font-size:13.5px;margin-top:10px}
  .sugg{font-size:13.5px;margin-top:10px;background:var(--sel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .sugg b{color:var(--primary)}
  .nbr .row{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .nbr .row:last-child{border-bottom:none}
  .rel-chip{display:inline-block;background:var(--chip-bg);border:1px solid var(--line);border-radius:14px;padding:0 8px;font-size:12px;margin:1px 2px;cursor:pointer;color:var(--ink)}
  .rel-chip:hover{border-color:var(--steel);color:var(--steel)}
  .rel-chip .k{color:var(--ink2);margin-right:3px}
  .hist{margin-top:14px;border-top:1px dashed var(--line);padding-top:8px}
  .hist summary{cursor:pointer;font-weight:700;font-size:13.5px}
  .hist ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.8;color:var(--ink2)}
  .foot{color:var(--ink2);font-size:12.5px;margin-top:18px;line-height:1.75}
  .modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.5);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s}
  .modal-bg.open{opacity:1;visibility:visible}
  .modal{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);width:min(680px,calc(100% - 32px));max-height:86vh;overflow:auto;padding:22px 24px;transform:translateY(8px);transition:transform .2s ease}
  .modal-bg.open .modal{transform:translateY(0)}
  .modal-x{position:absolute;top:10px;right:12px;border:none;background:transparent;color:var(--ink2);font-size:19px;cursor:pointer;line-height:1;padding:4px 6px}
  .modal-x:hover{color:var(--ink)}
  .modal h3{margin:0 4px 2px 0;font-size:18px;padding-right:28px}
  .modal .en{color:var(--ink2);font-size:12px;margin-bottom:12px;overflow-wrap:anywhere}
  .modal .rel-title{font-size:14.5px;font-weight:700;margin:18px 0 6px}
  .backbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;margin-bottom:10px}
  .banner{border:1px solid var(--alert);color:var(--alert);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:13.5px;display:none}
  .banner.show{display:block}
  .errbox{border:1px solid var(--alert);border-radius:12px;padding:18px;margin-top:20px;font-size:14px;color:var(--alert)}
</style>

      <p data-zh="“待核验”表示尚未取得一手依据，不得理解为“未发布”“未通过”或“不存在”；状态徽章来自事项的显式状态字段，未知状态显示“状态待核验”，不默认“待通过”。" data-en="“Pending verification” means no primary source has been obtained yet; it must not be read as “not published”, “not adopted” or “non-existent”. Status badges come from each item's explicit status field; unknown status shows “Status pending verification”, never a default “Not yet adopted”."></p>

/* 状态字段：每条记录自带显式 cat；未知状态不默认“待通过”，回退“状态待核验”（V14-01）。

/* ============ 日期服务（全站唯一；图表／列表／详情共用；左闭右开） ============ */
const DAY = 86400000;
const pd = s => new Date(s + 'T00:00:00Z').getTime();
const fmtD = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };
const fmtDLocal = ms => { const d = new Date(ms); const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]; return L.lang === 'zh' ? fmtD(ms) : (d.getUTCDate() + ' ' + mo + ' ' + d.getUTCFullYear()); };
function todayShanghai() {
  try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
  catch (e) { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
}
function addMonths(ymd, n) {
  const [y, m, d] = ymd.split('-').map(Number);
  let total = (y * 12 + (m - 1)) + n;
  const ny = Math.floor(total / 12), nm = total - ny * 12 + 1;
  const dim = new Date(Date.UTC(ny, nm, 0)).getUTCDate();
  return ny + '-' + String(nm).padStart(2, '0') + '-' + String(Math.min(d, dim)).padStart(2, '0');
}
/* 事件绘图区间：日精度取当日；月／季／年精度取整段区间；区间事件取 f/t */
function eventSpan(ev) {
  if (ev.d) return { f: pd(ev.d), t: pd(ev.d) + DAY };
  if (ev.f && ev.t) return { f: pd(ev.f), t: pd(ev.t) + DAY };
  return null;
}
function windowAll() {
  let mn = Infinity, mx = -Infinity;
  DISPLAYED.forEach(it => it.ev.forEach(ev => { const sp = eventSpan(ev); if (sp) { mn = Math.min(mn, sp.f); mx = Math.max(mx, sp.t); } }));
  const y0 = new Date(mn).getUTCFullYear(), y1 = new Date(mx - 1).getUTCFullYear();
  return { f: pd(y0 + '-01-01'), t: pd((y1 + 1) + '-01-01'), label: { zh: '全部 ' + y0 + '–' + y1, en: 'All ' + y0 + '–' + y1 }, years: [y0, y1] };
}
function window24(today) {

}

/* ============ 条件日期统一计算（V14-11）：唯一计算入口，四视图同读结果 ============ */
function computeCondDate(it) {
  if (!it.cond) return null;
  const cats = it.cond.categories.map(c => {
    const deps = c.dependencies.map(d => {
      const dep = (it.deps || []).find(x => x.key === d.key);
      const eif = d.entryIntoForce || null;
      const result = eif ? addMonths(eif, d.offsetMonths) : null;
      return { key: d.key, name: dep ? T(dep.name) : d.key, entryIntoForce: eif, offsetMonths: d.offsetMonths, result };
    });
    const parts = [c.baseDate].concat(deps.map(d => d.result));
    const result = deps.some(d => d.result === null) ? null : parts.sort().pop();
    return { key: c.key, label: c.label, labelText: T(c.label), baseDate: c.baseDate, deps, result };
  });
  const allResolved = cats.every(c => c.result !== null);
  const earliest = allResolved ? cats.map(c => c.result).sort()[0] : null;
  return { categories: cats, allResolved, earliest };
}
function condResolved(it) { const cc = computeCondDate(it); return !!cc && cc.allResolved; }
/* 待定区纳入规则：next 为 cond/unknown，或存在未解决的条件依赖，或显式 unresolved 标记（qr 推算依据待补） */
function isUnresolved(it) {
  if (it.next.nat === 'cond' || it.next.nat === 'unknown') return true;
  if (it.cond && !condResolved(it)) return true;
  if (it.unresolved) return true;
  return false;
}

function getFiltered() {

/* 2 产品与主体 */
html += '<dl class="kv" style="margin-top:12px"><dt>' + u.fScope + '</dt><dd>' + esc(T(it.prod)) + '<br>' + (it.roles? esc(T(it.roles)): (L.lang === 'zh'? '主体待核验': 'Actors pending verification')) + '</dd>';
/* 3 状态与证据：法定规则／配套文件当前状态／实际适用状态／证据状态四行（V14-02） */
html += '<dt>' + u.fStatus + '</dt><dd>' + u.fRuleLine + '：' + (it.rule ? esc(T(it.rule.text)) : (it.stage ? esc(T(it.stage)) : '')) + '<br>';
if (it.deps && it.deps.length) {
  html += u.fDeps + '：' + it.deps.map(d => esc(T(d.name)) + '：' + esc(T(d.status)) + (d.ver ? '（' + u.lastChecked + ' ' + esc(d.ver.checked) + '；' + esc(T(d.ver.note)) + '）' : '')).join('；') + '<br>';
} else if (it.files && it.files.length) {
  html += u.fDeps + '：' + it.files.map(fl => esc(T(fl.name)) + '：' + esc(T(fl.status))).join('；') + '<br>';
} else {
  html += u.fDeps + '：' + esc(u.noDeps) + '<br>';
}
html += u.fAppSt + '：' + (it.app ? esc(T(it.app)) : (L.lang === 'zh' ? '待核验' : 'Pending verification')) + '<br>';
html += u.fEvSt + '：' + (it.ver.verified ? (u.lastVerified + ' ' + fmtDLocal(pd(it.ver.verified))) : (L.lang === 'zh' ? '待核验' : 'Pending verification'))
+ '（' + u.lastChecked + ' ' + fmtDLocal(pd(it.ver.checked)) + '；' + esc(T(it.ver.note)) + '）</dd>';
/* 4 下一节点（含条件分产品计算表） */
html += '<dt>' + u.fNext + '</dt><dd>' + esc(nextLine(it));
if (it.cond) {
  const cc = computeCondDate(it);
  const tbc = L.lang === 'zh' ? '待确认' : 'To be confirmed';
  html += '<br><b>' + u.fCond + '：</b><br>' + cc.categories.map(c => {
    const ds = c.deps.map(d => esc(d.name) + ' ' + (d.entryIntoForce ? esc(d.entryIntoForce) + ' +' + d.offsetMonths + (L.lang === 'zh' ? '个月' : ' months') + ' → ' + d.result : (L.lang === 'zh' ? '生效日未知' : 'entry-into-force unknown'))).join('；');
    return '· ' + esc(c.labelText) + '：' + u.condBase + ' ' + c.baseDate + (ds ? '；' + ds : '') + '；' + u.condResult + ' ' + (c.result || tbc);
  }).join('<br>');
}
html += '</dd></dl>';
/* 拆分记录 */
if (it.subs) html += '<div class="mech"><b>' + u.fSubs + '：</b><br>' + it.subs.map(s => '<b>' + esc(s.art) + ' ' + esc(T(s.t)) + '</b> — ' + esc(T(s.status)) + '<br>' + esc(T(s.scope))).join('<br>') + '</div>';
/* 关联配套文件 */
if (it.files) html += '<div class="mech"><b>' + u.fFiles + '：</b><br>' + it.files.map(fl => '<b>' + esc(T(fl.name)) + '</b>（' + esc(T(fl.type)) + '）— ' + esc(T(fl.status))).join('<br>') + '</div>';
/* 建议 */
if (it.act) html += '<div class="sugg"><b>' + u.fAct + '：</b> ' + esc(T(it.act)) + '</div>';
/* 说明 */
if (T(it.note)) html += '<div class="note"><b>' + u.fNote + '：</b> ' + esc(T(it.note)) + '</div>';
/* 来源（缺失时显式待核验，永不省略） */
html += '<div class="src"><b>' + u.fSrc + '：</b> ' + (it.src && it.src.length? srcLinks(it.src): esc(u.noSource)) + '</div>';
/* 关联 */
const outIds = new Set((it.rel || []).map(r => r.to));
const rows = (it.rel || []).map(r => { const t = byId[r.to]; return t? '<div class="row"><button class="rel-chip" data-to="' + r.to + '"><span class="k">' + esc(T(r.type)) + '</span>' + esc(T(t.t)) + '</button> ' + pill(catOf(r.to)) + '</div>': '';}).join('')
+ ITEMS.filter(o => o.id!== id &&!outIds.has(o.id) && (o.rel || []).some(r => r.to === id)).map(o => '<div class="row"><button class="rel-chip" data-to="' + o.id + '"><span class="k">' + (L.lang === 'zh'? '被引用': 'Referenced by') + '</span>' + esc(T(o.t)) + '</button> ' + pill(catOf(o.id)) + '</div>').join('');
html += '<div class="rel-title">' + u.fRel + '</div><div class="nbr">' + (rows || '<div class="row" style="color:var(--ink2)">' + (L.lang === 'zh'? '无跨法规关系（从属关系见泳道分组）': 'No cross-act links (parentage shown by lanes)') + '</div>') + '</div>';
/* 历史 */
if (it.hist && it.hist.length) html += '<div class="hist"><details><summary>' + u.fHist + '</summary><ul>' + it.hist.map(h => '<li>' + esc(T(h)) + '</li>').join('') + '</ul></details></div>';
$('#modalDetail').innerHTML = html;
const back = $('#modalBack');
if (back) back.addEventListener('click', () => { const prev = modalStack.pop(); if (prev) openDetail(prev, null, { noPush: true, fromBack: true});});
$('#modalDetail').querySelectorAll('.rel-chip').forEach(c => c.addEventListener('click', () => openDetail(c.dataset.to, c, { syncReplace: true})));
const modal = document.querySelector('.modal');
$('#modalBg').classList.add('open');
document.body.style.overflow = 'hidden';
const mainEl = document.getElementById('mainContent'); if (mainEl) mainEl.inert = true;
modal.scrollTop = sameItem ? prevScroll : 0;
focusModalTitle();
if (!opts.noHash) {
const hash = '#item/' + id;
if (opts.syncReplace) history.replaceState({ item: id}, '', hash);
else history.pushState({ item: id}, '', hash);
}
if (viewMode === 'chart') renderChart();
}

function closeModal() {
if (!modalOpen) return;
modalOpen = false; modalStack = [];
const id = modalId; modalId = null;
$('#modalBg').classList.remove('open');
document.body.style.overflow = '';
const mainEl = document.getElementById('mainContent'); if (mainEl) mainEl.inert = false;
if (location.hash.indexOf('#item/') === 0) history.replaceState(null, '', location.pathname + location.search);
if (viewMode === 'chart') renderChart();
restoreFocus();
return id;
}

function setWindow(mode) {
winMode = mode;
win = mode === 'all'? windowAll(): window24(todayStr);
renderAll();
}
function renderAll() {
fillStatic(); fmtAsof(); renderLegend(); renderFilters(); renderUnknownList();
if (viewMode === 'chart') { $('#chartWrap').style.display = 'block'; $('#listWrap').style.display = 'none'; renderChart();}
else { $('#chartWrap').style.display = 'none'; $('#listWrap').style.display = 'block'; renderList();}
}
function refreshDateIfChanged() {
const t = todayShanghai();
if (t!== todayStr) {
todayStr = t;
win = winMode === 'all'? windowAll(): window24(todayStr);
renderRecent(); renderAll();
if (modalOpen && modalId) openDetail(modalId, null, { noPush: true, noHash: true});
}
}

/* ============ 事件绑定 ============ */
$('#modalX').addEventListener('click', closeModal);
$('#modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal();});
document.addEventListener('keydown', e => {
if (!modalOpen) return;
if (e.key === 'Escape') { e.preventDefault(); closeModal(); return;}
if (e.key === 'Tab') {
const modal = document.querySelector('.modal');
const els = [...modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el =>!el.disabled && el.offsetParent!== null);
if (!els.length) return;
const first = els[0], last = els[els.length - 1];
if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus();}
else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus();}
}
});
document.addEventListener('focusin', e => {
  if (!modalOpen) return;
  const modal = document.querySelector('.modal');
  const t = e.target;
  if (modal && modal.contains(t)) return;
  if (t && t.closest && (t.closest('.toggles') || t.closest('header'))) return;
  if (modal) { const title = document.getElementById('modalTitle'); if (title) title.focus(); }
});
window.addEventListener('popstate', () => {
const m = location.hash.match(/^#item\/([A-Za-z0-9_-]+)$/);
if (m) openDetail(m[1], null, { noPush: true, noHash: true});
else if (modalOpen) closeModal();
});
$('#winSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => setWindow(b.dataset.w)));
$('#viewSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { viewMode = b.dataset.v; renderAll();}));
$('#clearBtn').addEventListener('click', clearFilters);
$('#q').addEventListener('input', e => { qFilter = e.target.value.trim(); renderAll();});
$('#jur').addEventListener('change', e => { jurFilter = e.target.value; renderAll();});
$('#typ').addEventListener('change', e => { typFilter = e.target.value; renderAll();});
$('#langZh').addEventListener('click', () => { L.lang = 'zh'; $('#langZh').classList.add('on'); $('#langZh').setAttribute('aria-pressed', 'true'); $('#langEn').classList.remove('on'); $('#langEn').setAttribute('aria-pressed', 'false'); renderAll(); renderRecent(); if (modalOpen && modalId) openDetail(modalId, null, { noPush: true, noHash: true});});
$('#langEn').addEventListener('click', () => { L.lang = 'en'; $('#langEn').classList.add('on'); $('#langEn').setAttribute('aria-pressed', 'true'); $('#langZh').classList.remove('on'); $('#langZh').setAttribute('aria-pressed', 'false'); renderAll(); renderRecent(); if (modalOpen && modalId) openDetail(modalId, null, { noPush: true, noHash: true});});
$('#themeBtn').addEventListener('click', () => {
const h = document.documentElement, dark = h.dataset.theme!== 'dark';
h.dataset.theme = dark? 'dark': 'light';
$('#themeBtn').setAttribute('aria-pressed', dark? 'true': 'false');
fillStatic();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshDateIfChanged();});
window.addEventListener('focus', refreshDateIfChanged);

/* ============ 测试模式（仅?test=1 时启用，明确横幅标识，不混入正式记录） ============ */
window.__v14 = { addMonths, latestOf, todayShanghai, windowAll: () => windowAll(), window24: t => window24(t)};
window.__v141 = { computeCondDate, condResolved, isUnresolved, buildDisplayed, getFiltered, renderAll, renderRecent, version: 'v14.1',
  setDepDate: (itemId, depKey, date) => { const it = byId[itemId]; if (!it || !it.cond) return false; let ok = false; it.cond.categories.forEach(c => c.dependencies.forEach(d => { if (d.key === depKey) { d.entryIntoForce = date; ok = true; } })); if (ok) { renderAll(); renderRecent(); if (modalOpen && modalId) openDetail(modalId, null, { noPush: true, noHash: true }); } return ok; },
  setToday: (d) => { todayStr = d; win = winMode === 'all' ? windowAll() : window24(todayStr); renderRecent(); renderAll(); if (modalOpen && modalId) openDetail(modalId, null, { noPush: true, noHash: true }); }
};
(function () {
const params = new URLSearchParams(location.search);
if (params.get('test') === '1') {
const testItem = { id: '__test', type: 'file', t: { zh: '更晚事件', en: '[TEST DATA] Later event'}, jur: 'EU',
prod: { zh: '测试', en: 'Test'}, roles: null, basis: { inst: 'TEST', art: '—'},
stage: { zh: '测试', en: 'Test'}, app: { zh: '测试', en: 'Test'}, appStatus: 'pending',
ev: [{ id: 't1', type: 'application', nat: 'firm', prec: 'day', d: '2040-06-01', lbl: { zh: '测试节点', en: 'Test node'}, src: []}],
src: [], ver: { checked: '2026-10-24', verified: null, note: { zh: '测试数据', en: 'Test data'}},
act: null, rel: [], note: { zh: '测试数据，不属于正式法规记录。', en: 'Test data, not part of formal records.'}, hist: [],
next: { d: '2040-06-01', nat: 'firm', zh: '测试节点', en: 'Test node'}, disp: { child: false, hidden: false}};
/* 注意：testItem 故意不设 cat，验收“状态待核验”回退徽章；注入进泳道后重建 DISPLAYED 并重算窗口（A-03 修复） */
byId.__test = testItem;
SECTIONS[0].lanes[0].items.push('__test');
buildDisplayed();
win = windowAll();
renderAll();
const b = $('#banner'); b.textContent = '测试数据模式：已注入 2040-06-01 测试事件，仅用于验收 A-03／A-05／A-09，不属于正式法规记录。';
b.classList.add('show');
}
})();

/* ============ 初始化 ============ */
renderRecent();
renderAll();
(function () {
const m = location.hash.match(/^#item\/([A-Za-z0-9_-]+)$/);
if (m) openDetail(m[1], null, { noPush: true, noHash: true});
})();
</script>
</body>
</html>
