<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>!function(){try{var m=localStorage.getItem("lca-watch-theme");if(m==="dark"||m==="light")document.documentElement.classList.add("force-"+m)}catch(e){}}();</script>
<script>!function(){try{if(localStorage.getItem("lca-lang")==="en")document.documentElement.classList.add("lang-en")}catch(e){}}();</script>
<title>法规监控 · LCA 瞭望</title>
<style>
/* 法规时间轴全景 v15 预览：日报视觉语言，白底 / 深蓝 / 青色，细灰线，无卡片嵌套。 */
:root{
  --ink:#0f2841; --accent:#00bebe; --accent-text:#087f80;
  --body:#54585a; --muted:#747b83; --line:#e4e4e6; --subtle:#f4f6f8;
  --active:#e9f6f5; --warm-bg:#faebdc; --warm-text:#84552d;
  --amber:#c77414; --danger:#9b2c2c;
  --surface:#fff; --panelbg:#f7f9fb; --edge:#d5d8db; --bandline:#e9ebed;
  --themelin:#d8dce0; --tick:#c9ced3; --dash:#9aa1a8; --minor:#a8adb3; --onaccent:#fff;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--surface);color:var(--body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;padding-top:64px;transition:padding-top .3s ease}
body.tb-compact{padding-top:46px}
button{font-family:var(--font)}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.page{max-width:1360px;margin:0 auto;padding:0 36px 48px}

/* ===== 顶栏（与主站一致；顶栏所需变量定义在 .topbar 自身作用域内，不碰全局 :root）===== */
.topbar{--primary:#0f2841;--seg-bg:#F1F3F5;--seg-on:#FFFFFF;--card:#FFFFFF;--gray:#8D8D8F;
  position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:28px;
  padding:0 28px;height:64px;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  transition:height .3s ease}
.topbar.tb-compact{height:46px}
.topbar.tb-compact .tb-logo img{height:22px}
.topbar.tb-compact .tb-nav{transform:translate(-50%,-50%) scale(.87)}
.topbar.tb-compact .tb-theme .theme-switch{transform:scale(.66)}
.tb-logo{display:flex;align-items:center;text-decoration:none;line-height:0}
.tb-logo img{height:32px;width:auto;display:block;transition:height .3s ease}
.tb-logo .logo-dark{display:none}
html:has(.theme-switch input[value="dark"]:checked) .tb-logo .logo-light{display:none}
html:has(.theme-switch input[value="dark"]:checked) .tb-logo .logo-dark{display:block}
@media (prefers-color-scheme:dark){
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .tb-logo .logo-light{display:none}
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .tb-logo .logo-dark{display:block}
}
html.force-dark .tb-logo .logo-light{display:none}
html.force-dark .tb-logo .logo-dark{display:block}
html.force-light .tb-logo .logo-light{display:block}
html.force-light .tb-logo .logo-dark{display:none}
.tb-nav{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);display:flex;gap:2px;
  background:var(--seg-bg);border-radius:999px;padding:3px;transition:transform .3s ease}
.tb-nav a{position:relative;z-index:1;padding:8px 20px;border-radius:999px;font-size:15px;color:var(--gray);
  text-decoration:none;font-weight:500;white-space:nowrap;transition:color .25s}
.tb-nav a:hover{color:var(--body)}
.tb-nav a.on{color:var(--primary)}
.tb-pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--seg-on);
  box-shadow:0 1px 3px rgba(0,0,0,.10);z-index:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.3,1.25,.5,1),width .34s cubic-bezier(.3,1.25,.5,1)}
.tb-theme{display:flex;align-items:center;margin-left:auto}
.tb-theme .theme-switch{transform:scale(.82);transform-origin:right center;margin:0;transition:transform .3s ease}
.tb-search{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--gray);cursor:pointer;flex:none}
.tb-search:hover{color:var(--primary);border-color:var(--primary)}
.tb-search svg{width:18px;height:18px}
.lang-switch{position:relative;display:flex;align-items:center;border:1px solid var(--line);border-radius:18px;padding:2px;background:transparent;cursor:pointer;flex:none}
.lang-switch .thumb{position:absolute;top:2px;left:2px;width:calc(50% - 2px);height:calc(100% - 4px);background:var(--primary);border-radius:16px;z-index:0;pointer-events:none}
html.lang-ready .lang-switch .thumb{transition:transform .25s ease}
.lang-switch label{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-width:38px;height:32px;padding:0 10px;font-size:13px;font-weight:600;color:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.lang-switch label span{position:relative;z-index:1}
.lang-switch input{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.lang-switch input:checked + span{color:#fff}
.lang-switch:has(input[value="zh"]:checked) .thumb{transform:translateX(0)}
.lang-switch:has(input[value="en"]:checked) .thumb{transform:translateX(100%)}
html.lang-en .lang-switch .thumb{transform:translateX(100%)}
html:has(.theme-switch input[value="dark"]:checked) .lang-switch label{color:#c8d2e0}
html:has(.theme-switch input[value="dark"]:checked) .lang-switch input:checked+span{color:#0f2841}
@media (prefers-color-scheme:dark){
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .lang-switch label{color:#c8d2e0}
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .lang-switch input:checked+span{color:#0f2841}
}
html.force-dark .lang-switch label{color:#c8d2e0}
html.force-dark .lang-switch input:checked+span{color:#0f2841}
.theme-switch{display:inline-flex;background:var(--seg-bg);border-radius:999px;padding:3px;gap:2px;position:relative}
.theme-switch label{flex:0 0 auto;cursor:pointer;position:relative;z-index:1}
.theme-switch input{position:absolute;opacity:0;pointer-events:none;width:0}
.theme-switch label span{display:flex;align-items:center;justify-content:center;width:36px;height:30px;
  border-radius:999px;color:var(--gray);transition:color .2s}
.theme-switch label span svg{width:16px;height:16px;display:block}
.theme-switch label:hover span{color:var(--primary)}
.theme-switch input:checked+span{color:var(--primary)}
.theme-switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.theme-switch .thumb{position:absolute;top:3px;left:3px;width:36px;height:30px;background:var(--seg-on);
  border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:0;pointer-events:none;
  transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
.theme-switch:has(input[value="light"]:checked) .thumb{transform:translateX(0)}
.theme-switch:has(input[value="auto"]:checked) .thumb{transform:translateX(38px)}
.theme-switch:has(input[value="dark"]:checked) .thumb{transform:translateX(76px)}
html.force-dark .theme-switch .thumb{transform:translateX(76px)}
html.force-light .theme-switch .thumb{transform:translateX(0)}
@media(max-width:900px){
  .topbar{gap:8px;padding:0 10px;overflow:hidden}
  .tb-logo{flex:none}
  .tb-logo img{height:26px}
  .tb-nav{position:relative;left:auto;top:auto;transform:scale(1);margin:0;flex:1 1 auto;min-width:0;max-width:calc(100vw - 130px);overflow-x:auto;scrollbar-width:none;transition:transform .3s ease}
  .tb-nav::-webkit-scrollbar{display:none}
  .topbar.tb-compact .tb-nav{transform:scale(.87)}
  .tb-nav a{padding:6px 12px;font-size:14px;flex:none}
  .tb-theme{flex:none;margin-left:0}
  .tb-nav.hscroll{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
}
@media (prefers-reduced-motion:reduce){
  .tb-pill{transition:none}
  .tb-nav{transition:none}
  .topbar,.tb-logo img,.tb-theme .theme-switch{transition:none}
}
/* 顶栏搜索浮层（站内搜索，见 JS） */
.search-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.search-ov.on{display:flex}
.search-box{width:100%;max-width:560px;background:var(--surface);border-radius:16px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.2);border:1px solid var(--line)}
.search-box input{width:100%;border:none;outline:none;padding:16px 20px;font-size:16px;
  background:transparent;color:var(--ink)}
.search-res{max-height:50vh;overflow-y:auto;padding:8px}
.search-res a{display:block;padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--ink)}
.search-res a:hover{background:var(--subtle)}
.search-res .rt{font-size:14.5px;font-weight:600;line-height:1.5}
.search-res .rm{font-size:12.5px;color:var(--muted);margin-top:2px}
.search-res .empty{padding:20px;text-align:center;color:var(--minor);font-size:14px}
/* 搜索命中高亮 */
.node.search-hit .dot,.rangebar.search-hit{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}
.exp-item.search-hit{background:var(--active)}

/* 法规入口（下拉选择，替代横排页签） */
.lawsel-wrap{display:flex;align-items:center;gap:10px;margin:18px 0 0}
.lawsel-label{font-size:14px;color:var(--muted);white-space:nowrap}

/* 法规标题区（下拉框已显示法规名，不再重复大标题） */
.lawhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:14px 0 4px;flex-wrap:wrap}
.lawhead .doc{font-size:14px;color:var(--muted)}
.lawhead .doc .docstatus{color:var(--accent-text)}
.lawhead .doc .docstatus.unverified{color:var(--warm-text)}
.lawhead .meta{font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:4px}
.warnbar{margin:14px 0 0;padding:10px 14px;background:var(--warm-bg);color:var(--warm-text);font-size:13px;border-radius:4px}
.contextline{margin:10px 0 0;font-size:13px;color:var(--muted)}

/* 控件 */
.controls{display:flex;gap:12px;margin:18px 0 6px;flex-wrap:wrap}
.pillselect{appearance:none;border:1px solid var(--edge);background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%2354585a' fill='none' stroke-width='1.4'/></svg>") no-repeat right 12px center;border-radius:999px;padding:8px 32px 8px 16px;font-size:14px;color:var(--ink);cursor:pointer}
.pillselect:hover{border-color:var(--accent)}
.controls .hint{font-size:12px;color:var(--muted);align-self:center}
.window-note{display:none;margin:8px 0 0;font-size:13px;color:var(--warm-text)}
.window-note.show{display:block}
.window-note button{margin-left:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent-text);border-radius:999px;padding:3px 12px;font-size:12px;cursor:pointer}

/* 时间轴 */
.tl-wrap{margin-top:14px;position:relative}
.tl-scroll{overflow-x:auto}
.tl{min-width:880px;position:relative;--labelw:200px}
.tl-obsrow{position:relative;height:38px;margin-left:var(--labelw)}
.obs-pill{position:absolute;top:0;background:var(--accent);color:var(--onaccent);font-size:11px;line-height:1.25;padding:5px 9px;border-radius:4px;text-align:center;white-space:nowrap;z-index:4}
.obsline{position:absolute;top:38px;bottom:0;left:calc(var(--labelw) + (100% - var(--labelw)) * var(--obsx, 0));width:0;border-left:2px dashed var(--accent);pointer-events:none;z-index:0}
.tl-axis{position:relative;height:34px;margin-left:var(--labelw);border-bottom:1px solid var(--line)}
.tl-axis .tick{position:absolute;top:0;transform:translateX(-50%);font-size:12px;color:var(--muted);padding-top:6px}
.tl-axis .tick::after{content:"";position:absolute;left:50%;top:26px;width:1px;height:6px;background:var(--tick)}
.tl-axis .tick.minor{color:var(--minor)}
.theme{border-bottom:1px solid var(--themelin);padding-bottom:10px;--lane-bg:var(--surface)}
.theme.alt{background:var(--surface);--lane-bg:var(--surface)}
.theme-row{display:grid;grid-template-columns:var(--labelw) 1fr;align-items:center}
.theme-label{padding:10px 16px 10px 0;color:var(--ink);display:flex;flex-direction:column;justify-content:center;background:var(--lane-bg)}
@media (max-width:768px){
  .theme-label{position:sticky;left:0;z-index:5;box-shadow:8px 0 8px -8px rgba(15,40,65,.18)}
}
.theme-label .tname{font-size:16px;font-weight:700;line-height:1.3}
.theme-label .tsub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.theme-label .tsub .rule{color:var(--accent-text)}
.theme-label .subname{font-size:12px;color:var(--muted);line-height:1.4;padding:2px 0}
.theme-label .subname.on{color:var(--ink);font-weight:600}
.expand-btn{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink);cursor:pointer}
.expand-btn:hover{border-color:var(--accent)}
.expand-btn .plus{display:inline-block;width:16px;height:16px;border:1px solid currentColor;border-radius:50%;line-height:14px;text-align:center;font-size:12px}
.track{position:relative}
.band{position:relative;border-top:1px solid var(--bandline);display:flex;align-items:center}
.band:first-child{border-top:0}
.band .noterow,.band .emptyrow{flex:1}
.node{position:absolute;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;background:none;border:0;padding:0;cursor:pointer;z-index:2}
.node .dot{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.node.cond .dot{width:11px;height:11px;background:var(--surface);border:2px solid var(--amber);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.node.plan .dot{width:11px;height:11px;background:var(--surface);border:2px solid var(--muted);border-radius:50%}
.node:hover .dot,.node:focus-visible .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.node .nlabel{position:absolute;left:32px;top:50%;transform:translateY(-50%);text-align:left;white-space:nowrap;background:var(--surface);padding:2px 6px;border-radius:3px}
.node:hover .nlabel,.node:focus-visible .nlabel{background:var(--active)}
.node .nlabel .d{font-size:11px;color:var(--muted);line-height:1.3}
.node .nlabel .t{font-size:13px;color:var(--ink);line-height:1.35;font-weight:600}
.node .nlabel .pre{display:block;font-size:11px;line-height:1.35;color:var(--accent-text);font-weight:500;margin-top:1px}
.node .nlabel .t .badge{font-size:10px;font-weight:400;color:var(--warm-text);background:var(--warm-bg);border-radius:3px;padding:1px 4px;margin-left:4px;white-space:nowrap}
.node .nlabel .go,.rangebar .rlabel .go{color:var(--accent-text);font-weight:700}
.node .nlabel.flip{left:auto;right:32px;text-align:right}
.rangebar{position:absolute;top:50%;transform:translateY(-50%);height:8px;border-radius:4px;z-index:1;cursor:pointer}
.rangebar.firm{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.rangebar.plan{background:repeating-linear-gradient(90deg,var(--surface) 0 6px,var(--accent) 6px 12px);border:1px dashed var(--accent);height:10px}
.rangebar.period{background:color-mix(in srgb,var(--ink) 18%,transparent);border:1px dashed var(--dash)}
.rangebar .rlabel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;background:var(--surface);padding:2px 6px;border-radius:3px}
.rangebar:hover .rlabel,.rangebar:focus-visible .rlabel{background:var(--active)}
.rangebar .rlabel .d{font-size:11px;color:var(--muted)}
.rangebar .rlabel .t{font-size:13px;color:var(--ink);font-weight:600}
.rangebar .rlabel .t .badge{font-size:10px;font-weight:400;color:var(--warm-text);background:var(--warm-bg);border-radius:3px;padding:1px 4px;margin-left:4px}
/* 沿革与依据：竖排列表（最早在上）。节点标识按日期落在主时间轴同一刻度（--mx，与主泳道共用 frac），
   标签贴在标识旁、按剩余空间自动换边（.r 在右、.l 在左）；无日期行与窄屏（≤768px）回落为对齐列表。 */
.theme-row.exp-row{align-items:start;position:relative;z-index:1;background:var(--lane-bg)}
.theme-row.exp-row .theme-label{justify-content:flex-start;padding-top:14px}
.exp-list{display:flex;flex-direction:column;padding:4px 0}
.exp-item{position:relative;display:block;width:100%;height:36px;text-align:left;background:none;border:0;padding:0;cursor:pointer;border-radius:4px}
.exp-item:hover,.exp-item:focus-visible{background:var(--active)}
.exp-mark{position:absolute;left:var(--mx);top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.exp-mark.cond{width:11px;height:11px;background:var(--surface);border:2px solid var(--amber);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.exp-mark.plan{width:11px;height:11px;background:var(--surface);border:2px solid var(--muted)}
.exp-mark.period{width:11px;height:11px;background:var(--surface);border:1px dashed var(--dash)}
.exp-range{position:absolute;left:var(--mx1);width:calc(var(--mx2) - var(--mx1));top:50%;transform:translateY(-50%);height:8px;border-radius:4px}
.exp-range.firm{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.exp-range.plan{background:repeating-linear-gradient(90deg,var(--surface) 0 6px,var(--accent) 6px 12px);border:1px dashed var(--accent);height:10px}
.exp-range.period{background:color-mix(in srgb,var(--ink) 18%,transparent);border:1px dashed var(--dash)}
.exp-label{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;max-width:380px;overflow:hidden;white-space:nowrap;background:var(--surface);padding:2px 6px;border-radius:3px}
.exp-label.r{left:calc(var(--mx) + 14px);text-align:left}
.exp-label.l{right:calc(100% - var(--mx) + 14px);text-align:right}
.exp-label .exp-date{flex:0 0 auto;font-size:11px;color:var(--muted);line-height:1.3}
.exp-label .exp-title{font-size:13px;color:var(--ink);line-height:1.35;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.exp-label .exp-title .badge{font-size:10px;font-weight:400;color:var(--warm-text);background:var(--warm-bg);border-radius:3px;padding:1px 4px;margin-left:4px;white-space:nowrap}
.exp-label .exp-go{flex:0 0 auto;color:var(--accent-text);font-weight:700}
/* 无日期事件：固定对齐行 */
.exp-item.static{display:flex;align-items:center;gap:10px;padding:7px 8px;height:auto}
.exp-item.static .exp-mark{position:static;transform:none;flex:0 0 auto}
.exp-item.static .exp-label{position:static;transform:none;max-width:none;flex:1}
@media (max-width:768px){
  /* 窄屏轨道太窄，节点不按日期横向定位，回落为对齐列表 */
  .exp-list .exp-item{display:flex;align-items:center;gap:10px;padding:7px 8px;height:auto}
  .exp-list .exp-item .exp-mark,.exp-list .exp-item .exp-range{position:static;transform:none;flex:0 0 auto;left:auto;width:12px}
  .exp-list .exp-item .exp-range{width:22px}
  .exp-list .exp-item .exp-label{position:static;transform:none;max-width:none;flex:1}
}
.noterow{display:flex;align-items:center;gap:10px;min-height:76px}
.noterow .notetext{font-size:13px;color:var(--ink)}
.noterow .notetext button{appearance:none;background:none;border:0;padding:0;color:var(--accent-text);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.emptyrow{display:flex;align-items:center;min-height:76px;color:var(--muted);font-size:13px}
.nodate-row{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 0 10px;font-size:12px;color:var(--muted)}
.nodate-item .nodate-mark{color:var(--muted)}
.nodate-item button{appearance:none;background:none;border:0;padding:0;color:var(--accent-text);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* 图例与页脚 */
.legend{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--muted)}
.legend .li{display:inline-flex;align-items:center;gap:7px}
.legend .sw-dot{width:11px;height:11px;border-radius:50%;background:var(--ink);display:inline-block}
.legend .sw-dia{width:10px;height:10px;background:var(--surface);border:2px solid var(--amber);border-radius:2px;transform:rotate(45deg);display:inline-block}
.legend .sw-pln{width:10px;height:10px;background:var(--surface);border:2px solid var(--muted);border-radius:50%;display:inline-block}
.legend .sw-rng{width:26px;height:0;border-top:2px dashed var(--accent);display:inline-block}
.legend .sep{color:var(--edge)}
.legend .right{margin-left:auto;text-align:right}

/* 行内详情面板：展开在所属主题下方，手机端为底部浮层 */
.detail-panel{position:relative;z-index:1;margin:0;border-top:1px solid var(--line);background:var(--panelbg);border-left:3px solid var(--accent);padding:16px 20px 20px;font-size:14px}
.detail-panel .dp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-panel .kicker{font-size:12px;color:var(--accent-text)}
.detail-panel h2{margin:4px 0 0;font-size:19px;line-height:1.35;color:var(--ink)}
.detail-panel .dp-close{appearance:none;background:var(--surface);border:1px solid var(--edge);border-radius:50%;width:32px;height:32px;font-size:16px;line-height:1;color:var(--body);cursor:pointer;flex:none}
.detail-panel .dp-head-right{display:flex;align-items:center;gap:10px;flex:none}
.status-tag{font-size:12px;font-weight:700;line-height:1;padding:7px 11px;border-radius:999px;white-space:nowrap}
.status-tag.st-done{background:var(--accent);color:var(--onaccent)}
.status-tag.st-pending{background:var(--subtle);color:var(--muted)}
.status-tag.st-draft{background:var(--warm-bg);color:var(--warm-text)}
.status-tag.st-cond{background:transparent;color:var(--accent-text);border:1px solid var(--accent)}
.detail-panel .dp-body{max-width:860px}
.detail-panel .kv{display:grid;grid-template-columns:86px 1fr;gap:4px 12px;margin:14px 0}
.detail-panel .kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.detail-panel .kv dd{margin:0;color:var(--ink)}
.detail-panel .kv dd .tag{display:inline-block;font-size:11px;border-radius:3px;padding:1px 6px;margin-left:6px;background:var(--subtle);color:var(--muted)}
.detail-panel .kv dd .tag.warn{background:var(--warm-bg);color:var(--warm-text)}
.detail-panel h3{font-size:13px;color:var(--ink);margin:18px 0 6px}
.detail-panel blockquote.quote{margin:6px 0 0;padding:12px 14px;background:var(--subtle);border-left:3px solid var(--accent);font-size:13px;line-height:1.65;color:var(--ink)}
.detail-panel blockquote.quote p{margin:0}
.detail-panel blockquote.quote cite{display:block;margin-top:8px;font-size:12px;color:var(--muted);font-style:normal}
.detail-panel .qnote{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.detail-panel .noquote{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
.detail-panel p{margin:0 0 10px}
.detail-panel .long{max-height:96px;overflow:hidden;position:relative}
.detail-panel .long.open{max-height:none}
.detail-panel .more{appearance:none;background:none;border:0;padding:0;color:var(--accent-text);font-size:13px;cursor:pointer}
.detail-panel ul.srcs{margin:6px 0 0;padding-left:18px}
.detail-panel ul.srcs li{margin-bottom:6px}
.detail-panel ul.srcs a{word-break:break-all}
.detail-panel .verify{margin-top:16px;padding:10px 12px;background:var(--subtle);border-radius:4px;font-size:12px;color:var(--muted)}
.detail-panel .verify b{color:var(--ink)}
.detail-panel .verify .warn{color:var(--warm-text)}

/* 手机 */
@media (max-width:768px){
  .page{padding:0 16px 40px}
  .lawsel-wrap{margin-top:14px}
  .lawhead{margin-top:14px}
  .lawhead .meta{white-space:normal}
  .tl-scroll{margin:0 -16px;padding:0 16px}
  .tl{--labelw:150px}
  .theme-label{padding:8px 10px 8px 0}
  .theme-label .tname{font-size:15px}
  .detail-panel{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78vh;overflow-y:auto;background:var(--surface);box-shadow:0 -8px 24px rgba(15,40,65,.16);border-left:0;border-top:3px solid var(--accent)}
  .legend .right{margin-left:0;text-align:left}
}

/* ===== 深色主题（与主站同机制：手动深色 / 跟随系统且系统深色）=====
   时间轴变量在 :root 层重定义；顶栏变量在 .topbar 作用域内重定义。 */
html:has(.theme-switch input[value="dark"]:checked), html.force-dark{
  --ink:#edf1f6; --accent:#33d6d6; --accent-text:#33d6d6;
  --body:#a9b3c0; --muted:#8b96a5; --line:#233142; --subtle:#16202e;
  --active:#1b3a5c; --warm-bg:#17222f; --warm-text:#e0a866;
  --amber:#e8a13c; --danger:#e07878;
  --surface:#0d141f; --panelbg:#141e2c; --edge:#2b3c55; --bandline:#233142;
  --themelin:#233142; --tick:#5d6a7d; --dash:#5d6a7d; --minor:#5d6a7d; --onaccent:#0d141f;
  color-scheme:dark;
}
html:has(.theme-switch input[value="dark"]:checked) .topbar, html.force-dark .topbar{
  --primary:#dce8f7; --seg-bg:#1a2434; --seg-on:#2b3c55; --card:#141e2c; --gray:#8b96a5;
}
html:has(.theme-switch input[value="dark"]:checked) .pillselect, html.force-dark .pillselect{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23a9b3c0' fill='none' stroke-width='1.4'/></svg>");
}
@media (prefers-color-scheme:dark){
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked){
    --ink:#edf1f6; --accent:#33d6d6; --accent-text:#33d6d6;
    --body:#a9b3c0; --muted:#8b96a5; --line:#233142; --subtle:#16202e;
    --active:#1b3a5c; --warm-bg:#17222f; --warm-text:#e0a866;
    --amber:#e8a13c; --danger:#e07878;
    --surface:#0d141f; --panelbg:#141e2c; --edge:#2b3c55; --bandline:#233142;
    --themelin:#233142; --tick:#5d6a7d; --dash:#5d6a7d; --minor:#5d6a7d; --onaccent:#0d141f;
    color-scheme:dark;
  }
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .topbar{
    --primary:#dce8f7; --seg-bg:#1a2434; --seg-on:#2b3c55; --card:#141e2c; --gray:#8b96a5;
  }
  html:not(.force-light):has(.theme-switch input[value="auto"]:checked) .pillselect{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23a9b3c0' fill='none' stroke-width='1.4'/></svg>");
  }
}

...]. The carbon footprint declaration shall apply from: (a) 18 February 2025 or 12 months after the date of entry into force either of the delegated act or of the implementing act [...] whichever is the latest, for electric vehicle batteries [...].", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17", "note": "18 February 2025 is a floor, not a fixed date: the declaration applies from the later of that date and 12 months after entry into force of the methodology delegated act / format implementing act."}}, {"key": "cf2", "label": "绩效等级", "article": "Art 7(2)", "roles": "投放欧盟市场的经济运营者", "byCategory": {"ev": {"base": "2026-08-18", "deps": [{"act": "等级委托法案", "offset": 18}, {"act": "标签实施法案", "offset": 18}]}, "ind": {"base": "2027-08-18", "deps": [{"act": "等级委托法案", "offset": 18}, {"act": "标签实施法案", "offset": 18}]}, "lmt": {"base": "2030-02-18", "deps": [{"act": "等级委托法案", "offset": 18}, {"act": "标签实施法案", "offset": 18}]}, "ind-ext": {"base": "2032-02-18", "deps": [{"act": "等级委托法案", "offset": 18}, {"act": "标签实施法案", "offset": 18}]}}, "rule": "法定基准日、等级委托法案与标签实施法案两者较晚生效后 18 个月，取最晚。", "status": "规则已核验；配套法案实时状态待核验", "verifyNote": "2026-11-17 一手核验：Art 7(2) 等级委托法案仍为草案，未通过；实际适用日待配套法案生效后确定。", "detail": "等级划分依赖 Art 7(1) 方法学先行，是碳足迹三步中的第二步。待等级法案出台后，按等级阈值准备产品碳足迹分级数据与标签信息。", "sources": ["S01"], "quote": {"ref": "Art 7(2), Regulation (EU) 2023/1542", "text": "Electric vehicle batteries, rechargeable industrial batteries with a capacity greater than 2 kWh and LMT batteries shall bear a conspicuous, clearly legible and indelible label indicating the carbon footprint of the battery [...] and declaring the carbon footprint performance class to which the relevant battery model per manufacturing plant corresponds. [...] The carbon footprint performance class requirements in the first subparagraph shall apply from: (a) 18 August 2026 or 18 months after the date of entry into force either of the delegated act or of the implementing act [...] whichever is the latest, for electric vehicle batteries [...].", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}, {"key": "cf3", "label": "最高阈值", "article": "Art 7(3)", "roles": "投放欧盟市场的经济运营者", "byCategory": {"ev": {"base": "2028-02-18", "deps": [{"act": "阈值委托法案", "offset": 18}]}, "ind": {"base": "2029-02-18", "deps": [{"act": "阈值委托法案", "offset": 18}]}, "lmt": {"base": "2031-08-18", "deps": [{"act": "阈值委托法案", "offset": 18}]}, "ind-ext": {"base": "2033-08-18", "deps": [{"act": "阈值委托法案", "offset": 18}]}}, "rule": "法定基准日与阈值委托法案生效后 18 个月取最晚；仅委托法案，无实施法案分支。", "status": "规则已核验；配套法案实时状态待核验", "verifyNote": "2026-11-17 一手核验：Art 7(3) 阈值委托法案仍为草案，未通过；实际适用日待配套法案生效后确定。", "detail": "超过阈值不得投放市场。阈值增加的是量化上限要求；申报、标签等其他要求的合规效力依各自法条与适用条件分别判断。", "sources": ["S01"], "quote": {"ref": "Art 7(3), Regulation (EU) 2023/1542", "text": "For electric vehicle batteries, rechargeable industrial batteries with a capacity greater than 2 kWh and LMT batteries, the technical documentation [...] shall demonstrate that the declared life cycle carbon footprint value for the relevant battery model per manufacturing plant, is below the maximum threshold established in the delegated act adopted pursuant to the third subparagraph. The requirement for a maximum life cycle carbon footprint threshold [...] shall apply as of: (a) 18 February 2028 or 18 months after the date of entry into force of the delegated act referred to in the third subparagraph, whichever is the latest, for electric vehicle batteries [...].", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}], "expand": {"label": "沿革与依据", "groups": [{"label": "方法学草案与咨询", "events": [{"id": "cf-jrc-ev", "itemId": "cf1", "kind": "firm", "prec": "month", "date": "2023-06-01", "from": null, "to": null, "label": "JRC 方法草案", "title": "JRC 碳足迹方法草案（EV 电池）2023 年 6 月", "status": null, "article": "JRC CFB-EV", "scope": null, "conditions": null, "detail": "JRC《电动汽车电池碳足迹计算规则》（CFB-EV）最终草案，2023 年 6 月；2021 年第四季度至 2023 年第二季度利益相关方工作成果，是 Art 7 EV 方法学的依据。标题页标注 Final draft 2023，月份取自文件记录。", "badge": null, "verified": "2026-11-17", "verifyNote": "JRC 报告 PDF 已读；月份精度，不写具体日", "sources": ["X01"], "cats": ["ev"], "quote": {"ref": "Abstract, JRC CFB-EV, Final draft, June 2023", "text": "This report provides the methodological guidelines for calculating the Carbon Footprint of batteries (CFB). It is based on the Environmental Footprint (EF) method developed by the European Commission (as in EC Recommendations 2279/2021) and Product Environmental Footprint Categories Rules for Batteries (PEFCR), and it provides detailed guidelines on methodological choices, modelling approaches, and documentation and verification requirements for the CFB. This work is supposed to provide the basis for the enforcement of requirements as in Article 7 of the Battery Regulation Proposal, supplementing the Regulation by establishing the methodology for calculation and verification of the carbon footprint of batteries.", "url": "https://eplca.jrc.ec.europa.eu/permalink/battery/GRB-CBF_CarbonFootprintRules-EV_June_2023.pdf", "verified": "2026-11-17", "note": "JRC technical report, not a legal article."}}, {"id": "cf-da-consult", "itemId": "cf1", "kind": "period", "prec": "day", "date": null, "from": "2024-04-30", "to": "2024-05-28", "label": "方法学草案咨询", "title": "Art 7 方法学委托法案草案公开咨询（2024-04-30–2024-05-28）", "status": null, "article": "Ares(2024)3131389", "scope": null, "conditions": null, "detail": "Art 7(1) 方法学委托法案草案公开咨询，倡议 13877；草案至今未通过、无 OJ 编号。", "badge": null, "verified": "2026-11-17", "verifyNote": "EUR-Lex 草案页与咨询期已核验", "sources": ["X03"], "cats": ["ev"], "quote": {"ref": "Annex, s.2 (Calculation rules), Draft delegated regulation, Ares(2024)3131389", "text": "The carbon footprint of electric vehicle batteries shall be calculated as the amount of CO2-equivalent emitted during the life cycle stages of the battery that are within the system boundary, expressed in kilogram (‘kg’) CO2-equivalent, divided by the total amount of energy provided by the battery over the battery’s service life determined in accordance with section 2.1. It shall be reported in kg CO2-equivalent/kilowatt-hour (‘kWh’) with a resolution of 0,001 kg CO2-equivalent/kWh.", "url": "https://www.qualenergia.it/wp-content/uploads/2024/05/allegato-1.pdf", "verified": "2026-11-17", "note": "Draft delegated act, not adopted. Art 1 itself is only 21 words ('The methodology for the calculation and verification of the carbon footprint of electric vehicle batteries is laid down in the Annex.'), so the operative calculation rule from Annex s.2 is quoted instead. Text obtained via a mirror copy of Ares(2024)3131389; the EUR-Lex PIN page showed only the initiative summary.", "showNote": true}}, {"id": "cf-fmt-da", "itemId": "cf1", "kind": "firm", "prec": "day", "date": "2024-04-29", "from": null, "to": null, "label": "申报格式草案", "title": "Art 7 碳足迹申报格式实施条例草案（Ares(2024)3131449）", "status": null, "article": "Ares(2024)3131449", "scope": null, "conditions": null, "detail": "Art 7(1) 碳足迹申报格式实施条例草案，倡议 13878；与方法学草案 Ares(2024)3131389（HYS 13877）同期；草案至今未通过，处于部际磋商。Art 7(1) 申报义务的生效取决于方法学与格式两件法案中较晚的一件。", "badge": null, "verified": "2026-11-20", "verifyNote": "HYS 倡议页核验（2026-11-20）", "sources": ["X12"], "cats": ["ev"]}, {"id": "cf-jrc-ind-draft", "itemId": "cf1", "kind": "firm", "prec": "month", "date": "2024-06-01", "from": null, "to": null, "label": "JRC 工业电池方法草案", "title": "JRC 工业电池碳足迹方法草案 2024 年 6 月", "status": null, "article": "JRC CFB-IND", "scope": null, "conditions": null, "detail": "JRC 工业电池碳足迹方法草案 2024 年 6 月传阅，作为第二次利益相关方咨询的依据；见 CFB-IND 正式报告内文。", "badge": null, "verified": "2026-11-17", "verifyNote": "CFB-IND 报告内文载明；月份精度，不写具体日", "sources": ["X02"], "cats": ["ind", "ind-ext"], "quote": {"ref": "Abstract, JRC141282, Calculating the carbon footprint of industrial batteries (final report, 2025-04-11)", "text": "This report provides the methodological guidelines for calculating the carbon footprint of industrial batteries (CFB-IND), providing the basis for the enforcement of requirements as in Article 7 of Regulation (EU) 2023/1542 (Batteries Regulation), establishing the methodology for calculation and verification of the carbon footprint of batteries. The present report is targeting industrial batteries with exclusively internal storage and with an energy storage capacity >2 kWh.", "url": "https://publications.jrc.ec.europa.eu/repository/handle/JRC141282", "verified": "2026-11-17", "note": "JRC technical report, not a legal article. The June 2024 draft itself was not opened separately; the final report states it 'is based on the previous JRC draft report that was distributed in June 2024 as a basis for a second stakeholder consultation', so the final report's aim/scope sentence is given for both keys."}}, {"id": "cf-jrc-ind", "itemId": "cf1", "kind": "firm", "prec": "day", "date": "2025-04-11", "from": null, "to": null, "label": "JRC 工业电池方法报告", "title": "JRC 工业电池碳足迹方法报告（JRC141282）", "status": null, "article": "JRC CFB-IND", "scope": null, "conditions": null, "detail": "JRC《工业电池碳足迹计算：方法学支持》（JRC141282，EUR 40286），针对可充电工业电池（>2kWh，内部储能）；报告日期 2025-04-11，2025-05-28 公开发布。", "badge": null, "verified": "2026-11-17", "verifyNote": "Publications Office 记录与 JRC 新闻核验", "sources": ["X02"], "cats": ["ind", "ind-ext"], "quote": {"ref": "Abstract, JRC141282, Calculating the carbon footprint of industrial batteries (final report, 2025-04-11)", "text": "This report provides the methodological guidelines for calculating the carbon footprint of industrial batteries (CFB-IND), providing the basis for the enforcement of requirements as in Article 7 of Regulation (EU) 2023/1542 (Batteries Regulation), establishing the methodology for calculation and verification of the carbon footprint of batteries. The present report is targeting industrial batteries with exclusively internal storage and with an energy storage capacity >2 kWh.", "url": "https://publications.jrc.ec.europa.eu/repository/handle/JRC141282", "verified  6/9/10/12/13/14 → Module A (Part A, internal production control, series production) or Module G (Part B, unit verification). Art 17(3) (re-use/repurposing/remanufacturing, Module A) is paraphrased in the audit report, not quoted verbatim."}}]}]}}, {"key": "recycled", "label": "再生材料", "sub": "申报看生效触发，最低值看固定日", "events": [{"id": "rc-decl", "itemId": "rc", "kind": "cond", "prec": "day", "date": "2028-08-18", "from": null, "to": null, "label": "申报基准", "title": "申报基准", "status": "Art 8 规则已核验：申报为生效触发、最低值为固定日；方法学委托法案草案 Ares(2026)7823470 仍未通过，法定通过日 2026-08-18 已逾期；HYS 14858 咨询已截止（70 条反馈），Commission adoption 原计划 2026-Q3 已过（页面未更新）", "article": "Art 8(1)", "scope": "工业电池 >2kWh（排除仅外部储能）、EV 电池、SLI 电池", "conditions": "法定基准日 2028-08-18 或方法学委托法案生效后 24 个月，取较晚者；方法学委托法案须 2026-08-18 前通过（已逾期，草案仍未通过）", "detail": "钴／锂／镍按活性物质中回收份额，铅按电池中回收份额；文件按每个电池型号、每年、每个制造工厂提供。2026-11-23 一手核验：Art 8 方法学委托法案草案 Ares(2026)7823470 仍为草案，未通过；HYS 14858 咨询已截止（2026-08-12 至 2026-09-09）、70 条反馈，Commission adoption 原计划 2026-Q3 已过仍未通过。实际申报起始日因“取较晚者”机制必然晚于 2028-08-18。", "badge": null, "verified": "2026-11-23", "verifyNote": "2026-11-23 一手核验：Art 8 方法学委托法案草案仍为草案，未通过；HYS 14858 反馈 70 条", "roles": "投放欧盟市场的经济运营者", "sources": ["S01"], "pre": "前置：方法学 DA +24月", "cats": ["ev", "ind"], "quote": {"ref": "Art 8(1), Regulation (EU) 2023/1542", "text": "From 18 August 2028 or 24 months after the date of entry into force of the delegated act referred to in the third subparagraph, whichever is the latest, [...] electric vehicle batteries [...] that contain cobalt, lead, lithium or nickel in active materials, shall be accompanied by documentation containing information about the percentage share of cobalt, lithium or nickel [...] that has been recovered from battery manufacturing waste or post-consumer waste, and the percentage share of lead [...] that has been recovered from waste, for each battery model per year and per manufacturing plant. [...] The first subparagraph shall apply from 18 August 2033 to LMT batteries that contain cobalt, lead, lithium or nickel in active materials.", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}, {"id": "rc-min31", "itemId": "rc", "kind": "firm", "prec": "day", "date": "2031-08-18", "from": null, "to": null, "label": "最低含量", "title": "最低含量", "status": "Art 8 规则已核验：申报为生效触发、最低值为固定日；方法学委托法案草案 Ares(2026)7823470 仍未通过，法定通过日 2026-08-18 已逾期；HYS 14858 咨询已截止（70 条反馈），Commission adoption 原计划 2026-Q3 已过（页面未更新）", "article": "Art 8(2)", "scope": "工业、EV、SLI 电池（LMT 除外）", "conditions": null, "detail": "2031-08-18 起适用最低再生含量。", "badge": null, "verified": "2026-11-23", "verifyNote": "规则已核验；方法学委托法案实时状态待复核", "roles": "投放欧盟市场的经济运营者", "sources": ["S01"], "cats": ["ev", "ind"], "quote": {"ref": "Art 8(2), Regulation (EU) 2023/1542", "text": "From 18 August 2031, for industrial batteries with a capacity greater than 2 kWh, except those with exclusively external storage, electric vehicle batteries and SLI batteries that contain cobalt, lead, lithium or nickel in active materials, the technical documentation [...] shall demonstrate that those batteries contain, in active materials, the following minimum percentage share of, respectively, cobalt, lithium or nickel that has been recovered from battery manufacturing waste or post-consumer waste, and the minimum percentage share of lead that is present in the battery and that has been recovered from waste, for each battery model per year and per manufacturing plant: (a) 16 % cobalt; (b) 85 % lead; (c) 6 % lithium; (d) 6 % nickel.", "url": "https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng", "verified": "2026-11-17"}}, {"id": "rc-lmt-decl", "itemId": "rc", "kind": "firm", "prec": "day", "date": "2033-08-18", "from": null, "to": null, "label": "LMT 申报", "title": "LMT 申报", "status": "Art 8 规则已核验：申报为生效触发、最低值为固定日；方法学委托法案草案 Ares(2026)7823470 仍未通过，法定通过日 2026-08-18 已逾期；HYS 14858 咨询已截止（70 条反馈），Commission adoption 原计划 2026-Q3 已过（页面未更新）", "article": "Art 8(1)", "scope": "LMT 电池", "conditions": "固定申报日，不套用触发式计算。", " 期进行中", "article": "Art 36(2)", "scope": null, "conditions": null, "detail": "从“只申报”到“申报＋交钱”的分水岭；首年覆盖 2026 年进口。证书价常规为 EU ETS 拍卖收盘价每周均价（Art 21(1)），但 2026 年排放对应的是进口季度均价（Art 21(1a)）。2026-01-01 起适用的条款范围为 Art 36(2)(b) 所列（Art 2(2)、2a、4、6–9、10a、15、19、21、22(1)(3)、23–27、31）；Art 22(2) 季末持证义务自 2027-01-01 起适用，Art 20 开售自 2027-02-01 起适用。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 合并文本 Art 21/36 核验（2026-11-24 审计）", "roles": "授权申报人", "sources": ["S27"], "quote": {"ref": "Art 36(2), Regulation (EU) 2023/956", "text": "It shall apply from 1 October 2023. However: (a) Articles 5, 10, 14, 16 and 17 shall apply from 31 December 2024; (b) [...] Articles 2a, 4, 6 to 9, 10a, 15, 19 and 21, Article 22(1) and 22(3) and Articles 23 to 27 and 31 shall apply from 1 January 2026", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020", "verified": "2026-11-17", "note": "Consolidated text 20.10.2025 (documentation tool, no legal effect). The [...] omits 'Article 2(2) and' in point (b). The transitional application from 1 October 2023 is in the same Art 36(2) sentence."}}, {"id": "cr-eif", "itemId": "cbamrev", "kind": "firm", "prec": "day", "date": "2025-10-20", "from": null, "to": null, "label": "简化修订生效", "title": "简化修订生效", "status": "已生效", "article": "Regulation (EU) 2025/2083", "scope": null, "conditions": null, "detail": "50 吨／年门槛取代逐票价值门槛：豁免约 90% 进口商、覆盖约 99% 排放；电力与氢不设门槛。2025-10-08 签署，OJ 2025-10-17，2025-10-20 生效。超门槛后对全年全部进口货物的排放承担义务（Art 2a(2)，追溯悬崖）；未超门槛者须在报关单中声明豁免（Art 2a(1) 末句）。门槛每年 4 月 30 日前复核，测算值偏离现行门槛超 15 吨才调（Art 2a(3)，见 cbam-threshold-review）。间接海关代表须始终先取得授权（Art 5(1a)(2)）。执行机制：欧委会与主管机关定期自动交换监测信息，含超过门槛 90% 的进口商名单（Art 25a(1)）；海关不得放行非授权申报人的进口（Art 25(1)）；对超门槛决定的上诉无中止效力（Art 25a(3)）。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 原文页核验；Art 2a/5/25/25a 经合并文本核验（2026-11-24 审计）", "roles": "进口商", "sources": ["S20", "S27"], "quote": {"ref": "Art 1(2) inserting Art 2a(1), Annex VII point 1, and Art 2, Regulation (EU) 2025/2083", "text": "An importer, including any importer with the status of an authorised CBAM declarant, shall be exempted from the obligations under this Regulation, where the net mass of the imported goods in a given calendar year does not cumulatively exceed the single mass-based threshold laid down in point 1 of Annex VII (the “single mass-based threshold”). The single mass-based threshold referred to in Article 2a shall be set at 50 tonnes of net mass. This Regulation shall enter into force on the third day following that of its publication in the Official Journal of the European Union.", "url": "https://eur-lex.europa.eu/eli/reg/2025/2083/oj/eng", "verified": "2026-11-17", "note": "The operative text says 'third day following publication'; 20 October 2025 is derived from the OJ date 17.10.2025 and is not stated in the article. Recital (2) records the old EUR 150 per-consignment derogation as insufficient, but the operative replacement is the mass-based threshold."}}, {"id": "cbam-threshold-review", "itemId": "cbam-note", "kind": "plan", "prec": "day", "date": "2027-04-30", "from": null, "to": null, "label": "50 吨门槛年度复核", "title": "50 吨门槛年度复核（每年 4 月 30 日前；测算值偏离超 15 吨才调）", "status": null, "article": "Art 2a(3)", "scope": null, "conditions": null, "detail": "Art 2a(3)：每年 4 月 30 日前，欧委会须评估单一质量门槛是否仍只覆盖 ≤1% 的进口货物嵌入排放；测算值偏离现行门槛超 15 吨才以授权法案修门槛，修后自下一年度 1 月 1 日起适用。首次复核 2026-04-30 已过，下次 2027-04-30。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 合并文本 Art 2a(3) 原文核验（2026-11-24 审计）；kind 映射：审计建议 recurring，数据模型无此取值，落为 plan，年度复核写进 detail", "sources": ["S27"], "quote": {"ref": "Art 2a(3), Regulation (EU) 2023/956", "text": "By 30 April of each calendar year, the Commission shall assess … whether the single mass-based threshold ensures that paragraph 1 … applies to no more than 1 % of the emissions embedded in the imported goods … The Commission shall adopt delegated acts … where the value of the resulting threshold deviates from the applicable threshold by more than 15 tonnes. The amended … threshold shall apply from 1 January of the following calendar year.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020", "verified": "2026-11-25", "note": "每年 4 月 30 日前评估；测算值偏离现行门槛超 15 吨才修门槛，修后自下一年度 1 月 1 日起适用。"}}, {"id": "cbam-auth", "itemId": "cbam-note", "kind": "firm", "prec": "day", "date": "2024-12-31", "from": null, "to": null, "label": "授权申报人制度", "title": "授权 CBAM 申报人制度：只有授权申报人可进口（2024-12-31 起适用）", "status": null, "article": "Art 5／Art 17", "scope": null, "conditions": null, "detail": "Art 4：货物仅可由授权 CBAM 申报人进口到欧盟关税区。Art 5(1)：在成员国设立的进口商须在进口前申请授权申报人身份；Art 36(2)(a)：Art 5/10/14/16/17 自 2024-12-31 起适用，即授权申请通道开启日。授权授予前主管机关可咨询其他主管机关或欧委会，咨询不得超过 15 个日历日（Art 17(1)）；申请前两个财政年度未全程设立的，须提供担保，担保在申报人交证的第二年 9 月 30 日后立即释放（Art 17(5)(7)）；授权申报人可委托第三方提交申报，责任仍在申报人（Art 5(7a)）。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 合并文本 Art 4/5/17 原文核验（2026-11-24 审计）；kind 映射：审计建议未单列 kind，本事件为已生效义务，落为 firm；A2 的担保／咨询／撤销子要求已并入本事件详情，不单立 cbam-auth-guarantee", "sources": ["S27"], "quote": {"ref": "Art 5(1) and Art 4, Regulation (EU) 2023/956", "text": "Any importer established in a Member State shall, prior to importing goods into the customs territory of the Union, apply for the status of authorised CBAM declarant. Goods shall be imported into the customs territory of the Union only by an authorised CBAM declarant.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020", "verified": "2026-11-25", "note": "Art 4 原文为 'only by an authorised CBAM declarant'；Art 36(2)(a) 规定 Art 5/10/14/16/17 自 2024-12-31 起适用。"}}, {"id": "cbam-auth-mar31", "itemId": "cbam-note", "kind": "firm", "prec": "day", "date": "2026-03-31", "from": null, "to": null, "label": "临时进口申请截止", "title": "临时进口申请截止（2026-03-31）：此前提交申请者可临时继续进口", "status": null, "article": "Art 17(7a)", "scope": null, "conditions": null, "detail": "Art 17(7a)：2026-03-31 前按 Art 5 提交申请的进口商或间接海关代表，在主管机关作出决定前可临时继续进口。拒绝时，主管机关须在决定之日起 1 个月内按缺省值 n.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020", "verified": "2026-11-25", "note": "Art 26(2)：非授权申报人违规进口，罚款为 Art 26(1) 罚款的 'from three to five times'，每证计。"}}, {"id": "cbam-2498", "itemId": "cbam-note", "kind": "firm", "prec": "day", "date": "2026-11-16", "from": null, "to": null, "label": "已付碳价抵扣", "title": "第三国已付碳价抵扣实施条例 (EU) 2026/2498", "status": "已发布、2026-11-19 生效、追溯适用于 2026-01-01 起排放、首次适用 2027-09-30 前申报", "article": "(EU) 2026/2498", "scope": null, "conditions": null, "detail": "2026-11-05 签署，2026-11-16 在 OJ 发布（OJ:L_202602498）；Art 36：公布后第 3 天生效（2026-11-19），自 2026-01-01 起适用；落实母法 Art 9，规定第三国已付碳价折算为应交证书扣减、证据与独立核查要求；《巴黎协定》第六条国际信用仅计入且封顶 10%；附件二已列入中国全国碳市场（OJ PDF 核验 L4498，清单非穷尽）。", "badge": null, "verified": "2026-11-18", "verifyNote": "OJ 原文核验", "sources": ["X09"]}, {"id": "cbam-default-carbon-price", "itemId": "cbam-note", "kind": "plan", "prec": "day", "date": "2027-01-01", "from": null, "to": null, "label": "缺省碳价", "title": "缺省碳价：自 2027 年起欧委会可为有碳定价规则的第三国确定并公布", "status": null, "article": "Art 9(4)", "scope": null, "conditions": null, "detail": "Art 9(4)：自 2027 年起，欧委会可为有碳定价规则的第三国确定缺省碳价并在 CBAM 登记册公布，及测算方法。按缺省值确定排放时，抵扣只能按缺省碳价主张。这是 (EU) 2026/2498 实际已付碳价抵扣之外的另一条平行路径。", "badge": null, "verified": "2026-11-25", "verifyNote": "EUR-Lex 合并文本 Art 9(4) 原文核验（2026-11-24 审计）", "sources": ["S27"], "quote": {"ref": "Art 9(4), Regulation (EU) 2023/956", "text": "As from 2027, the Commission may, for third countries where carbon pricing rules are in place, determine and make available, in the CBAM registry …, the default carbon prices for those third countries and publish the methodology for their calculation.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020", "verified": "2026-11-25", "note": "按缺省值确定排放时，抵扣只能按缺省碳价主张；这是 (EU) 2026/2498 实际已付碳价抵扣之外的另一条平行路径。"}}, {"id": "cbam-trans", "itemId": "cbam-note", "kind": "period", "prec": "month", "date": null, "from": "2023-10-01", "to": "2025-12-31", "label": "过渡期（仅申报）", "title": "过渡期 2023-10–2025-12", "status": null, "article": null, "scope": null, "conditions": null, "detail": "过渡期只申报不交证。每季度进口者须在季度结束后 1 个月内提交 CBAM 报告（Art 35(1)）；未提交或未纠正报告的，主管机关须处以有效、适度、有威慑力的罚款（Art 35(5)）。外发加工产品与退运货物不适用过渡期报告义务（Art 34(2)）。过渡期最后一季（2025-Q4）报告截止日为 2026-01-31。", "badge": null, "verified": "2026-11-25", "verifyNote": "Art 32 原文核验（2026-11-23）：过渡期 2023-10-01–2025-12-31，义务限于 Art 33–35 申报义务；Art 34/35 经合并文本核验（2026-11-24 审计）", "sources": ["S27"], "quote": {"ref": "Art 36(2), Regulation (EU) 2023/956", "text": "It shall apply from 1 October 2023. However: (a) Articles 5, 10, 14, 16 and 17 shall apply from 31 December 2024; (b) [...] Articles 2a, 4, 6 to 9, 10a, 15, 19 and 21, Article 22(1) and 22(3) and Articles 23 to 27 and 31 shall apply from 1 January 2026", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020", "verified": "2026-11-17", "note": "Consolidated text 20.10.2025 (documentation tool, no legal effect). The [...] omits 'Article 2(2) and' in point (b). The transitional application from 1 October 2023 is in the same Art 36(2) sentence."}}, {"id": "cbam-eea", "itemId": "cbam-note", "kind": "firm", "prec": "day", "date": "2026-11-18", "from": null, "to": null, "label": "扩展至冰岛与挪威", "title": "CBAM 扩展至冰岛与挪威：EEA 联合委员会决定 283/2026 生效（2026-11-18），2027-01-01 起适用", "status": "已生效（2026-11-18）；2027-01-01 起适用于挪威与冰岛", "article": "EEA JC Decision 283/2026", "scope": null, "conditions": null, "detail": "EEA 联合委员会决定 283/2026 将 (EU) 2023/956 纳入 EEA 协定，于 2026-11-18 生效；CBAM 自 2027-01-01 起适用于挪威与冰岛进口货物（列支敦士登除外）；挪威/冰岛核查员注册自 2026-12-01 起。50 吨年门槛按 EU＋挪威＋冰岛累计计算。背景：冰岛、挪威此前因列入附件 III 第 1 点而豁免，决定 283/2026 的实质是将其纳入适用范围（附件 III 名单本身待核）。", "badge": null, "verified": "2026-11-25", "verifyNote": "欧委会税收与海关总司新闻页直读；Art 2(4) 豁免背景经合并文本核验（2026-11-24 审计），附件 III 名单本身未直读原文，待核", "sources": ["X45"]}, {"id": "cbam-cjeu", "itemId": "cbam-note", "kind": "firm", "prec": "day", "date": "2026-11-12", "from": null, "to": null, "label": "CJEU 驳回波兰撤销之 PC0564 核验", "sources": ["X06"], "quote": {"ref": "Art 1(1)-(2), COM(2021) 564", "text": "1. This Regulation establishes a carbon border adjustment mechanism (the ‘CBAM’) for addressing greenhouse gas emissions embedded in the goods referred to in Annex I, upon their importation into the customs territory of the Union, in order to prevent the risk of carbon leakage. 2. The CBAM complements the system established for greenhouse gas emission allowance trading within the Union by Directive 2003/87/EC by applying an equivalent set of rules to imports into the customs territory of the Union of goods referred to in Article 2.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52021PC0564", "verified": "2026-11-17", "note": "Proposal, not adopted law."}}, {"id": "cbam-eif", "itemId": "cbam-note", "kind": "firm", "prec": "day", "date": "2023-05-17", "from": null, "to": null, "label": "母法生效", "title": "Regulation (EU) 2023/956 生效", "status": null, "article": "(EU) 2023/956", "scope": null, "conditions": null, "detail": "2023-05-10 签署／通过，OJ L 130（2023-05-16），2023-05-17 生效；过渡期自 2023-10-01 起适用，正式期 2026-01-01 起。", "badge": null, "verified": "2026-11-17", "verifyNote": "OJ 文本核验", "sources": ["S27"], "quote": {"ref": "Art 36(1) and (2), Regulation (EU) 2023/956", "text": "This Regulation shall enter into force on the day following that of its publication in the Official Journal of the European Union. It shall apply from 1 October 2023. This Regulation shall be binding in its entirety and directly applicable in all Member States.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020", "verified": "2026-11-17", "note": "Entry into force is the day following publication, NOT the twentieth day. The 'shall be binding' sentence is included only to reach the 40-word minimum; it is verbatim Art 36 closing text."}}]}]}}, {"key": "certificates", "label": "证书购买", "events": [{"id": "cbam-cert-da", "itemId": "cert", "kind": "firm", "prec": 28-09-30 前出台。", "badge": null, "verified": "2026-11-17", "verifyNote": "EUR-Lex 原文核验", "sources": ["S21"], "quote": {"ref": "Art 6(7) and 6(8), Regulation (EU) 2026/1738", "text": "By 30 September 2028, the Commission shall adopt a delegated act [...] establishing a minimum share of steel recycled from post-consumer steel waste and, where relevant, ferrous scrap to be present in and incorporated into vehicle types [...]. That delegated act shall also set the date of application of the obligation to have a minimum share of recycled content no later than 14 August 2033. [...] By 30 September 2028 the Commission shall adopt a delegated act [...] establishing a minimum share of recycled aluminium and its alloys [...] to be present in and incorporated into vehicle types [...]. That delegated act shall also set the date of application [...] no later than 14 August 2033.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-17", "note": "Steel is Art 6(7) and aluminium is Art 6(8) — not 6(6)/(7) as expected (6(6) is the delegated-act power for temporary derogations to the plastic targets). The 30 September 2028 deadline and the 14 August 2033 latest application date are confirmed for both materials. Each paragraph is preceded by a feasibility assessment due by 30 September 2027."}}, {"id": "elv-steel-alu-feas", "itemId": "elv", "kind": "plan", "prec": "day", "date": "2027-09-30", "from": null, "to": null, "label": "钢／铝可行性评估·2027-09-30", "title": "钢/铝再生含量可行性评估节点（2027-09-30）", "status": "计划；评估须于 2027-09-30 前完成", "article": "Art 6(7)／Art 6(8)", "scope": null, "conditions": null, "detail": "2027-09-30 前欧委会须评估钢/铝再生含量目标与方法的可行性；每种材料各两项授权法案（目标＋方法学）均须 2028-09-30 前出台（JRC 研究预计 2026-Q4 呈现）。", "badge": null, "verified": "2026-11-20", "verifyNote": "EUR-Lex OJ 原文 Art 6(7)/(8) 核验", "sources": ["S21"]}], "expand": {"label": "沿革与依据", "groups": [{"label": "立法提案", "events": [{"id": "elv-prop", "itemId": "elv", "kind": "firm", "prec": "day", "date": "2023-07-13", lastic contained in each new vehicle type that is type-approved as from 1 September 2032 under Regulation (EU) 2018/858 shall contain a minimum of 15 % of plastic recycled by weight from post-consumer plastic waste. The plastic contained in each new vehicle type that is type-approved as from 1 September 2036 under Regulation (EU) 2018/858 shall contain a minimum of 25 % of plastic recycled by weight from post-consumer plastic waste. At least 20 % of the target set out in paragraph 1 shall be achieved by including in the vehicle type concerned plastics recycled from end-of-life vehicles or from parts and components removed from vehicles during the use phase. The weight of the plastic contained in each new vehicle type concerned and the weight of recycled plastic referred to in paragraphs 1 and 2 shall exclude elastomers from tyres and from thermosets other than polyurethane foams used for cushioning. The Commission shall be empowered to adopt delegated acts in accordance with Article 51 to supplement paragraphs 1 and 2 of this Article by laying down temporary derogations to the recycled plastic content targets, or timing in the event that lack of availability or excessive prices of specific recycled plastics make compliance with the minimum percentages of recycled content excessively difficult.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-17", "note": "15% / 2032 and 25% / 2036 confirmed; the 20% end-of-life-vehicle sub-target is Art 6(2), included in full. Art 6(3) weight exclusions and Art 6(6) temporary-derogation power added 2026-11-24."}}, {"id": "elv-pl25", "itemId": "elv", "kind": "firm", "prec": "day", "date": "2036-09-01", "from": null, "to": null, "label": "新车型 25%", "title": "新车型再生塑料含量 25%（2036-09-01 起型式批准）", "status": null, "article": "Art 6(1)", "scope": "2036-09-01 起型式批准的新车型", "conditions": null, "detail": "每辆自 2036-09-01 起型式批准的新车型，其塑料须含至少 25% 消费后再生塑料（按重量）。", "badge": null, "verified": "2026-11-17", "verifyNote": " thodologies applicable to plastics recycling in line with the definition of recycling in Directive 2008/98/EC.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-17", "note": "First subparagraph of Art 6(5) only; the paragraph goes on to require mass-balance accounting for non-mechanical recycling and third-country installation audits (applying from 14 August 2030). Mass-balance sentence for non-mechanical recycling added 2026-11-24."}}, {"id": "elv-pl-src", "itemId": "elv", "kind": "plan", "prec": "day", "date": "2030-08-14", "from": null, "to": null, "label": "再生料来源地·2030-08-14", "title": "再生塑料来源地要求：2030-08-14 前仅限欧盟境内回收装置，此后第三国装置须符合附件 XIII", "status": null, "article": "Art 6(4)／Art 6(5)", "scope": null, "conditions": null, "detail": "Art 6(4)：塑料目标（Art 6(1)–(3)）所用再生料须为消费后废弃物，且在欧盟境内装置回收；自 2030-08-14 起，第三国装置所产再生料也可计入，条件是该装置符合附件 XIII。附件 XIII 要求：遵守所在国环保法规、安全环保运营、废塑料来自成员国或环境与劳工保护标准与欧盟相当的国家、建立防减健康安全与环境风险的管理监测体系、全程可追溯、节能限排、近 5 年废弃物管理记录、运营者近 5 年无废弃物管理违法定罪；且须证明所供材料为消费后再生料、与消费前料或原生料明确区分，报废车辆来源料须单独收集、全程可追溯。制造商须确保所用每个第三国装置符合附件 XIII，并至少每 5 年接受一次独立第三方审计（附件 XIV：审计方须独立、具备资质、持 ISO 19011:2018 或 ISO/IEC 17020:2012 等认证）；审计与附件 XIII 要求自 2030-08-14 起适用（Art 6(5)）。", "badge": null, "verified": "2026-11-24", "verifyNote": "EUR-Lex OJ 原文核验（2026-11-24）：Art 6(4)/(5) 与附件 XIII、XIV 直读", "sources": ["S21"], "quote": {"ref": "Art 6(4) and 6(5), Regulation (EU) 2026/1738", "text": "For the purposes of the obligations laid down in paragraphs 1, 2, and 3, recycled content shall be recovered from post-consumer waste, which has been recycled either in: (a) an installation located in the Union; or (b) from 14 August 2030, an installation located in a third country, provided that such installation meets the requirements of Annex XIII. The verification methodology shall include an obligation for manufacturers to ensure that each installation located in a third country producing recycled content material that they are using complies with Annex XIII, and that each such installation located in a third country is being audited at least every five years by an independent third-party entity pursuant to Annex XIV. Those audits shall verify that the conditions set out in paragraphs 1 to 4 of this Article are met. The audit requirement set out in the third subparagraph of this paragraph and the requirements and criteria set out in Annex XIII for material recycled in third countries shall apply from 14 August 2030.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-24", "note": "Sourcing rule is scoped to the plastics obligations (Art 6(1)-(3)) only; the steel/aluminium/magnesium target delegated acts carry no corresponding sourcing clause in Art 6. Annex XIII Part A lists 8 installation criteria (national environmental law, safe/environmentally sound operation, waste from a Member State or equivalent-standard country, management/monitoring systems, traceability, energy saving and GHG limits, five-year records, no waste-management convictions in the last five years); Part B requires proof of post-consumer origin, clear distinction from pre-consumer/raw materials, and separate collection with full traceability for end-of-life-vehicle waste."}}, {"id": "elv-pl-trade", "itemId": "elv", "kind": "plan", "prec": "day", "date": "2028-09-30", "from": null, "to": null, "label": "贸易影响评估·2028-09-30", "title": "欧委会须于 2028-09-30 前评估再生塑料目标对全球贸易及欧盟回收与汽车产业的影响", "status": null, "article": "Art 6(4)", "scope": null, "conditions": null, "detail": "Art 6(4)：2028-09-30 前欧委会须就再生塑料含量目标对全球贸易以及欧盟回收与汽车产业的预期影响作更全面评估，并向欧洲议会和理事会报告。", "badge": null, "verified": "2026-11-24", "verifyNote": "EUR-Lex OJ 原文核验（2026-11-24）：Art 6(4) 直读", "sources": ["S21"], "quote": {"ref": "Art 6(4), Regulation (EU) 2026/1738", "text": "By 30 September 2028, the Commission shall more comprehensively assess the expected impact on global trade, as well as on the Union recycling and automotive industries and report its assessment to the European Parliament and to the Council.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-24", "note": "Assessment is on the plastics targets' expected impact; no separate deadline for any follow-up action."}}]}, {"key": "declaration", "label": "再生含量声明", "events": [{"id": "elv-decl-pl", "itemId": "elv", "kind": "plan", "prec": "day", "date": "2029-09-01", "from": null, "to": null, "label": "塑料声明·2029-09-01", "title": "塑料再生含量声明自 2029-09-01 起（方法学出台后 12 个月＋次月 1 日）", "status": null, "article": "Art 10(1)", "scope": "2029-09-01 起型式批准的新车型（仅 M1/N1）", "conditions": null, "detail": "Art 10(1)：制造商须对每个新车型申报五类材料的再生含量占比——电驱动电机永磁体中的钕／镝／镨／铽／钐／镍／钴／硼、铝及铝合金、镁及镁合金、钢及合金钢、塑料；各材料的声明义务按各自方法学出台日分别触发，塑料最先触发。触发日＝塑料计算核查方法实施法案（Art 6(5)，须 2028-08-31 前出台）出台后 12 个月再顺延到次月 1 日；按最晚出台日推算为 2029-09-01，实际以方法学真正出台日为准。声明须注明占比，重于 100 克的塑料件须注明是消费前再生料还是消费后再生料；型式批准机构核查申报文件（Art 10(2)）。Art 10(3)：塑料 15% 强制目标自 2032-09-01 起适用后，塑料声明义务不再适用。声明内容须载入数字循环车辆护照（Art 13(2)(c)）。", "badge": null, "verified": "2026-11-24", "verifyNote": "EUR-Lex OJ 原文核验（2026-11-24）：Art 10(1)–(3) 直读", "sources": ["S21"], "quote": {"ref": "Art 10(1) and 10(3), Regulation (EU) 2026/1738", "text": "Manufacturers shall declare, for each new vehicle type that is type-approved under Regulation (EU) 2018/858 as from the first day of the month following 12 months from the adoption of the respective methodologies for the calculation and verification of the share of the materials recycled from post-consumer waste in vehicle types, as referred to in Article 6 of this Regulation, the respective share of recycled content of: (a) neodymium, dysprosium, praseodymium, terbium, samarium, nickel, cobalt and boron in permanent magnets in e-drive motors; (b) aluminium and its alloys; (c) magnesium and its alloys; (d) steel and its alloys; (e) plastics. The declaration shall concern the recycled content of those materials present in the vehicle type and indicate, per material share, and for plastic components heavier than 100 grams, whether the material is recycled from pre-consumer waste or from post-consumer waste. By way of derogation from paragraph 1, the requirement to declare the share of recycled content of a certain material shall not apply where a target has become applicable for that material under Article 6.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-24", "note": "Declaration trigger is the first day of the month following 12 months from the adoption of the respective methodologies; plastics methodology (Art 6(5) implementing act) is due by 31 August 2028, so the plastics declaration starts 1 September 2029 if the methodology is adopted on the deadline. Art 10(3) ends the declaration for a material once its Art 6 target applies (plastics 15% from 1 September 2032)."}}, {"id": "elv-decl-steel-alu", "itemId": "elv", "kind": "plan", "prec": "day", "date": "2029-10-01", "from": null, "to": null, "label": "钢／铝声明·2029-10-01", "title": "钢／铝再生含量声明自 2029-10-01 起（方法学出台后 12 个月＋次月 1 日）", "status": null, "article": "Art 10(1)", "scope": "2029-10-01 起型式批准的新车型（仅 M1/N1）", "conditions": null, "detail": "Art 10(1)：制造商须对每个新车型申报钢及合金钢、铝及铝合金的再生含量占比。触发日＝两类计算核查方法授权法案（Art 6(7) 钢、Art 6(8) 铝，均须 2028-09-30 前出台）出台后 12 个月再顺延到次月 1 日；按最晚出台日推算为 2029-10-01，实际以方法学真正出台日为准。型式批准机构核查申报文件（Art 10(2)）。Art 10(3)：钢／铝强制目标授权法案适用后（适用日不晚于 2033-08-14），钢／铝声明义务不再适用。声明内容须载入数字循环车辆护照（Art 13(2)(c)）。", "badge": null, "verified": "2026-11-24", "verifyNote": "EUR-Lex OJ 原文核验（2026-11-24）：Art 10(1)–(3) 与 Art 6(7)/(8) 直读", "sources": ["S21"], "quote": {"ref": "Art 10(1) and 10(3), Regulation (EU) 2026/1738", "text": "Manufacturers shall declare, for each new vehicle type that is type-approved under Regulation (EU) 2018/858 as from the first day of the month following 12 months from the adoption of the respective methodologies for the calculation and verification of the share of the materials recycled from post-consumer waste in vehicle types, as referred to in Article 6 of this Regulation, the respective share of recycled content of the materials listed in that paragraph. By way of derogation from paragraph 1, the requirement to declare the share of recycled content of a certain material shall not apply where a target has become applicable for that material under Article 6.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-24", "note": "Full material list is quoted under elv-decl-pl. Steel and aluminium methodologies (Art 6(7)/(8) delegated acts) are due by 30 September 2028, so the steel/aluminium declaration starts 1 October 2029 if adopted on the deadline; it ends once the steel/aluminium target delegated acts apply (no later than 14 August 2033)."}}, {"id": "elv-decl-mg-mag", "itemId": "elv", "kind": "plan", "prec": "day", "date": "2030-10-01", "from": null, "to": null, "label": "镁／永磁声明·2030-10-01", "title": "镁及永磁材料再生含量声明自 2030-10-01 起（方法学出台后 12 个月＋次月 1 日）", "status": null, "article": "Art 10(1)", "scope": "2030-10-01 起型式批准的新车型（仅 M1/N1）", "conditions": null, "detail": "Art 10(1)：制造商须对每个新车型申报镁及镁合金、电驱动电机永磁体中钕／镝／镨／铽／钐／镍／钴／硼的再生含量占比。触发日＝Art 6(9) 计算核查方法授权法案（须 2029-09-30 前出台）出台后 12 个月再顺延到次月 1 日；按最晚出台日推算为 2030-10-01，实际以方法学真正出台日为准。型式批准机构核查申报文件（Art 10(2)）。Art 10(3)：镁／永磁强制目标授权法案适用后，相应声明义务不再适用（目标授权法案的适用日由该法案自定，无法规最晚日）。声明内容须载入数字循环车辆护照（Art 13(2)(c)）。", "badge": null, "verified": "2026-11-24", "verifyNote": "EUR-Lex OJ 原文核验（2026-11-24）：Art 10(1)–(3) 与 Art 6(9) 直读", "sources": ["S21"], "quote": {"ref": "Art 10(1) and 10(3), Regulation (EU) 2026/1738", "text": "Manufacturers shall declare, for each new vehicle type that is type-approved under Regulation (EU) 2018/858 as from the first day of the month following 12 months from the adoption of the respective methodologies for the calculation and verification of the share of the materials recycled from post-consumer waste in vehicle types, as referred to in Article 6 of this Regulation, the respective share of recycled content of the materials listed in that paragraph. By way of derogation from paragraph 1, the requirement to declare the share of recycled content of a certain material shall not apply where a target has become applicable for that material under Article 6.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-24", "note": "Full material list is quoted under elv-decl-pl. Magnesium/magnet-materials methodology (Art 6(9) delegated act) is due by 30 September 2029, so the magnesium/magnet declaration starts 1 October 2030 if adopted on the deadline; it ends once the corresponding target delegated act applies (its application date is set by that act, with no statutory latest date)."}}, {"id": "elv-mg-mag-feas", "itemId": "elv", "kind": "plan", "prec": "day", "date": "2029-08-31", "from": null, "to": null, "label": "镁／永磁可行性评估·2029-08-31", "title": "镁及永磁材料再生含量目标可行性评估须于 2029-08-31 前完成", "status": "计划；评估须于 2029-08-31 前完成", "article": "Art 6(9)", "scope": null, "conditions": null, "detail": "2029-08-31 前欧委会须评估镁及镁合金、电驱动电机永磁体中钕／镝／镨／铽／钐／镍／钴／硼的最低再生含量目标与方法的可行性；评估完成后欧委会被授权出台目标授权法案（目标法案本身无法定出台截止日，适用日由该法案自定）。计算核查方法授权法案须于 2029-09-30 前出台。", "badge": null, "verified": "2026-11-24", "verifyNote": "EUR-Lex OJ 原文核验（2026-11-24）：Art 6(9) 直读", "sources": ["S21"], "quote": {"ref": "Art 6(9), Regulation (EU) 2026/1738", "text": "By 31 August 2029, the Commission shall assess the feasibility of establishing a requirement on the minimum share of: (a) magnesium and its alloys, recycled from pre-consumer and post-consumer waste and present in and incorporated into vehicle types; and (b) neodymium, dysprosium, praseodymium, terbium, samarium, nickel, cobalt or boron recycled from post-consumer waste and, where relevant, pre-consumer waste, present in and incorporated into permanent magnets. After finalisation of the assessment referred to in the first subparagraph, the Commission is empowered to adopt a delegated act, in accordance with Article 51, to supplement this Regulation by establishing a minimum share of: (a) magnesium and its alloys, recycled from post-consumer waste and, where relevant, pre-consumer waste, present in and incorporated into vehicle types; and (b) neodymium, dysprosium, praseodymium, terbium, samarium, nickel, cobalt or boron recycled from post-consumer waste and, where relevant, pre-consumer waste, present in and incorporated into permanent magnets. The delegated act referred to in the third subparagraph shall also set the date of application of the obligation to have a minimum share of recycled content.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-24", "note": "No statutory deadline for the target delegated act itself, and no statutory latest application date (unlike steel/aluminium, capped at 14 August 2033)."}}, {"id": "elv-mg-mag-meth", "itemId": "elv", "kind": "plan", "prec": "day", "date": "2029-09-30", "from": null, "to": null, "label": "镁／永磁方法 DA·2029-09-30", "title": "镁及永磁材料计算核查方法授权法案须于 2029-09-30 前出台", "status": null, "article": "Art 6(9)", "scope": null, "conditions": null, "detail": "Art 6(9) 计算核查方法授权法案须于 2029-09-30 前出台，覆盖镁及镁合金、永磁体中钕／镝／镨／铽／钐／镍／钴／硼的再生含量占比计算与核查。该方法学出台日同时决定 Art 10(1) 镁／永磁声明的触发日（出台后 12 个月＋次月 1 日，按最晚出台日推算为 2030-10-01）。", "badge": null, "verified": "2026-11-24", "verifyNote": "EUR-Lex OJ 原文核验（2026-11-24）：Art 6(9) 直读", "sources": ["S21"], "quote": {"ref": "Art 6(9), Regulation (EU) 2026/1738", "text": "By 30 September 2029, the Commission shall adopt a delegated act, in accordance with Article 51, establishing the methodology for the calculation and verification of the share of the recycled materials referred to in the third subparagraph present in and incorporated into vehicle types.", "url": "https://eur-lex.europa.eu/eli/reg/2026/1738/oj/eng", "verified": "2026-11-24", "note": "This methodology's adoption date also sets the Art 10(1) declaration trigger for magnesium and magnet materials (12 months + first day of the following month; 1 October 2030 if adopted on the deadline)."}}]}, {"key": "producer", "label": "生产者责任", "events": [{"id": "elv-pr",
