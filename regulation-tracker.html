<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法规进展监控 · LCA瞭望 LCA RADAR</title>
<style>
  :root{
    --bg:#F4F6F8; --card:#FFFFFF; --ink:rgba(0,0,0,.88); --ink2:#54585A; --line:#E4E4E6;
    --steel:#0077B6; --link:#0077B6; --primary:#0A1E33; --accent:#00A9E0; --accent-deep:#0077B6; --alert:#c0392b;
    --chip-bg:#F1F3F5; --hover:#F4F6F8; --sel:#DCEFFA;
    --applied:#0A1E33; --applied-bg:#E4EAF0;
    --pending:#0077B6; --pending-bg:#DCEFFA;
    --consult:#a86a1b; --consult-bg:#FAEBDC;
    --awaited:#8D8D8F; --awaited-bg:#F1F3F5;
    --proposal:#8D8D8F;
    --today:#c0392b;
  }
  html[data-theme="dark"]{
    --bg:#0A1626; --card:#12233A; --ink:#edf1f6; --ink2:#a9b3c0; --line:#233142;
    --steel:#4DB8E8; --link:#4DB8E8; --primary:#DCEFFA; --accent:#4DB8E8; --accent-deep:#4DB8E8; --alert:#e0685c;
    --chip-bg:#1a2434; --hover:#16202e; --sel:#16324F;
    --applied:#DCEFFA; --applied-bg:#1B2F47;
    --pending:#4DB8E8; --pending-bg:#16324F;
    --consult:#e0a04e; --consult-bg:#3a2c14;
    --awaited:#8b96a5; --awaited-bg:#1a2434;
    --proposal:#8b96a5;
    --today:#e0685c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:1360px;margin:0 auto;padding:26px 22px 52px}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  h1{font-size:25px;margin:0;line-height:1.3}
  .sub{color:var(--ink2);font-size:13px;margin-top:4px}
  .toggles{display:flex;gap:8px}
  .toggles button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
  .toggles button.on{background:var(--steel);border-color:var(--steel);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:20px}
  /* legend = status filter + counts */
  .legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .lg{display:inline-flex;align-items:center;gap:6px;border:1.5px solid;border-radius:20px;padding:2px 11px;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent}
  .lg .n{font-weight:800}
  .lg.applied{color:var(--applied);border-color:var(--applied);background:var(--applied-bg)}
  .lg.pending{color:var(--pending);border-color:var(--pending);background:var(--pending-bg)}
  .lg.consult{color:var(--consult);border-color:var(--consult);background:var(--consult-bg)}
  .lg.awaited{color:var(--awaited);border-color:var(--awaited);background:var(--awaited-bg)}
  .lg.proposal{color:var(--proposal);border-color:var(--proposal);border-style:dashed}
  .lg.off{opacity:.35}
  .lg-hint{color:var(--ink2);font-size:12px;margin-left:4px}
  .win-tools{margin-left:auto;display:flex;gap:8px}
  .win-tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 12px;font-size:12.5px;cursor:pointer}
  .win-tools button.on{background:var(--steel);border-color:var(--steel);color:#fff}
  .scrollx{overflow-x:auto}
  svg text{font-family:inherit}
  /* detail */
  .detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
  .detail-grid .card{margin-top:0}
  .detail-grid h3{margin:0 0 2px;font-size:16.5px}
  .detail-grid .en{color:var(--ink2);font-size:12px;margin-bottom:10px}
  .pill{display:inline-block;font-size:12px;border-radius:20px;padding:1px 9px;border:1.5px solid;white-space:nowrap;font-weight:600}
  .pill.applied{color:var(--applied);border-color:var(--applied);background:var(--applied-bg)}
  .pill.pending{color:var(--pending);border-color:var(--pending);background:var(--pending-bg)}
  .pill.consult{color:var(--consult);border-color:var(--consult);background:var(--consult-bg)}
  .pill.awaited{color:var(--awaited);border-color:var(--awaited);background:var(--awaited-bg)}
  .pill.proposal{color:var(--proposal);border-color:var(--proposal);border-style:dashed}
  .slide-mark{display:inline-block;font-size:11px;color:var(--steel);border:1px solid var(--steel);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
  .kv{display:grid;grid-template-columns:104px 1fr;row-gap:8px;font-size:13.5px;border-bottom:1px dashed var(--line);padding-bottom:12px}
  .kv dt{white-space:nowrap}
  .mech{background:var(--sel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;line-height:1.65}
  .mech b{color:var(--primary)}
  .src{font-size:13px;margin-top:12px;line-height:1.8}
  .src b{color:var(--ink2);font-weight:600}
  .src a{color:var(--link)}
  .kv dt{color:var(--ink2)} .kv dd{margin:0}
  .note{font-size:13.5px;margin-top:10px}
  .nbr .row{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .nbr .row:last-child{border-bottom:none}
  .rel-chip{display:inline-block;background:var(--chip-bg);border:1px solid var(--line);border-radius:14px;padding:0 8px;font-size:12px;margin:1px 2px;cursor:pointer;color:var(--ink)}
  .rel-chip:hover{border-color:var(--steel);color:var(--steel)}
  .rel-chip .k{color:var(--ink2);margin-right:3px}
  .foot{color:var(--ink2);font-size:12.5px;margin-top:18px;line-height:1.75}
  .toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:var(--card);color:var(--ink2);padding:5px 13px;font-size:12.5px;cursor:pointer}
  .seg button.on{background:var(--steel);color:#fff}
  .seg-label{font-size:12px;color:var(--ink2);align-self:center;margin-right:2px}
  .vlegend{display:flex;gap:20px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-top:12px}
  .vl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
  .vl em{font-style:normal}
  .sh{display:inline-block;flex:none}
  .sh.dia{width:11px;height:11px;transform:rotate(45deg);background:var(--ink)}
  .sh.dia.hollow{background:var(--card);border:1.8px solid var(--ink)}
  .sh.bar{width:26px;height:9px;border-radius:5px;background:var(--ink);opacity:.75}
  .sh.bar.dashed{background:transparent;border:1.4px dashed var(--ink)}
  .sh.tline{width:0;height:16px;border-left:1.8px dashed var(--alert)}
  .sh.badge{background:var(--alert);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:7px;padding:1px 6px}
  .sh.tbc{font-style:normal;font-size:11px;border:1.4px solid var(--ink2);border-radius:10px;padding:1px 9px;color:var(--ink)}
  .sh.sub{font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 7px}
  .sh.sub.da{background:var(--pending-bg);color:var(--link)}
  .sh.sub.ia{background:var(--applied-bg);color:var(--applied)}
  .modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.5);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s}
  .modal-bg.open{opacity:1;visibility:visible}
  .modal{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);width:min(680px,calc(100% - 32px));max-height:86vh;overflow:auto;padding:22px 24px;transform:translateY(8px);transition:transform .2s ease}
  .modal-bg.open .modal{transform:translateY(0)}
  .modal-x{position:absolute;top:10px;right:12px;border:none;background:transparent;color:var(--ink2);font-size:19px;cursor:pointer;line-height:1;padding:4px 6px}
  .modal-x:hover{color:var(--ink)}
  .modal h3{margin:0 4px 2px 0;font-size:18px;padding-right:28px}
  .modal .en{color:var(--ink2);font-size:12px;margin-bottom:12px}
  .modal .rel-title{font-size:14.5px;font-weight:700;margin:18px 0 6px}
</style>
</head>

<div class="wrap">

    </div>
    <div class="scrollx" style="margin-top:10px"><svg id="chart" role="img" aria-label="swimlane roadmap"></svg></div>
  </div>

  <div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true">
    <button class="modal-x" id="modalX" aria-label="close">✕</button>
    <div id="modalDetail"></div>
    <div class="rel-title" data-zh="关联事项" data-en="Related items"></div>
    <div class="nbr" id="modalNbr"></div>
  </div></div>

  <div class="foot" data-zh="说明：空心菱形为原定或拟议日期，实际起算以子法规通过为准；「待通过」指子法规尚未通过。状态以 EUR-Lex 与欧委会为准，细节见各事项弹窗。"
       data-en="Notes: hollow diamonds are original or indicative dates; the actual start depends on the sub-act's adoption. 'Not yet adopted' means the sub-act is outstanding. EUR-Lex and the Commission prevail; see each item's popup for details."></div>
</div>

<script>
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function gel(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs){ const v=attrs[k];
  if(typeof v==='string' && v.indexOf('var(')>=0) e.style.setProperty(k,v); else e.setAttribute(k,v); } return e; }
function fillStatic(){ document.querySelectorAll('[data-zh]').forEach(e=>{ e.textContent=L.lang==='zh'?e.dataset.zh:(e.dataset.en||e.dataset.zh); }); document.title=L.lang==='zh'?'法规进展监控 · LCA瞭望 LCA RADAR':'Regulation Tracker · LCA RADAR';
  document.documentElement.lang=L.lang==='zh'?'zh-CN':'en'; }
function pill(st){ const s=ST[st]; return '<span class="pill '+s.cls+'">'+T(s)+'</span>'; }
/* legend with counts + filter */
let statusFilter=null;
function renderLegend(){
  const counts={}; ST_ORDER.forEach(s=>counts[s]=ITEMS.filter(i=>i.st===s&&!i.hidden).length);
  $('#legend').innerHTML = ST_ORDER.map(s=>'<button class="lg '+ST[s].cls+(statusFilter&&statusFilter!==s?' off':'')+'" data-s="'+s+'">'+T(ST[s])+' <span class="n">'+counts[s]+'</span></button>').join('')
    + '<span class="lg-hint">'+(L.lang==='zh'?'点状态筛选 · 点事项看详情':'Click a status to filter · click an item for details')+'</span>';
  $('#legend').querySelectorAll('.lg').forEach(b=>b.addEventListener('click',()=>{
    statusFilter = statusFilter===b.dataset.s? null : b.dataset.s;
    renderLegend(); renderChart();
  }));
}
/* chart */
const DAY=86400000, pd=s=>new Date(s+'T00:00:00Z').getTime(), TODAY=pd('2026-10-24');
let win={f:'2025-01-01',t:'2033-01-01'};
let selected=null, expanded=false;
const rowOf={};
function renderChart(){
  const svg=$('#chart'); svg.innerHTML='';
  const W=1240, labelW=172, subX=labelW+6, subW=62, tbcW=196, plotX=labelW+subW+8, plotW=W-plotX-tbcW-14, tbcX=W-tbcW-6;
  const SUB_STYLE={DA:{bg:'var(--pending-bg)',fg:'var(--link)'},IA:{bg:'var(--applied-bg)',fg:'var(--applied)'},'DA+IA':{bg:'var(--pending-bg)',fg:'var(--link)'}};
  const f=pd(win.f), t=pd(win.t), span=t-f;
  const X=d=> plotX + (pd(d)-f)/span*plotW;
  const rowH=27, secH=30, subH=24, secGap=14;
  const totalH=34 + SECTIONS.reduce((a,s)=>a+secH+s.lanes.reduce((b,l)=>{
    const its=l.items.map(id=>byId[id]).filter(Boolean);
    return b+subH+its.filter(i=>!i.u).length*rowH+its.filter(i=>i.u).length*rowH;
  },0)+secGap,0);
  svg.setAttribute('viewBox','0 0 '+W+' '+totalH);
  /* TBC zone backdrop */
  svg.appendChild(gel('rect',{x:tbcX-8,y:26,width:tbcW+2,height:totalH-34,fill:'var(--chip-bg)',rx:8,opacity:.55}));
  const tbh=gel('text',{x:tbcX+tbcW/2-4,y:20,'font-size':11.5,fill:'var(--ink2)','text-anchor':'middle','font-weight':700});
  tbh.textContent=L.lang==='zh'?'日期未定':'NO DATE YET'; svg.appendChild(tbh);
  svg.appendChild(gel('line',{x1:tbcX-8,y1:26,x2:tbcX-8,y2:totalH-8,stroke:'var(--line)','stroke-width':1,'stroke-dasharray':'3 4'}));
  /* year grid */
  for(let yr=2025;yr<=2032;yr++){
    const x=X(yr+'-01-01'); if(x<plotX||x>plotX+plotW) continue;
    svg.appendChild(gel('line',{x1:x,y1:26,x2:x,y2:totalH-8,stroke:'var(--line)','stroke-width':1}));
    const tx=gel('text',{x:x+4,y:16,'font-size':11.5,fill:'var(--ink2)'}); tx.textContent=yr; svg.appendChild(tx);
  }
  const subHtxt=gel('text',{x:subX+subW/2,y:16,'font-size':11,fill:'var(--ink2)','text-anchor':'middle','font-weight':700});
  subHtxt.textContent=L.lang==='zh'?'子法规':'Sub-act'; svg.appendChild(subHtxt);
  svg.appendChild(gel('line',{x1:plotX-4,y1:26,x2:plotX-4,y2:totalH-8,stroke:'var(--line)','stroke-width':1}));
  const todayX=X('2026-10-24');
  if(todayX>=plotX&&todayX<=plotX+plotW){
    svg.appendChild(gel('line',{x1:todayX,y1:26,x2:todayX,y2:totalH-8,stroke:'var(--today)','stroke-width':1.4,'stroke-dasharray':'5 4'}));
    const tt=gel('text',{x:todayX+5,y:31,'font-size':11,fill:'var(--today)','font-weight':700}); tt.textContent=L.lang==='zh'?'今天':'today'; svg.appendChild(tt);
  }
  let y=34;
  SECTIONS.forEach(sec=>{
    /* section band */
    svg.appendChild(gel('rect',{x:0,y:y,width:W,height:secH-4,fill:'var(--sel)',rx:7}));
    const st=gel('text',{x:10,y:y+17,'font-size':13.5,'font-weight':800,fill:'var(--ink)'});
    st.textContent=T(sec); svg.appendChild(st);
    y+=secH;
    sec.lanes.forEach(lane=>{
      const its=lane.items.map(id=>byId[id]).filter(Boolean);
      const rows=its.filter(i=>!i.u).concat(its.filter(i=>i.u));
      /* sub-lane header */
      const lt=gel('text',{x:10,y:y+16,'font-size':12.5,'font-weight':700,fill:'var(--steel)'});
      lt.textContent=T(lane); svg.appendChild(lt);
      if(lane.detail){
        lt.style.cursor='pointer';
        const ltip=document.createElementNS(NS,'title'); ltip.textContent=L.lang==='zh'?'点击看'+T(lane)+'详情':'Details of '+T(lane); lt.appendChild(ltip);
        lt.addEventListener('click',()=>select(lane.detail,true));
      }
      y+=subH;
      rows.forEach((it,ri)=>{
        const nk=rows.filter(r=>r.childOf===it.id).length;
        if(!it.childOf && nk){
          const last=rows.map((r,i)=>r.childOf===it.id?i:-1).filter(i=>i>=0).pop();
          svg.appendChild(gel('rect',{x:0,y:y+ri*rowH+1,width:W-2,height:(last-ri+1)*rowH-2,fill:'var(--chip-bg)',opacity:.65,rx:6,stroke:'var(--line)','stroke-width':1}));
          svg.appendChild(gel('line',{x1:52,y1:y+ri*rowH+rowH/2+8,x2:52,y2:y+last*rowH+rowH/2,stroke:'var(--ink2)','stroke-width':1.2,opacity:.55}));
        }
      });
      rows.forEach(it=>{
        const cy=y+rowH/2;
        const dimmed = statusFilter && it.st!==statusFilter;
        const g=gel('g',{opacity: dimmed?0.16:1, style:'cursor:pointer'});
        if(expanded && it.id===selected){
          g.appendChild(gel('rect',{x:0,y:y+1,width:W-2,height:rowH-2,fill:'var(--sel)',rx:6}));
        }
        const nk2=rows.filter(r=>r.childOf===it.id).length;
        const nm=gel('text',{x: it.childOf?46:labelW-8,y:cy+4,'font-size':11.5,fill: (expanded&&it.id===selected)?'var(--ink)':'var(--ink2)','text-anchor': it.childOf?'start':'end','font-weight': (expanded&&it.id===selected)?700:400});
        let label=T(it), cw=(L.lang==='zh'?11.5:6.4), maxW= it.childOf?118:labelW-16;
        if(nk2) label+= L.lang==='zh' ? '（'+nk2+' 项配套）' : ' ('+nk2+' more)';
        if(it.childOf) label='└ '+label;
        if(it.childOf){
          const wOf=t=>[...t].reduce((a,c)=>a+(/[^\x00-\xff]/.test(c)?11.5:6.4),0);
          while(label.length>2 && wOf(label)>maxW-8) label=label.slice(0,-1);
          if(wOf(label)>maxW-8) label=label.slice(0,-1)+'…';
        } else if(label.length*cw>maxW){ const n=Math.floor(maxW/cw)-1; label=label.slice(0,n)+'…'; }
        nm.textContent=label+(it.slide?' ⁺':''); g.appendChild(nm);
      if(it.sub){ const stl=SUB_STYLE[it.sub];
        g.appendChild(gel('rect',{x:subX,y:cy-9,width:subW-2,height:18,rx:9,fill:stl.bg}));
        const sbt=gel('text',{x:subX+(subW-2)/2,y:cy+4,'font-size':10.5,fill:stl.fg,'text-anchor':'middle','font-weight':700}); sbt.textContent=it.sub; g.appendChild(sbt);
      } else {
        const dash=gel('text',{x:subX+(subW-2)/2,y:cy+4,'font-size':11,fill:'var(--ink2)','text-anchor':'middle',opacity:.45}); dash.textContent='—'; g.appendChild(dash);
      }
        const col=ST[it.st].col;
        const tip=document.createElementNS(NS,'title');
        tip.textContent=T(it)+' · '+T(ST[it.st])+' · '+it.next.d+' '+T(it.next);
        g.appendChild(tip);
        if(it.u){
          const label2=T(it.next);
          const pw=Math.min(label2.length*(L.lang==='zh'?12:6.6)+18, tbcW-14);
          const px=tbcX+(tbcW-pw)/2-4;
          g.appendChild(gel('rect',{x:px,y:cy-10,width:pw,height:20,rx:10,fill:'var(--card)',stroke:col,'stroke-width':1.4,'stroke-dasharray': it.st==='proposal'?'5 3':'none'}));
          const pt=gel('text',{x:px+pw/2,y:cy+4,'font-size':11,fill:'var(--ink)','text-anchor':'middle'}); pt.textContent=label2; g.appendChild(pt);
        } else {
          it.g.forEach(ev=>{
            if(ev.k==='dia'){
              const x=X(ev.d); if(x<plotX-4||x>plotX+plotW+4) return;
              const s=7;
              g.appendChild(gel('polygon',{points:x+','+(cy-s)+' '+(x+s)+','+cy+' '+x+','+(cy+s)+' '+(x-s)+','+cy,
                fill: ev.hollow?'var(--card)':col, stroke:col,'stroke-width':1.8}));
              if(ev.hollow && it.slide){
                g.appendChild(gel('line',{x1:x+s+2,y1:cy,x2:x+s+30,y2:cy,stroke:col,'stroke-width':1.3,'stroke-dasharray':'3 3'}));
                g.appendChild(gel('polygon',{points:(x+s+30)+','+(cy-3.5)+' '+(x+s+30)+','+(cy+3.5)+' '+(x+s+36)+','+cy,fill:col}));
              }
              if(ev.lb){ let lbt=T(ev.lb);
                if(ev.hollow && (lbt.indexOf('原定')===0 || lbt.indexOf('orig.')===0)) lbt=lbt+' '+ev.d;
                if(ev.hollow && it.mech) lbt=lbt+(L.lang==='zh'?' · +'+it.mech.n+'个月':' · +'+it.mech.n+'mo');
                let lbx=(ev.hollow && it.slide)? x+s+42 : x+s+5, anch='start', lby=ev.labAbove? cy-13 : cy+3.5;
                if(lbx>plotX+plotW-60){ lbx=x-s-5; anch='end'; lby=cy-13; }
                const lb=gel('text',{x:lbx,y:lby,'font-size':10.5,fill:'var(--ink2)','text-anchor':anch,'paint-order':'stroke',stroke:'var(--card)','stroke-width':3,'stroke-linejoin':'round'}); lb.textContent=lbt; g.appendChild(lb); }
              const days=Math.round((pd(ev.d)-TODAY)/DAY);
              if(!ev.hollow && days>=0 && days<=130){
                const bt=(L.lang==='zh'? days+' 天' : days+'d');
                const bw=bt.length*7.5+10;
                g.appendChild(gel('rect',{x:x-bw/2,y:cy-24,width:bw,height:14,rx:7,fill: days<=40?'var(--alert)':'var(--steel)'}));
                const btx=gel('text',{x:x,y:cy-13.5,'font-size':9.5,fill:'#fff','text-anchor':'middle','font-weight':700}); btx.textContent=bt; g.appendChild(btx);
              }
            } else if(ev.k==='bar'){
              const x1=X(ev.f), x2=X(ev.t); if(x2<plotX||x1>plotX+plotW) return;
              const cx1=Math.max(x1,plotX), cx2=Math.min(x2,plotX+plotW);
              g.appendChild(gel('rect',{x:cx1,y:cy-5,width:cx2-cx1,height:10,rx:5,
                fill: ev.dashed?'none':col,'fill-opacity': ev.dashed?0:0.75, stroke:col,'stroke-width': ev.dashed?1.4:0,'stroke-dasharray': ev.dashed?'5 4':'none'}));
              if(ev.lb){ let lx=x2+6, anch='start'; if(lx>W-tbcW-90){ lx=cx2-6; anch='end'; }
                const lb=gel('text',{x:lx,y:cy+3.5,'font-size':10.5,fill:'var(--ink2)','text-anchor':anch,'paint-order':'stroke',stroke:'var(--card)','stroke-width':3,'stroke-linejoin':'round'}); lb.textContent=T(ev.lb); g.appendChild(lb); }
            }
          });
        }
        g.addEventListener('click',()=>select(it.id,true));
        svg.appendChild(g);
        rowOf[it.id]=y;
        y+=rowH;
      });
    });
    y+=secGap;
  });
}
/* detail modal */
function closeModal(){
  expanded=false;
  $('#modalBg').classList.remove('open');
  document.body.style.overflow='';
  renderChart();
}
function select(id,toggle){
  const it=byId[id]; if(!it) return;
  if(toggle && expanded && selected===id){ closeModal(); return; }
  selected=id; expanded=true;
  renderChart();
  $('#modalDetail').innerHTML='<h3>'+T(it)+'</h3><div class="en">'+it.en+' · '+(L.lang==='zh'?it.ref:(it.refe||it.ref))+'</div>'+pill(it.st)+
    (it.slide?'<span class="slide-mark">'+(L.lang==='zh'?'附条件日期':'Conditional date')+'</span>':'')+
    '<dl class="kv" style="margin-top:12px"><dt>'+(L.lang==='zh'?'依据':'Basis')+'</dt><dd>'+T(it.basis)+'</dd>'+
    '<dt>'+(L.lang==='zh'?'关键日期':'Key dates')+'</dt><dd>'+T(it.dates)+'</dd>'+
    (it.sub?'<dt>'+(L.lang==='zh'?'待通过子法规':'Outstanding sub-act')+'</dt><dd>'+({DA:'委托法案（delegated act）',IA:'实施法案（implementing act）','DA+IA':'委托法案＋实施法案（delegated + implementing acts）'})[it.sub]+'</dd>':'')+
    (it.orig?'<dt>'+(L.lang==='zh'?'条文原定':'Original schedule')+'</dt><dd>'+it.orig.d+'（'+T(it.orig)+'）'+(L.lang==='zh'?'，实际起算以子法规通过为准':', actual start depends on the sub-act being adopted')+'</dd>':'')+'</dl>'+
    (SRC[it.id]?'<div class="src"><b>'+(L.lang==='zh'?'原始来源：':'Sources: ')+'</b>'+SRC[it.id].map(a=>'<a href="'+a[2]+'" target="_blank" rel="noopener">'+(L.lang==='zh'?a[0]:a[1])+'</a>').join(' · ')+'</div>':'')+
    (it.mech?'<div class="mech"><b>'+(L.lang==='zh'?'起算机制：':'Start rule: ')+'</b>'+(L.lang==='zh'
      ?'实际起算 ＝ 较晚者 —— ① 条文原定日 '+it.orig.d+'（'+T(it.orig)+'）；② '+it.mech.zh+'生效后 '+it.mech.n+' 个月。'
      :'the later of — (1) the original date '+it.orig.d+' ('+T(it.orig)+'); (2) '+it.mech.n+' months after the '+it.mech.en+' enter into force.')+'</div>':'')+
    (T(it.note)?'<div class="note">'+T(it.note)+'</div>':'');
  const outIds=new Set(it.rel.map(r=>r[0]));
  const rows=it.rel.map(([to,k,ke])=>{ const t=byId[to]; return t?'<div class="row"><span class="rel-chip" data-to="'+to+'"><span class="k">'+(L.lang==='zh'?k:ke)+'</span>'+T(t)+'</span> '+pill(t.st)+'</div>':''; }).join('')
    + ITEMS.filter(o=>o.id!==id&&!outIds.has(o.id)&&o.rel.some(r=>r[0]===id)).map(o=>'<div class="row"><span class="rel-chip" data-to="'+o.id+'"><span class="k">'+(L.lang==='zh'?'被引用':'Referenced by')+'</span>'+T(o)+'</span> '+pill(o.st)+'</div>').join('');
  $('#modalNbr').innerHTML=rows||'<div class="row" style="color:var(--ink2)">'+(L.lang==='zh'?'无跨法规关系（从属关系见泳道分组）':'No cross-act links (parentage shown by lanes)')+'</div>';
  $('#modalNbr').querySelectorAll('.rel-chip').forEach(c=>c.addEventListener('click',()=>{ select(c.dataset.to,false); document.querySelector('.modal').scrollTop=0; }));
  $('#modalBg').classList.add('open');
  document.body.style.overflow='hidden';
}
function fmtAsof(){ const d=new Date(TODAY), y=d.getUTCFullYear(), mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]; const el=document.getElementById('asof'); if(el) el.textContent = L.lang==='zh' ? (y+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')) : (d.getUTCDate()+' '+mo+' '+y); }
function rerender(){ fillStatic(); fmtAsof(); renderLegend(); if(expanded&&selected) select(selected,false); else renderChart(); }
$('#modalX').addEventListener('click',closeModal);
$('#modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&expanded) closeModal(); });
/* toolbar */
$('#winSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  win = b.dataset.w==='all'? {f:'2025-01-01',t:'2032-06-30'} : {f:'2026-07-01',t:'2028-10-31'};
  $('#winSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  renderChart();
}));
$('#langZh').addEventListener('click',()=>{ L.lang='zh'; $('#langZh').classList.add('on'); $('#langEn').classList.remove('on'); rerender(); });
$('#langEn').addEventListener('click',()=>{ L.lang='en'; $('#langEn').classList.add('on'); $('#langZh').classList.remove('on'); rerender(); });
$('#themeBtn').addEventListener('click',()=>{
  const h=document.documentElement, dark=h.dataset.theme!=='dark';
  h.dataset.theme=dark?'dark':'light';
  $('#themeBtn').textContent=dark?(L.lang==='zh'?'浅色':'Light'):(L.lang==='zh'?'深色':'Dark');
  renderChart();
});
rerender();
</script>
